# XRT settings for FireSim hardware emulation (TARGET=hw_emu).
#
# Without this XRT logs every signal of the emulated shell and target to a
# waveform database: 797 MB for a 22k-cycle demo, and the dominant cost of the
# run. Set debug_mode=batch to get the waveform back when it is wanted.
[Emulation]
debug_mode=off

  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_10.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_11.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_12.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_13.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",

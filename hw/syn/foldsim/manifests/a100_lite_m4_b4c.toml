memory_registers = "auto"

[platform]
kernel = "foldsim_afu"
adapter = "axi4"                 # the target's memory: AXI4 masters m_axi_mem_<k>, one endpoint each
mem_ports = 4                    # VX_CFG_PLATFORM_MEMORY_NUM_BANKS
mem_id_width = 6                 # 4 + clog2(mem_ports)
mem_channel_shift = 2            # interleaved ports (VX_CFG_PLATFORM_MEMORY_INTERLEAVE)
clock_mhz = 250                  # FOLDSIM_FREQ (B4c images: img_b4c 250, img_b4c50 50)
device = "xcv80-lsva4737-2MHP-e-S"
control = { start = "start", busy = "busy", dcr_req = "dcr_req", dcr_rsp = "dcr_rsp" }
axi_spec = 2

[options]
modulo = true
bubbles = true
zero_chain_hops = 2
zero_latency_chains = true
zero_latency_links = true
static = true

[lift]
units = [
  "VX_socket:drop=INSTANCE_ID",
  "VX_core:drop=INSTANCE_ID",
  "VX_compute_slice:drop=INSTANCE_ID,SLICE_STR",
  "VX_cache_bank:drop=INSTANCE_ID,BANK_ID;sets",
]

[flow]
generator = "vortex"             # hw/syn/foldsim `sources` (ci/gen_config.py + gen_sources.sh)
xlen = 64
vortex = "fa40cf125"             # a100/timing-int, as built for B4c
policy = "st32_1031/lk2/calm4a3/policy_cal.json"   # where memory.* came from (gen.sh)
configs = [
  "-DVX_CFG_DCACHE_MSHR_SIZE=24",
  "-DVX_CFG_DCACHE_NUM_WAYS=8",
  "-DVX_CFG_DCACHE_SIZE=131072",
  "-DVX_CFG_EXT_A_ENABLE",
  "-DVX_CFG_EXT_D_ENABLE",
  "-DVX_CFG_EXT_DMA_DISABLE",
  "-DVX_CFG_EXT_DXA_DISABLE",
  "-DVX_CFG_EXT_MUFU_ENABLE",
  "-DVX_CFG_EXT_OM_DISABLE",
  "-DVX_CFG_EXT_RASTER_DISABLE",
  "-DVX_CFG_EXT_RTU_DISABLE",
  "-DVX_CFG_EXT_TCU_ENABLE",
  "-DVX_CFG_EXT_TEX_DISABLE",
  "-DVX_CFG_EXT_ZACAS_ENABLE",
  "-DVX_CFG_EXT_ZFHMIN_ENABLE",
  "-DVX_CFG_FCVT_PE_RATIO=4",
  "-DVX_CFG_FDIV_PE_RATIO=16",
  "-DVX_CFG_FETCH_WIDTH=4",
  "-DVX_CFG_FSQRT_PE_RATIO=16",
  "-DVX_CFG_ICACHE_NUM_WAYS=16",
  "-DVX_CFG_ICACHE_SIZE=131072",
  "-DVX_CFG_ISSUE_WIDTH=4",
  "-DVX_CFG_L2_ENABLE",
  "-DVX_CFG_L2_MSHR_SIZE=192",
  "-DVX_CFG_L2_NUM_BANKS=4",
  "-DVX_CFG_L2_NUM_WAYS=16",
  "-DVX_CFG_L2_SIZE=1048576",
  "-DVX_CFG_LMEM_LOG_SIZE=16",
  "-DVX_CFG_LMEM_NUM_BANKS=16",
  "-DVX_CFG_NUM_ALU_LANES=16",
  "-DVX_CFG_NUM_BARRIERS=16",
  "-DVX_CFG_NUM_CLUSTERS=1",
  "-DVX_CFG_NUM_CORES=4",
  "-DVX_CFG_NUM_FPU_LANES=16",
  "-DVX_CFG_NUM_MUFU_LANES=4",
  "-DVX_CFG_NUM_SFU_BLOCKS=4",
  "-DVX_CFG_NUM_THREADS=32",
  "-DVX_CFG_NUM_WARPS=64",
  "-DVX_CFG_PLATFORM_CLOCK_RATE=1410",
  "-DVX_CFG_PLATFORM_MEMORY_DATA_RATE=900",
  "-DVX_CFG_PLATFORM_MEMORY_LATENCY=190",
  "-DVX_CFG_PLATFORM_MEMORY_NUM_BANKS=4",
  "-DVX_CFG_PLATFORM_MEMORY_PEAK_BW=57593",
  "-DVX_CFG_PLATFORM_MEMORY_QUEUE_SIZE=257",
  "-DVX_CFG_PLATFORM_MEMORY_TYPE=HBM2",
  "-DVX_CFG_SOCKET_SIZE=1",
  "-DVX_CFG_TCU_FP16_ENABLE",
  "-DVX_CFG_TCU_FP4_DISABLE",
  "-DVX_CFG_TCU_FP8_DISABLE",
  "-DVX_CFG_TCU_INT4_ENABLE",
  "-DVX_CFG_TCU_INT8_ENABLE",
  "-DVX_CFG_TCU_MX_DISABLE",
  "-DVX_CFG_TCU_MXFP4_DISABLE",
  "-DVX_CFG_TCU_NVFP4_DISABLE",
  "-DVX_CFG_TCU_SPARSE_ENABLE",
  "-DVX_CFG_TCU_TF32_ENABLE",
  "-DVX_CFG_TCU_WGMMA_DISABLE",
  "-DVX_CFG_VM_ENABLE",
  "-DVX_PROFILE=a100_lite_m4",
  "-DVX_CFG_NUM_LSU_LANES=8",
  "-DVX_CFG_DCACHE_NUM_BANKS=4",
  "-DVX_CFG_NUM_FP64_LANES=8",
]

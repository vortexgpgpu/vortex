# Vortex A100-lite 4-SM FP64 fold "B4c": its foldsim target manifest, the whole recipe of the fold.
# make FOLDSIM_MANIFEST=manifests/a100_lite_m4_b4c.toml generate: the configuration ([flow] configs, xlen), the
# units lifted ([lift]), the classes and every driver option; [platform] binds the kernel shell (AXI4 memory
# ports, the clock). ${FOLDSIM_WORK_DIR}: the flow's work dir (its lift/srcs.f is the driver's source list).
[design]
format = 1
name = "vortex-a100-m4-b4c"
top = "foldsim_target"

[rtl]
srcs = "${FOLDSIM_WORK_DIR}/lift/srcs.f"
max_unroll_trip_count = 8192
max_generate_steps = 4194304

[classes]
at = [
  "l2fs@*.l2cache.*.core_req_xbar.*.fanout_slice_arb",
  "l2req@inner:*.l2cache.*.core_req_xbar.*.xbar_arb",
  "l2req@inner:*.l2cache.*.core_req_xbar.*.fanout_join_arb",
  "l2sw@*.l2cache.*.g_omega.*.xbar_switch",
  "l2x@*.l2cache.*.xbar_arb",
  "axix@*.axi_adapter.*.xbar_arb",
  "l2rs@*.l2cache.*.g_core_req_stage.*.req_stage",
  "l2nb@*.l2cache.*.core_bus_nc_switch.rsp_arb.*.out_buf",
  "l2ab@*.l2cache.*.core_bus_nc_arb.*.fanout_slice_arb.*.out_buf",
  "lmq@*.local_mem.req_xbar.*.xbar_arb",
  "lms@*.local_mem.rsp_xbar.*.xbar_arb",
  "l1req@*.dcache.*.core_req_xbar.*.xbar_arb",
  "l1rsp@*.dcache.*.core_rsp_arb",
  "l1sw@*.dcache.*.g_omega.*.xbar_switch",
  "l1x@*.dcache.*.xbar_arb",
  "l2mo@*.l2cache.*.mem_bus_out_arb.req_arb.*.out_buf",
  "kmub@*.cluster.kmu_arb.*.out_buf.g_eb2.stream_buffer",
]
absorb_exclusive = [
  "l2rs",
  "l2nb",
  "l2mo",
  "l2ab*",
  "kmub",
]
nest = true
copies = { lms = 2, VX_tcu_fedp_tfr = 4, VX_fncp_unit = 2 }
modules = [
  "VX_socket__lift",
  "VX_core__lift",
  "VX_compute_slice__lift",
  "VX_fdiv_unit",
  "VX_fsqrt_unit",
  "VX_fcvt_unit",
  "VX_fncp_unit",
  "VX_mufu_pe",
  "VX_tcu_fedp_tfr",
  "l2req+VX_cache_bank__lift_l2cache",
  "VX_cache_bank__lift_icache",
  "lmq+VX_local_mem_bank",
  "l1req+VX_cache_bank__lift_dcache",
  "VX_opc_unit",
]

[env]
sinks = [
  "busy",
  "dcr_rsp_valid",
  "dcr_rsp_data",
]

[memory]
virtual = "__lift_l2cache:.*cache_data/g_data_slice_[0-9]+\\.data_store/"
vmem_cache_rows = "auto"
compact_links = true
link_block_depth = 64
link_ultra_depth = 2048
link_kinds = [
  "VX_cache_bank__lift_icache:VX_socket__lift_model:distributed",
  "VX_compute_slice__lift_model:VX_compute_slice__lift_model:distributed",
  "VX_compute_slice__lift_model:VX_core__lift_model:distributed",
  "VX_compute_slice__lift_model:VX_fcvt_unit:distributed",
  "VX_compute_slice__lift_model:VX_fdiv_unit:distributed",
  "VX_compute_slice__lift_model:VX_fncp_unit:distributed",
  "VX_compute_slice__lift_model:VX_fsqrt_unit:distributed",
  "VX_compute_slice__lift_model:VX_mufu_pe:distributed",
  "VX_compute_slice__lift_model:VX_opc_unit:distributed",
  "VX_compute_slice__lift_model:VX_tcu_fedp_tfr:distributed",
  "VX_compute_slice__lift_model:lmq_VX_local_mem_bank:distributed",
  "VX_compute_slice__lift_model:lms:distributed",
  "VX_core__lift_model:VX_compute_slice__lift_model:distributed",
  "VX_core__lift_model:VX_socket__lift_model:distributed",
  "VX_core__lift_model:lmq_VX_local_mem_bank:distributed",
  "VX_core__lift_model:lms:distributed",
  "VX_fcvt_unit:VX_compute_slice__lift_model:distributed",
  "VX_fdiv_unit:VX_compute_slice__lift_model:distributed",
  "VX_fncp_unit:VX_compute_slice__lift_model:distributed",
  "VX_fsqrt_unit:VX_compute_slice__lift_model:distributed",
  "VX_mufu_pe:VX_compute_slice__lift_model:distributed",
  "VX_opc_unit:VX_compute_slice__lift_model:distributed",
  "VX_socket__lift_model:VX_cache_bank__lift_icache:distributed",
  "VX_socket__lift_model:VX_compute_slice__lift_model:distributed",
  "VX_socket__lift_model:VX_core__lift_model:distributed",
  "VX_socket__lift_model:l1req_VX_cache_bank__lift_dcache:distributed",
  "VX_socket__lift_model:l1rsp:distributed",
  "VX_socket__lift_model:l1sw_0:distributed",
  "VX_socket__lift_model:l1sw_1:distributed",
  "VX_socket__lift_model:l2nb:distributed",
  "VX_tcu_fedp_tfr:VX_compute_slice__lift_model:distributed",
  "axix_1:l2nb:distributed",
  "kmub:VX_core__lift_model:distributed",
  "kmub:VX_socket__lift_model:distributed",
  "l1req_VX_cache_bank__lift_dcache:VX_socket__lift_model:distributed",
  "l1req_VX_cache_bank__lift_dcache:l1sw_0:distributed",
  "l1rsp:VX_socket__lift_model:distributed",
  "l1sw_0:VX_socket__lift_model:distributed",
  "l1sw_0:l1req_VX_cache_bank__lift_dcache:distributed",
  "l1sw_0:l1sw_0:distributed",
  "l1sw_1:VX_socket__lift_model:distributed",
  "l1sw_1:l1req_VX_cache_bank__lift_dcache:distributed",
  "l1sw_1:l1sw_1:distributed",
  "l2fs_0:l2req_VX_cache_bank__lift_l2cache:distributed",
  "l2fs_1:l2req_VX_cache_bank__lift_l2cache:distributed",
  "l2nb:VX_socket__lift_model:distributed",
  "l2req_VX_cache_bank__lift_l2cache:l2sw_0:distributed",
  "l2req_VX_cache_bank__lift_l2cache:l2sw_1:distributed",
  "l2rs:l2fs_0:distributed",
  "l2sw_0:l2req_VX_cache_bank__lift_l2cache:distributed",
  "l2sw_1:l2sw_1:distributed",
  "l2sw_1:l2nb:distributed",
  "l2sw_2:l2mo:distributed",
  "l2sw_2:l2req_VX_cache_bank__lift_l2cache:distributed",
  "lmq_VX_local_mem_bank:VX_core__lift_model:distributed",
  "lmq_VX_local_mem_bank:lms:distributed",
  "lms:VX_compute_slice__lift_model:distributed",
  "lms:VX_core__lift_model:distributed",
]
staged_links = true
share_links = true
storage = [
  "VX_socket__lift_model:regs>=0=registers",
  "VX_socket__lift_model:regs>=1=distributed",
  "VX_socket__lift_model:inner/dmmu/tlb/mshr/reqpool/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_socket__lift_model:inner/immu/tlb/mshr/reqpool/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",

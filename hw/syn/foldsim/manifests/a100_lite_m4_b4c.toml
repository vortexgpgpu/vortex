  "VX_core__lift_model:regs>=0=registers",
  "VX_core__lift_model:inner/scheduler/warp_shared_unit/bar_unit/barrier_state_store/g_no_asic.g_sync.g_lutram.g_write_first.g_no_wren.ram=block",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_0.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_1.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_2.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_3.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_4.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_5.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",
  "VX_compute_slice__lift_model:inner/backend_slice/issue_slice/ibuffer/g_bufs_6.instr_buf/g_ebN.fifo_queue/g_depth_n.dp_ram/g_no_asic.g_sync.g_auto.g_write_first.g_no_wren.ram=distributed",

#
# logic_gate — logic-level regression gate on hosted runners.
# Runs Beacon over the DUT catalog (ci/testcases/logic_gate.yaml), through
# foldsim-estimate-timing, and asserts the depth of every RTL unit against the
# golden results in ci/baselines/synthesis/beacon/, so an RTL change that makes
# a unit deeper is named on the change that does it, not the next night.
#
# The gate itself runs in ci.yml, as the logic_gate cell planned with
# perf_gate's rtlsim cells. This workflow is the manual entry point: a subset of
# the catalog on a hosted runner, or the full-GPU builds (group gpu), which need
# ~95 GB per build and run only on the self-hosted machine.
#
# See docs/designs/continuous_integration.md §4.6.

name: Timing Gate

on:
  workflow_dispatch:
    inputs:
      builds:
        description: "build ids/groups, space separated (blank = all)"
        default: ""
      gpu:
        description: "run the full-GPU builds (group gpu) on the self-hosted machine instead"
        type: boolean
        default: false

concurrency:
  group: logic-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DISABLE: 1

jobs:
  beacon:
    if: ${{ !inputs.gpu }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Restores the prebuilt toolchain (CIRCT among it) and exports TOOLDIR;
      # prepare=true installs it on a cache miss.
      - name: Setup Vortex
        uses: ./.github/actions/setup-vortex
        with:
          prepare: true

      # foldsim is not in the base toolchain. Its prebuilt is a small fetch.
      - name: Install foldsim
        run: |
          set -euo pipefail
          mkdir -p tc_foldsim && cd tc_foldsim
          ../configure --tooldir=$TOOLDIR
          ci/toolchain_install.sh --foldsim

      # The command is the one the catalog declares (the `gate` case of
      # ci/testcases/logic_gate.yaml), so what CI runs and what the catalog
      # says cannot drift apart.
      - name: Gate
        id: run
        env:
          IN_BUILDS: ${{ github.event.inputs.builds }}
        run: |
          set -uo pipefail
          CMD=$(python3 -c "import yaml; print(next(t['run'] for t in yaml.safe_load(open('ci/testcases/logic_gate.yaml'))['tests'] if t['id'] == 'gate'))")
          # Dispatch inputs reach the shell through an env var, never
          # interpolated into the script.
          ARGS=()
          for b in ${IN_BUILDS:-}; do ARGS+=(-b "$b"); done
          rc=0
          $CMD "${ARGS[@]}" --timeout 3600 --report logic_gate.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize
        if: always()
        run: |
          set -uo pipefail
          python3 ci/synth_report.py --annotate error logic_gate.json \
            > logic_gate_report.md || true
          cat logic_gate_report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-gate
          path: |
            logic_gate.json
            logic_gate_report.md
            build32_logic_gate/hw/syn/xilinx/dut/logic_gate_*/build.log
            build32_logic_gate/hw/syn/xilinx/dut/logic_gate_*/beacon_*
            build32_logic_gate/hw/syn/xilinx/dut/logic_gate_*/beacon/report.txt
          if-no-files-found: warn

      - name: Verdict
        run: |
          case "${{ steps.run.outputs.rc }}" in
            0) echo "logic_gate passed" ;;
            1) echo "::error::logic_gate FAILED — a unit got deeper, an area grew, or a baseline is stale or missing (see the summary)"; exit 1 ;;
            *) echo "::error::logic_gate build error (see logs)"; exit 1 ;;
          esac

  # The full-GPU builds: ~30 min and ~95 GB each, run one at a time, which no
  # hosted runner has the memory for. Manual dispatch only (gpu: true), on the
  # self-hosted machine the FPGA gate uses.
  gpu:
    if: ${{ inputs.gpu }}
    runs-on: [self-hosted, linux, vivado]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Vortex
        uses: ./.github/actions/setup-vortex
        with:
          prepare: true

      - name: Install foldsim
        run: |
          set -euo pipefail
          mkdir -p tc_foldsim && cd tc_foldsim
          ../configure --tooldir=$TOOLDIR
          ci/toolchain_install.sh --foldsim

      # The catalog's `gpu` case; a dispatch's builds narrow it.
      - name: Gate
        id: run
        env:
          IN_BUILDS: ${{ github.event.inputs.builds }}
        run: |
          set -uo pipefail
          CMD=$(python3 -c "import yaml; print(next(t['run'] for t in yaml.safe_load(open('ci/testcases/logic_gate.yaml'))['tests'] if t['id'] == 'gpu'))")
          ARGS=()
          for b in ${IN_BUILDS:-}; do ARGS+=(-b "$b"); done
          # -b selections add up, so the dispatched builds replace the
          # catalog's `-b gpu` instead of joining it.
          [ ${#ARGS[@]} -gt 0 ] && CMD=$(echo "$CMD" | sed -E 's/(^| )-b gpu( |$)/ /')
          rc=0
          $CMD "${ARGS[@]}" --report logic_gate_gpu.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize
        if: always()
        run: |
          set -uo pipefail
          python3 ci/synth_report.py --annotate error logic_gate_gpu.json \
            > logic_gate_gpu_report.md || true
          cat logic_gate_gpu_report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-gate-gpu
          path: |
            logic_gate_gpu.json
            logic_gate_gpu_report.md
            build*_logic_gate/hw/syn/xilinx/dut/logic_gate_gpu*/build.log
            build*_logic_gate/hw/syn/xilinx/dut/logic_gate_gpu*/beacon_*
            build*_logic_gate/hw/syn/xilinx/dut/logic_gate_gpu*/beacon/report.txt
          if-no-files-found: warn

      - name: Verdict
        run: |
          case "${{ steps.run.outputs.rc }}" in
            0) echo "logic_gate gpu passed" ;;
            1) echo "::error::logic_gate gpu FAILED — a unit got deeper, an area grew, or a baseline is stale or missing (see the summary)"; exit 1 ;;
            *) echo "::error::logic_gate gpu build error (see logs)"; exit 1 ;;
          esac

#
# asic_gate — nightly ASIC synthesis-regression gate on hosted runners.
# Synthesizes the DUT catalog (ci/testcases/asic_gate.yaml) through
# Yosys + OpenSTA on ASAP7 and asserts Fmax/cell area against the golden results
# in ci/baselines/synthesis/yosys/, so an RTL change that costs timing closure or
# area cannot sit unnoticed on master.
#
# Why its own workflow rather than a cell in ci.yml:
#
#   - A DUT takes 1-2 hours, so the builds must fan out to ONE STANDALONE JOB
#     EACH. A ci.yml cell is one job running a pytest slice; eight sequential
#     synthesis runs in one cell would be a day.
#   - Nightly builds are expensive even when free, so the nightly runs only
#     after a push changed what it synthesizes. GitHub cannot condition a
#     schedule on the repository, so the workflow stays DISABLED between those
#     pushes: ci.yml's plan job enables it on a push to master that touches the
#     synthesis inputs, and the scheduled run disables it again as it starts.
#     A quiet night therefore creates no run at all. A manual run needs the
#     workflow enabled first (`gh workflow enable asic_gate.yml`).
#
# It always gates master, whatever branch the schedule happens to fire on. No
# licence and no dedicated machine: yosys/sv2v/OpenSTA ship in the prebuilt
# toolchain and ASAP7 is a 59 MB content-addressed fetch.
#
# See docs/designs/continuous_integration.md §3.5.

name: ASIC Gate

on:
  schedule:
    - cron: '0 4 * * *'         # nightly 04:00 UTC (an hour behind fpga_gate)
  workflow_dispatch:
    inputs:
      builds:
        description: "build ids/groups, space separated (blank = all)"
        default: ""

# One sweep at a time. Never cancel a run in flight -- hours of synthesis are
# already spent.
concurrency:
  group: asic-gate
  cancel-in-progress: false

env:
  CCACHE_DISABLE: 1

jobs:
  # ---------------------------------------------------------------------------
  # plan — disarm the nightly, and emit one matrix entry per build.
  # No build env; just PyYAML.
  # ---------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    outputs:
      run: ${{ steps.q.outputs.run }}
      builds: ${{ steps.q.outputs.builds }}
      sha: ${{ steps.q.outputs.sha }}
    steps:
      # First, so a push that lands while this run synthesizes re-arms the next
      # night instead of being cleared when this one ends. A failure here only
      # costs an extra night, so it warns rather than blocking the gate.
      - name: Disarm until the next push
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/asic_gate.yml/disable" \
            || echo "::warning::could not disable asic_gate.yml; it will run again tomorrow"

      - uses: actions/checkout@v4
        with:
          ref: master               # hard-pinned: the gate always tracks master
      - run: pip install --quiet pyyaml

      - name: Plan builds
        id: q
        env:
          IN_BUILDS: ${{ github.event.inputs.builds }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "gating $SHA"
          # Dispatch inputs only narrow the catalog, and reach the shell through
          # an env var: interpolating one into the script would let a dispatch
          # value execute arbitrary commands on the runner.
          ARGS=()
          for b in ${IN_BUILDS:-}; do ARGS+=(-b "$b"); done
          BUILDS=$(python3 ci/asic_gate.py --matrix "${ARGS[@]}")
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"
          [ "$BUILDS" = "[]" ] && echo "run=false" >> "$GITHUB_OUTPUT" || echo "run=true" >> "$GITHUB_OUTPUT"
          python3 ci/testcase.py lint

  # ---------------------------------------------------------------------------
  # toolchain — install the prebuilt toolchain once, on a cache miss, so the
  # synth matrix below only ever restores it.
  #
  # setup-vortex with the default prepare=false RESTORES the toolchain cache and
  # exports TOOLDIR, but installs NOTHING when the key misses -- and that key
  # carries the commit TOOLCHAIN_REV currently resolves to, so a prebuilt refresh
  # misses it by construction. Without this job the whole matrix would then run
  # against an empty $TOOLDIR and every build would die in gen_sources.sh looking
  # for verilator: a toolchain bump would read as eight simultaneous RTL errors.
  # ci.yml warms the same cache from its own `setup` job, but ci.yml is weekly
  # plus on-push, so a nightly cannot depend on it having run since the bump.
  #
  # One job rather than prepare=true inside the matrix: six parallel jobs would
  # each download the whole toolchain on the same miss.
  # ---------------------------------------------------------------------------
  toolchain:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive
      - uses: ./.github/actions/setup-vortex
        with:
          prepare: true

  # ---------------------------------------------------------------------------
  # synth — one standalone job per DUT. Each configures its own build tree and
  # gates exactly one build, so a 2-hour DUT costs 2 hours of wall time, not 2
  # hours of everyone else's.
  # ---------------------------------------------------------------------------
  synth:
    needs: [plan, toolchain]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      # Never cancel siblings: each DUT is an independent measurement, and one
      # regression must not hide the seven other numbers this run would have
      # produced.
      fail-fast: false
      max-parallel: 6
      matrix:
        build: ${{ fromJson(needs.plan.outputs.builds) }}
    steps:
      # The SHA the plan job resolved, not `master`: master moving mid-run must
      # not split one gate across two source trees.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive

      # Restores the prebuilt toolchain cache, which already carries yosys, sv2v
      # and OpenSTA (ci/toolchain_install.sh installs all three by default).
      - name: Setup Vortex
        uses: ./.github/actions/setup-vortex

      # ASAP7 is content-addressed by its manifest, so that file's hash IS the
      # cache key. Every job in the matrix shares it; the first to finish saves
      # it and the rest log a harmless "cache already exists". The gate installs
      # it on a miss (hw/syn/yosys/Makefile's `asap7` target) -- about a minute.
      - name: Cache ASAP7 PDK
        uses: actions/cache@v4
        with:
          path: build32_asic_gate/hw/syn/libs/asap7
          key: asap7-rvt-${{ hashFiles('hw/syn/libs/asap7/manifest.txt') }}

      # The command is the one the catalog declares (ci/testcases/asic_gate.yaml's
      # single `run:` case), narrowed to this job's build, so what CI runs and
      # what the catalog says cannot drift apart.
      - name: Gate ${{ matrix.build.id }}
        id: run
        env:
          BUILD_ID: ${{ matrix.build.id }}
        run: |
          set -uo pipefail
          CMD=$(python3 -c "import yaml; print(yaml.safe_load(open('ci/testcases/asic_gate.yaml'))['tests'][0]['run'])")
          rc=0
          # --timeout under the job's timeout-minutes, so a hung build is
          # reported BY the gate (with the phase it died in, and a report to
          # upload) instead of vanishing into a GitHub job kill.
          $CMD -b "$BUILD_ID" --timeout 16200 \
               --report "asic_gate_$BUILD_ID.json" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asic-gate-${{ matrix.build.id }}
          path: |
            asic_gate_${{ matrix.build.id }}.json
            build32_asic_gate/hw/syn/yosys/asic_gate_*/build.log
            build32_asic_gate/hw/syn/yosys/asic_gate_*/synth_summary.csv
            build32_asic_gate/hw/syn/yosys/asic_gate_*/reports/
          if-no-files-found: warn

      - name: Verdict
        run: |
          case "${{ steps.run.outputs.rc }}" in
            0) echo "asic_gate ${{ matrix.build.id }} passed" ;;
            1) echo "::error::asic_gate ${{ matrix.build.id }} FAILED — Fmax/area moved beyond threshold vs baseline"; exit 1 ;;
            *) echo "::error::asic_gate ${{ matrix.build.id }} build error (see logs)"; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # report — collect every build's verdict into one summary, and re-arm the
  # nightly when a build could not reach one.
  # ---------------------------------------------------------------------------
  report:
    needs: [plan, synth]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: asic-gate-*
          path: reports
          merge-multiple: true

      # `|| rc=$?` is load-bearing, exactly as in the Gate step: GitHub runs
      # `run:` under `bash -e`, and `set -uo pipefail` adds to that rather than
      # replacing it. Without the guard, synth_report.py's non-zero exit (1 =
      # regression, 2 = build error -- i.e. every case this step exists to
      # report) kills the step on that line, so `rc` never reaches
      # $GITHUB_OUTPUT and the re-arm step below reads it as "".
      - name: Summarize
        id: sum
        run: |
          set -uo pipefail
          rc=0
          python3 ci/synth_report.py --annotate error \
            --json asic_gate_report.json reports \
            > asic_gate_report.md || rc=$?
          cat asic_gate_report.md >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # A pass or a regression is a verdict, and the run is its record: a red
      # master is not re-synthesized every night. A build error (rc=2) is not,
      # so it re-arms the nightly to retry without waiting for another push.
      - name: Re-arm after a build error
        if: steps.sum.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/asic_gate.yml/enable" \
            || echo "::warning::could not re-enable asic_gate.yml; the next push re-arms it"

      # Unzipped, so the summary opens in the browser straight from the run
      # page, and the joined report it was rendered from downloads as itself.
      # The report holds everything a baseline records.
      - uses: actions/upload-artifact@v7
        with:
          path: asic_gate_report.md
          archive: false
          overwrite: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          path: asic_gate_report.json
          archive: false
          overwrite: true
          if-no-files-found: warn

# fpga_gate — FPGA synthesis-regression gate on the self-hosted Vivado runner.
# Synthesizes the DUT catalog (ci/testcases/fpga_gate.yaml) and asserts Fmax/LUT
# against the golden results in ci/baselines/synthesis/xilinx/, so an RTL change
# that costs timing closure or area cannot sit unnoticed on master.
#
# Builds are hours long, so the workflow has no schedule of its own: a nightly
# cron on the runner's host runs ci/fpga_gate_dispatch.sh, which dispatches it
# only when a synthesis input changed since the last gated commit (the state
# file below). A quiet night creates no run. It always gates origin/master.
#
# See docs/designs/continuous_integration.md §3.5.

name: FPGA Gate

on:
  workflow_dispatch:
    inputs:
      builds:
        description: "build ids/categories, space separated (blank = all)"
        default: ""
      jobs:
        description: "max parallel Vivado builds"
        default: "2"

# One synthesis sweep at a time: parallel Vivado runs would oversubscribe the
# machine and make Fmax non-comparable. Never cancel a run in flight.
concurrency:
  group: fpga-gate
  cancel-in-progress: false

jobs:
  fpga_gate:
    runs-on: [self-hosted, linux, vivado]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master               # hard-pinned: the gate always tracks master
          fetch-depth: 0
          submodules: recursive

      # The state file is the dispatcher's record of the last gated commit.
      - name: Resolve the gated commit
        id: gate
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "state=$HOME/.cache/vortex/fpga_gate.$(echo '${{ github.repository }}' | tr / _).sha" >> "$GITHUB_OUTPUT"
          echo "gating $SHA"

      # The command is the one the catalog declares (ci/testcases/fpga_gate.yaml's
      # single `run:` case), so what CI runs and what the catalog says cannot
      # drift apart. Dispatch inputs only narrow it, and reach the shell through
      # env vars: interpolating them into the script would let a dispatch value
      # execute arbitrary commands on the runner.
      - name: Run fpga_gate
        id: run
        env:
          IN_BUILDS: ${{ github.event.inputs.builds }}
          IN_JOBS: ${{ github.event.inputs.jobs }}
        run: |
          set -uo pipefail
          source ~/dev/xilinx_setup.sh
          CMD=$(python3 -c "import yaml; print(yaml.safe_load(open('ci/testcases/fpga_gate.yaml'))['tests'][0]['run'])")
          ARGS=()
          for b in ${IN_BUILDS:-}; do ARGS+=(-b "$b"); done
          [ -n "${IN_JOBS:-}" ] && ARGS+=(-j "$IN_JOBS")
          rc=0
          $CMD "${ARGS[@]}" --report fpga_gate_report.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # Every build's metrics against its baseline, and why each build that did
      # not pass did not, on the run's own page. The same document is uploaded
      # below as a file a browser opens directly.
      - name: Summarize
        if: always()
        run: |
          set -uo pipefail
          python3 ci/synth_report.py --annotate error fpga_gate_report.json \
            > fpga_gate_report.md || true
          cat fpga_gate_report.md >> "$GITHUB_STEP_SUMMARY"

      # A build that never produced metrics has its cause in the tool's log, not
      # in the gate's output. The whole log is in the artifact; its end is here.
      # The log is printed with workflow commands stopped, so nothing in it can
      # be read as one.
      - name: Failed build logs
        if: always()
        run: |
          set -uo pipefail
          TOKEN="log-$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          python3 ci/synth_report.py --build-failed fpga_gate_report.json |
          while read -r id dut; do
            log="build32_fpga_gate/hw/syn/xilinx/dut/fpga_gate_${id}_${dut}/build.log"
            [ -f "$log" ] || continue
            echo "::group::$id: last 200 lines of build.log"
            echo "::stop-commands::$TOKEN"
            tail -n 200 "$log"
            echo "::$TOKEN::"
            echo "::endgroup::"
          done

      # Record the SHA once the gate has actually reached a verdict (pass=0 or
      # regression=1), so a red master is not re-synthesized every night — the
      # failed run is the record. An infra/build failure (2) does NOT record, so
      # the next night's dispatcher retries it.
      - name: Record gated SHA
        if: steps.run.outputs.rc == '0' || steps.run.outputs.rc == '1'
        run: |
          mkdir -p "$(dirname '${{ steps.gate.outputs.state }}')"
          echo "${{ steps.gate.outputs.sha }}" > "${{ steps.gate.outputs.state }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpga-gate-report
          path: |
            fpga_gate_report.json
            build32_fpga_gate/hw/syn/xilinx/dut/fpga_gate_*/build.log
            build32_fpga_gate/hw/syn/xilinx/dut/fpga_gate_*/*.rpt
            build32_fpga_gate/hw/syn/xilinx/dut/fpga_gate_*/synth_summary.csv
          # A build that dies in elaboration leaves only its build.log, so a
          # path matching nothing turns a red gate into a red X with no evidence.
          if-no-files-found: error

      # Unzipped, so the summary opens in the browser straight from the run
      # page, and the report it was rendered from downloads as itself. The
      # report holds everything a baseline records.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: fpga_gate_report.md
          archive: false
          overwrite: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: fpga_gate_report.json
          archive: false
          overwrite: true
          if-no-files-found: warn

      # always(), not success(): the verdict must not be masked by an upload failure.
      - name: Verdict
        if: always()
        run: |
          case "${{ steps.run.outputs.rc }}" in
            0) echo "fpga_gate passed" ;;
            1) echo "::error::fpga_gate FAILED — Fmax/LUT moved beyond threshold vs baseline"; exit 1 ;;
            *) echo "::error::fpga_gate build error (see logs)"; exit 1 ;;
          esac

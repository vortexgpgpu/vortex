<text x="182" y="108" class="dm">sets of one bank</text>
<text x="522" y="108" class="dm">sets of one bank</text>
<text x="30" y="172" class="db-t">8 lines in each 4-way set: thrash</text>
<text x="30" y="190" class="dm">the other 30 sets stay empty</text>
<text x="350" y="172" class="g-t">1 line per set, 16 sets in use</text>
<text x="350" y="190" class="dm">the tag is stored unchanged:</text>
<text x="350" y="206" class="dm">the same XOR restores the raw set</text>

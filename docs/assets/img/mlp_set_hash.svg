<text x="162.0" y="148" text-anchor="middle" class="ds">16</text>
<text x="282.0" y="148" text-anchor="middle" class="ds">31</text>
<text x="480" y="42" text-anchor="middle" class="dm">set = addr[11:7] ⊕ fold(tag)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Sixteen rows 2 KB apart share their raw set bits and pile into 2 of the 32 sets of a bank; XORing the set bits with a fold of the tag spreads them over 16 sets.">
  <title>Sixteen rows 2 KB apart share their raw set bits and pile into 2 of the 32 sets of a bank; XORing the set bits with a fold of the tag spreads them over 16 sets.</title>
  <defs><marker id="sethas_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="sethas_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="sethas_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" text-anchor="middle" class="dh">Raw set index: 2 sets</text>
<text x="480" y="20" text-anchor="middle" class="dh">Hashed set index: 16 sets</text>
<g class="dl">
<text x="160" y="42" text-anchor="middle" class="dm">set = addr[11:7]</text>
<rect x="95" y="52" width="130" height="24" class="db"/><text x="160.0" y="68.0" text-anchor="middle" class="ds">16 rows, 2 KB apart</text>

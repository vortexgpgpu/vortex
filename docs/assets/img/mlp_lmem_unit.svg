<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Before, local memory gave every lane its own bank access, so two lanes reading the same word took two cycles. The warp-wide unit serves a whole warp request in passes: each bank goes to the lowest pending lane, same-word reads ride along, and conflicting lanes replay in the next pass.">
  <title>Before, local memory gave every lane its own bank access, so two lanes reading the same word took two cycles. The warp-wide unit serves a whole warp request in passes: each bank goes to the lowest pending lane, same-word reads ride along, and conflicting lanes replay in the next pass.</title>
  <defs><marker id="lmemun_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="lmemun_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="lmemun_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: one bank access per lane</text>
<text x="480" y="20" class="dh" text-anchor="middle">After: warp-wide passes</text>
<g class="dl">
<rect x="20" y="40" width="112" height="22" class="db"/><text x="76" y="55" text-anchor="middle" class="ds">L0: ld A · bank 0</text>
<rect x="20" y="70" width="112" height="22" class="db"/><text x="76" y="85" text-anchor="middle" class="ds">L1: ld A · bank 0</text>
<rect x="20" y="100" width="112" height="22" class="db"/><text x="76" y="115" text-anchor="middle" class="ds">L2: ld B · bank 1</text>
<rect x="20" y="130" width="112" height="22" class="db"/><text x="76" y="145" text-anchor="middle" class="ds">L3: ld C · bank 0</text>
<text x="148" y="44" class="dm">cycle</text>
<text x="206" y="44" text-anchor="middle" class="dm">1</text><text x="244" y="44" text-anchor="middle" class="dm">2</text><text x="282" y="44" text-anchor="middle" class="dm">3</text>
<text x="148" y="70" class="dm">bank 0</text>
<rect x="190" y="55" width="32" height="22" class="dbad"/>
<text x="206" y="70" text-anchor="middle" class="ds">L0</text>
<rect x="228" y="55" width="32" height="22" class="dbad"/>
<text x="244" y="70" text-anchor="middle" class="ds">L1</text>
<rect x="266" y="55" width="32" height="22" class="dbad"/>
<text x="282" y="70" text-anchor="middle" class="ds">L3</text>
<text x="148" y="110" class="dm">bank 1</text>
<rect x="190" y="95" width="32" height="22" class="db"/>
<text x="206" y="110" text-anchor="middle" class="ds">L2</text>
<line x1="134" y1="96" x2="144" y2="96" class="ln" marker-end="url(#lmemun_a)"/>
<text x="20" y="176" class="dm">L0 and L1 read the same word A,</text>
<text x="20" y="192" class="dm">but each lane takes its own access:</text>
<text x="20" y="208" class="dm db-t">3 cycles on bank 0</text>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
<rect x="340" y="40" width="112" height="22" class="db"/><text x="396" y="55" text-anchor="middle" class="ds">L0: ld A · bank 0</text>
<rect x="340" y="70" width="112" height="22" class="db"/><text x="396" y="85" text-anchor="middle" class="ds">L1: ld A · bank 0</text>
<rect x="340" y="100" width="112" height="22" class="db"/><text x="396" y="115" text-anchor="middle" class="ds">L2: ld B · bank 1</text>
<rect x="340" y="130" width="112" height="22" class="db"/><text x="396" y="145" text-anchor="middle" class="ds">L3: ld C · bank 0</text>
<text x="470" y="44" class="dm">pass</text>
<text x="534" y="44" text-anchor="middle" class="dm">1</text><text x="580" y="44" text-anchor="middle" class="dm">2</text>
<text x="470" y="70" class="dm">bank 0</text>
<rect x="512" y="55" width="44" height="22" class="dgood"/>
<text x="534" y="70" text-anchor="middle" class="ds">L0+L1</text>
<rect x="558" y="55" width="44" height="22" class="dgood"/>
<text x="580" y="70" text-anchor="middle" class="ds">L3</text>
<text x="470" y="110" class="dm">bank 1</text>
<rect x="512" y="95" width="44" height="22" class="dgood"/>
<text x="534" y="110" text-anchor="middle" class="ds">L2</text>
<line x1="454" y1="96" x2="466" y2="96" class="ln" marker-end="url(#lmemun_g)"/>
<text x="340" y="176" class="dm">each bank serves its lowest pending lane;</text>
<text x="340" y="192" class="dm">L1 rides along on word A, L3 replays: 2 passes</text>
<text x="340" y="208" class="dm">several LSU blocks: a read engine on port 2</text>
</g>
</svg>

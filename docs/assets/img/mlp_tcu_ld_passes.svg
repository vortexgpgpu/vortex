<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-label="A TCU_LD as wide as the warp could not go through an LSU with fewer lanes. It issues in passes of LSU-width consecutive words, each tagged with its pass, and each response writes only its pass&#x27;s lanes of the metadata RAM.">
  <title>A TCU_LD as wide as the warp could not go through an LSU with fewer lanes. It issues in passes of LSU-width consecutive words, each tagged with its pass, and each response writes only its pass&#x27;s lanes of the metadata RAM.</title>
  <defs><marker id="tculdp_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="tculdp_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="tculdp_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="236" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: one warp-wide request</text>
<text x="480" y="20" class="dh" text-anchor="middle">After: LSU-width passes</text>
<g class="dl">
<rect x="20" y="36" width="160" height="26" class="db"/><text x="100" y="53" text-anchor="middle">TCU_LD · 16 threads</text>
<line x1="100" y1="62" x2="100" y2="82" class="ln" marker-end="url(#tculdp_a)"/>
<rect x="20" y="84" width="160" height="24" class="dbad"/><text x="100" y="100" text-anchor="middle" class="ds">one 16-lane request</text>
<line x1="100" y1="108" x2="100" y2="130" class="lb" marker-end="url(#tculdp_b)"/>
<rect x="20" y="132" width="160" height="24" class="dbad"/><text x="100" y="148" text-anchor="middle" class="ds">LSU · 4 lanes</text>
<text x="20" y="180" class="dm">the TCU address unit assumed</text>
<text x="20" y="196" class="dm">TCU lanes = LSU lanes, so sparse and MX</text>
<text x="20" y="212" class="dm db-t">shapes with a narrower LSU could not run</text>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
<rect x="340" y="36" width="160" height="26" class="db"/><text x="420" y="53" text-anchor="middle">TCU_LD · 16 threads</text>
<line x1="420" y1="62" x2="420" y2="78" class="ln" marker-end="url(#tculdp_a)"/>
<rect x="340" y="80" width="64" height="22" class="db"/>
<text x="372" y="95" text-anchor="middle" class="ds">pass 0</text>
<rect x="406" y="80" width="64" height="22" class="db"/>
<text x="438" y="95" text-anchor="middle" class="ds">pass 1</text>
<rect x="472" y="80" width="64" height="22" class="db"/>
<text x="504" y="95" text-anchor="middle" class="ds">pass 2</text>
<rect x="538" y="80" width="64" height="22" class="db"/>
<text x="570" y="95" text-anchor="middle" class="ds">pass 3</text>
<text x="340" y="118" class="dm">4 words per pass; the tag carries the pass</text>
<line x1="420" y1="122" x2="420" y2="132" class="ln" marker-end="url(#tculdp_a)"/>
<rect x="340" y="134" width="262" height="22" class="db"/><text x="471" y="149" text-anchor="middle" class="ds">LSU · 4 lanes · one pass per cycle</text>
<line x1="420" y1="156" x2="420" y2="166" class="lg" marker-end="url(#tculdp_g)"/>
<rect x="340" y="168" width="64" height="22" class="dgood"/>
<text x="372" y="183" text-anchor="middle" class="ds">lanes 0–3</text>
<rect x="406" y="168" width="64" height="22" class="dgood"/>
<text x="438" y="183" text-anchor="middle" class="ds">lanes 4–7</text>
<rect x="472" y="168" width="64" height="22" class="dgood"/>
<text x="504" y="183" text-anchor="middle" class="ds">lanes 8–11</text>
<rect x="538" y="168" width="64" height="22" class="dgood"/>
<text x="570" y="183" text-anchor="middle" class="ds">lanes 12–15</text>
<text x="340" y="212" class="dm">metadata RAM: a response fills its pass's lanes</text>
<text x="340" y="226" class="dm">in any order; done on the last pass's response</text>
</g>
</svg>

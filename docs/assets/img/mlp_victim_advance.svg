<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="With lines of two sectors, a FIFO pointer that steps on every fill skips every other way and evicts a new line early; stepping only on a new line gives every way its turn.">
  <title>With lines of two sectors, a FIFO pointer that steps on every fill skips every other way and evicts a new line early; stepping only on a new line gives every way its turn.</title>
  <defs><marker id="victim_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="victim_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="victim_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" text-anchor="middle" class="dh">Pointer steps on every fill</text>
<text x="480" y="20" text-anchor="middle" class="dh">Pointer steps on a new line</text>
<g class="dl">
<text x="20" y="42" class="dm">full 4-way set W X Y Z, FIFO pointer at way 0</text>
<text x="20" y="62" class="ds">E · sector 0, new line</text>
<text x="160" y="62" class="ds">victim way 0 · ptr 1</text>
<text x="20" y="80" class="ds">E · sector 1, refill</text>
<text x="160" y="80" class="db-t">ptr 2</text>
<text x="20" y="98" class="ds">F · sector 0, new line</text>
<text x="160" y="98" class="ds">victim way 2 · ptr 3</text>
<text x="20" y="116" class="ds">F · sector 1, refill</text>
<text x="160" y="116" class="db-t">ptr 0</text>
<text x="20" y="134" class="ds">G · sector 0, new line</text>
<text x="160" y="134" class="db-t">victim way 0: evicts E</text>
<text x="340" y="42" class="dm">full 4-way set W X Y Z, FIFO pointer at way 0</text>
<text x="340" y="62" class="ds">E · sector 0, new line</text>
<text x="480" y="62" class="ds">victim way 0 · ptr 1</text>
<text x="340" y="80" class="ds">E · sector 1, refill</text>
<text x="480" y="80" class="g-t">ptr stays 1</text>
<text x="340" y="98" class="ds">F · sector 0, new line</text>
<text x="480" y="98" class="ds">victim way 1 · ptr 2</text>
<text x="340" y="116" class="ds">F · sector 1, refill</text>
<text x="480" y="116" class="g-t">ptr stays 2</text>
<text x="340" y="134" class="ds">G · sector 0, new line</text>
<text x="480" y="134" class="ds">victim way 2 · ptr 3</text>
<rect x="20" y="158" width="64" height="24" class="dgood"/><text x="52.0" y="174.0" text-anchor="middle" class="ds">G</text>
<text x="52" y="152" text-anchor="middle" class="dm">way 0</text>
<rect x="88" y="158" width="64" height="24" class="dbad"/><text x="120.0" y="174.0" text-anchor="middle" class="ds">X (old)</text>
<text x="120" y="152" text-anchor="middle" class="dm">way 1</text>
<rect x="156" y="158" width="64" height="24" class="dgood"/><text x="188.0" y="174.0" text-anchor="middle" class="ds">F</text>
<text x="188" y="152" text-anchor="middle" class="dm">way 2</text>
<rect x="224" y="158" width="64" height="24" class="dbad"/><text x="256.0" y="174.0" text-anchor="middle" class="ds">Z (old)</text>
<text x="256" y="152" text-anchor="middle" class="dm">way 3</text>
<rect x="340" y="158" width="64" height="24" class="dgood"/><text x="372.0" y="174.0" text-anchor="middle" class="ds">E</text>
<text x="372" y="152" text-anchor="middle" class="dm">way 0</text>
<rect x="408" y="158" width="64" height="24" class="dgood"/><text x="440.0" y="174.0" text-anchor="middle" class="ds">F</text>
<text x="440" y="152" text-anchor="middle" class="dm">way 1</text>
<rect x="476" y="158" width="64" height="24" class="dgood"/><text x="508.0" y="174.0" text-anchor="middle" class="ds">G</text>
<text x="508" y="152" text-anchor="middle" class="dm">way 2</text>
<rect x="544" y="158" width="64" height="24" class="didle"/><text x="576.0" y="174.0" text-anchor="middle" class="ds">Z (old)</text>
<text x="576" y="152" text-anchor="middle" class="dm">way 3</text>
<text x="20" y="204" class="db-t">ways 1 and 3 are never chosen;</text>
<text x="20" y="220" class="db-t">E leaves after two new lines</text>
<text x="340" y="204" class="g-t">every way takes its turn</text>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
</g>
</svg>

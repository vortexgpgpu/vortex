<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e5e82"/>
    </marker>
  </defs>
  <style>
    .lane { stroke:#c2ccd6; stroke-width:1.3; }
    .host { fill:#f7eef5; stroke:#8e4a7e; stroke-width:1.4; }
    .dev  { fill:#e8f0f7; stroke:#2e5e82; stroke-width:1.4; }
    .rt   { fill:#fdf6e3; stroke:#b58900; stroke-width:1.3; }
    .t    { fill:#1b2733; font-size:15px; font-weight:bold; }
    .th   { fill:#1b2733; font-size:13px; font-weight:bold; }
    .ts   { fill:#44525f; font-size:11.5px; }
    .tt   { fill:#5a6772; font-size:11px; font-style:italic; }
    .msg  { stroke:#2e5e82; stroke-width:1.8; fill:none; marker-end:url(#arrb); }
    .ret  { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#arr); stroke-dasharray:6 4; }
    .lblb { fill:#2e5e82; font-size:11.5px; }
  </style>

  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>
  <text x="24" y="32" class="t" font-size="18">A compute / ray-query dispatch — the vp_launch path (no draw batch)</text>

  <!-- lifelines -->
  <text x="230" y="62" class="th" text-anchor="middle" fill="#8e4a7e">vortexpipe (host)</text>
  <text x="720" y="62" class="th" text-anchor="middle" fill="#2e5e82">Vortex device (SIMT cores + RTU)</text>
  <line x1="230" y1="72" x2="230" y2="512" class="lane"/>
  <line x1="720" y1="72" x2="720" y2="512" class="lane"/>

  <!-- host: translate -->
  <rect x="120" y="86" width="220" height="44" rx="5" class="host"/>
  <text x="132" y="106" class="th">translate kernel → .vxbin</text>
  <text x="132" y="123" class="ts">NIR → LLVM IR → clang +xvortex</text>

  <!-- host: upload -->
  <rect x="120" y="140" width="220" height="62" rx="5" class="host"/>
  <text x="132" y="160" class="th">upload + relocate</text>
  <text x="132" y="178" class="ts">SSBOs / descriptors → device</text>
  <text x="132" y="194" class="ts">addrs rewritten in place</text>

  <!-- RT AS transcode -->
  <rect x="120" y="212" width="220" height="46" rx="5" class="rt"/>
  <text x="132" y="232" class="ts">ray tracing: transcode AS →</text>
  <text x="132" y="248" class="ts">CW-BVH4, copy resident (VP_DESC_AS)</text>

  <!-- launch -->
  <path d="M 340 288 L 716 288" class="msg"/>
  <text x="366" y="280" class="lblb">vx_enqueue_launch — a grid of CTAs</text>

  <!-- device: kernel -->
  <rect x="560" y="306" width="320" height="60" rx="5" class="dev"/>
  <text x="572" y="326" class="th">kernel_main — one thread per work-item</text>
  <text x="572" y="344" class="ts">SIMT execution across warps / CTAs</text>
  <text x="572" y="360" class="tt">workgroup clamped to one CTA (hw_max_block_size)</text>

  <!-- device: RTU -->
  <rect x="560" y="378" width="320" height="46" rx="5" class="rt"/>
  <text x="572" y="398" class="ts">ray query → RTU traversal (vortex_rt_wtrace /</text>
  <text x="572" y="414" class="ts">wait window ops); hit lands in the window</text>
  <path d="M 720 366 L 720 378" class="msg"/>

  <!-- return -->
  <path d="M 716 452 L 342 452" class="ret"/>
  <text x="368" y="444" class="lblb">results readback → vx_queue_finish</text>
  <rect x="120" y="440" width="220" height="26" rx="5" class="host"/>
  <text x="132" y="458" class="ts">read results back to the app</text>

  <text x="120" y="500" class="tt">RT rides the compute path (there is no OP_TRACE yet); the AS is still relocated per dispatch (modules themselves stay resident) — tracked in vortexpipe_architecture.md §6.3.</text>
</svg>

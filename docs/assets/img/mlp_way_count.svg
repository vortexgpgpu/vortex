<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="With power-of-two ways a profile rounds its cache down, a100&#x27;s 40 MB L2 to 32 MB; with any way count the set holds 20 ways, and the replacement policies map the unused way codes back onto real ways.">
  <title>With power-of-two ways a profile rounds its cache down, a100&#x27;s 40 MB L2 to 32 MB; with any way count the set holds 20 ways, and the replacement policies map the unused way codes back onto real ways.</title>
  <defs><marker id="waycnt_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="waycnt_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="waycnt_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" text-anchor="middle" class="dh">Power-of-two ways: rounded capacity</text>
<text x="480" y="20" text-anchor="middle" class="dh">Any way count</text>
<g class="dl">
<text x="20" y="42" class="dm">a100 L2, one set</text>
<rect x="20" y="50" width="14" height="18" class="dgood"/><rect x="34" y="50" width="14" height="18" class="dgood"/><rect x="48" y="50" width="14" height="18" class="dgood"/><rect x="62" y="50" width="14" height="18" class="dgood"/><rect x="76" y="50" width="14" height="18" class="dgood"/><rect x="90" y="50" width="14" height="18" class="dgood"/><rect x="104" y="50" width="14" height="18" class="dgood"/><rect x="118" y="50" width="14" height="18" class="dgood"/><rect x="132" y="50" width="14" height="18" class="dgood"/><rect x="146" y="50" width="14" height="18" class="dgood"/><rect x="160" y="50" width="14" height="18" class="dgood"/><rect x="174" y="50" width="14" height="18" class="dgood"/><rect x="188" y="50" width="14" height="18" class="dgood"/><rect x="202" y="50" width="14" height="18" class="dgood"/><rect x="216" y="50" width="14" height="18" class="dgood"/><rect x="230" y="50" width="14" height="18" class="dgood"/><rect x="244" y="50" width="14" height="18" class="dwait"/><rect x="258" y="50" width="14" height="18" class="dwait"/><rect x="272" y="50" width="14" height="18" class="dwait"/><rect x="286" y="50" width="14" height="18" class="dwait"/>
<text x="20" y="88" class="db-t">16 ways: 32 MB; the part has 20 ways, 40 MB</text>
<text x="20" y="120" class="dm">a profile rounds its capacity down:</text>
<text x="20" y="138" class="dm">a100 L1 192 KB → 128 KB</text>
<text x="20" y="154" class="dm">a100 L2 40 MB → 32 MB</text>
<text x="20" y="176" class="db-t">hit rates differ from the part</text>
<text x="340" y="42" class="dm">a100 L2, one set</text>
<rect x="340" y="50" width="14" height="18" class="dgood"/><rect x="354" y="50" width="14" height="18" class="dgood"/><rect x="368" y="50" width="14" height="18" class="dgood"/><rect x="382" y="50" width="14" height="18" class="dgood"/><rect x="396" y="50" width="14" height="18" class="dgood"/><rect x="410" y="50" width="14" height="18" class="dgood"/><rect x="424" y="50" width="14" height="18" class="dgood"/><rect x="438" y="50" width="14" height="18" class="dgood"/><rect x="452" y="50" width="14" height="18" class="dgood"/><rect x="466" y="50" width="14" height="18" class="dgood"/><rect x="480" y="50" width="14" height="18" class="dgood"/><rect x="494" y="50" width="14" height="18" class="dgood"/><rect x="508" y="50" width="14" height="18" class="dgood"/><rect x="522" y="50" width="14" height="18" class="dgood"/><rect x="536" y="50" width="14" height="18" class="dgood"/><rect x="550" y="50" width="14" height="18" class="dgood"/><rect x="564" y="50" width="14" height="18" class="dgood"/><rect x="578" y="50" width="14" height="18" class="dgood"/><rect x="592" y="50" width="14" height="18" class="dgood"/><rect x="606" y="50" width="14" height="18" class="dgood"/>
<text x="340" y="88" class="g-t">20 ways over power-of-two sets: 40 MB</text>
<text x="340" y="108" class="dm">6-way set: way codes 6 and 7 unused</text>
<rect x="340" y="116" width="28" height="18" class="dgood"/><rect x="368" y="116" width="28" height="18" class="dgood"/><rect x="396" y="116" width="28" height="18" class="dgood"/><rect x="424" y="116" width="28" height="18" class="dgood"/><rect x="452" y="116" width="28" height="18" class="dgood"/><rect x="480" y="116" width="28" height="18" class="dgood"/><rect x="508" y="116" width="28" height="18" class="didle"/><rect x="536" y="116" width="28" height="18" class="didle"/>
<text x="354" y="129" text-anchor="middle" class="ds">0</text>
<text x="382" y="129" text-anchor="middle" class="ds">1</text>
<text x="410" y="129" text-anchor="middle" class="ds">2</text>
<text x="438" y="129" text-anchor="middle" class="ds">3</text>
<text x="466" y="129" text-anchor="middle" class="ds">4</text>
<text x="494" y="129" text-anchor="middle" class="ds">5</text>
<text x="522" y="129" text-anchor="middle" class="ds">6</text>
<text x="550" y="129" text-anchor="middle" class="ds">7</text>
<path d="M494,134 C494,152 354,152 354,137" class="lg" fill="none" marker-end="url(#waycnt_g)"/>
<text x="574" y="129" class="dm">FIFO wraps</text>
<text x="340" y="172" class="ds">FIFO: way 5 wraps to way 0</text>
<text x="340" y="188" class="ds">random: a pick of 6 or 7 becomes 0 or 1</text>
<text x="340" y="204" class="ds">PLRU (8-leaf tree): 6 or 7 becomes 4 or 5</text>
<text x="340" y="220" class="ds">the flush walk stops at the last real way</text>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
</g>
</svg>

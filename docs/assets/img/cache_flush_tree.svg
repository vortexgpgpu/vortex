<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ft_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e5e82"/>
    </marker>
    <marker id="ft_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7d44"/>
    </marker>
    <marker id="ft_r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a03020"/>
    </marker>
  </defs>
  <style>
    .t   { fill:#1b2733; font-size:20px; font-weight:bold; }
    .st  { fill:#5a6772; font-size:11.5px; font-style:italic; }
    .th  { fill:#1b2733; font-size:12.5px; font-weight:bold; }
    .ts  { fill:#44525f; font-size:10.5px; }
    .tt  { fill:#5a6772; font-size:10px; font-style:italic; }
    .cm  { font-family:"DejaVu Sans Mono", monospace; font-size:9.5px; fill:#1b2733; }
    .box { fill:#fbfcfd; stroke:#5a7184; stroke-width:1.3; }
    .hdr { fill:#eef1f4; stroke:#5a7184; stroke-width:1.2; }
    .src { fill:#f7eef5; stroke:#8e4a7e; stroke-width:1.5; }
    .shim{ fill:#e8f0f7; stroke:#2e5e82; stroke-width:1.5; }
    .cache{ fill:#fdf6e3; stroke:#b58900; stroke-width:1.5; }
    .gfx { fill:#f4faf4; stroke:#3a7d44; stroke-width:1.4; }
    .and { fill:#fdeeea; stroke:#a03020; stroke-width:1.5; }
    .req { stroke:#2e5e82; stroke-width:1.7; fill:none; marker-end:url(#ft_a); }
    .don { stroke:#3a7d44; stroke-width:1.6; fill:none; marker-end:url(#ft_d); stroke-dasharray:6 3; }
    .seq { stroke:#a03020; stroke-width:1.7; fill:none; marker-end:url(#ft_r); }
    .lb  { fill:#2e5e82; font-size:9.5px; }
    .lbg { fill:#2f6b39; font-size:9.5px; }
    .lbr { fill:#a03020; font-size:10px; font-weight:bold; }
  </style>

  <rect x="0" y="0" width="1440" height="880" fill="#ffffff"/>
  <text x="24" y="34" class="t">The flush fan-out tree — one DCR read, every cache</text>
  <text x="24" y="56" class="st">Solid blue = req fans DOWN. Dashed green = done ANDs back UP. Every done is level-held until req drops, which is what makes the AND race-free.</text>

  <!-- source -->
  <rect x="40" y="92" width="240" height="70" rx="6" class="src"/>
  <text x="52" y="112" class="th">VX_dcr_data</text>
  <text x="52" y="130" class="cm">dcr_read(CACHE_FLUSH, cid)</text>
  <text x="52" y="148" class="ts">holds req until done comes back</text>

  <path d="M 160 162 L 160 200" class="req"/>

  <rect x="40" y="200" width="240" height="52" rx="6" class="box"/>
  <text x="52" y="220" class="th">VX_core — the fan-out point</text>
  <text x="52" y="240" class="cm">dcr_flush_if</text>

  <!-- ===== core level: dcache and icache ===== -->
  <path d="M 160 252 L 160 300 L 380 300" class="req"/>
  <text x="176" y="292" class="lb">req</text>

  <rect x="380" y="276" width="250" height="82" rx="6" class="shim"/>
  <text x="392" y="296" class="th">VX_dcr_flush (dcache)</text>
  <text x="392" y="314" class="ts">injects the synthetic MemReq onto</text>
  <text x="392" y="330" class="ts">dcache port 0 only</text>
  <text x="392" y="350" class="cm">VX_mem_unit.sv — i==0 &amp;&amp; j==0</text>

  <path d="M 630 316 L 720 316" class="req"/>
  <rect x="720" y="290" width="200" height="54" rx="6" class="cache"/>
  <text x="732" y="310" class="th">dcache</text>
  <text x="732" y="330" class="ts">the lock freezes ALL its ports</text>

  <!-- sequencing gate -->
  <rect x="380" y="392" width="250" height="96" rx="6" class="and"/>
  <text x="392" y="412" class="lbr">ORDERING CONSTRAINT</text>
  <text x="392" y="432" class="cm">icache.req = dcr_flush_if.req</text>
  <text x="392" y="448" class="cm">           &amp;&amp; dcache.done</text>
  <text x="392" y="468" class="ts">The icache flush is SEQUENCED</text>
  <text x="392" y="484" class="ts">BEHIND the dcache flush.</text>

  <path d="M 505 358 L 505 392" class="seq"/>

  <path d="M 160 252 L 160 530 L 380 530" class="req"/>

  <rect x="380" y="504" width="250" height="52" rx="6" class="shim"/>
  <text x="392" y="524" class="th">VX_dcr_flush (icache)</text>
  <text x="392" y="544" class="cm">VX_core.sv — between fetch and iMMU</text>

  <path d="M 630 530 L 720 530" class="req"/>
  <rect x="720" y="504" width="200" height="52" rx="6" class="cache"/>
  <text x="732" y="524" class="th">icache</text>
  <text x="732" y="544" class="ts">no dirty data — retires fast</text>

  <rect x="956" y="392" width="460" height="140" rx="6" class="box"/>
  <text x="968" y="412" class="th">Why the icache waits for the dcache</text>
  <text x="968" y="432" class="ts">Both L1s forward their flush to the shared next level, and a cache that is</text>
  <text x="968" y="448" class="ts">flushing locks out incoming core requests for its whole sweep.</text>
  <text x="968" y="470" class="ts">The icache carries no dirty data, so it retires almost immediately. If it ran</text>
  <text x="968" y="486" class="ts">concurrently, its forward would arrive at the next level while the dcache is</text>
  <text x="968" y="502" class="ts">still evicting — and that level's lock would strand the dcache's writebacks</text>
  <text x="968" y="518" class="ts">upstream of memory.</text>

  <rect x="956" y="276" width="460" height="96" rx="6" class="box"/>
  <text x="968" y="296" class="th">Why the icache is flushed at all</text>
  <text x="968" y="316" class="ts">A kernel re-loaded to the same virtual address after a CACHE_FLUSH would</text>
  <text x="968" y="332" class="ts">otherwise execute stale lines from the previous launch. The host issues</text>
  <text x="968" y="348" class="ts">CMD_CACHE_FLUSH after every kernel, so this is the instruction-side half</text>
  <text x="968" y="364" class="ts">of that contract.</text>

  <!-- ===== gfx legs ===== -->
  <path d="M 160 252 L 160 620 L 260 620" class="req"/>
  <text x="172" y="578" class="lb">EXT_GFX_ANY_ENABLE only</text>

  <rect x="260" y="594" width="230" height="52" rx="6" class="gfx"/>
  <text x="272" y="614" class="th">VX_socket — OR of core reqs</text>
  <text x="272" y="634" class="cm">socket_flush_req = |per_core_req</text>

  <path d="M 490 620 L 570 620" class="req"/>
  <rect x="570" y="580" width="180" height="36" rx="5" class="gfx"/>
  <text x="582" y="603" class="th">tcache  (TEX)</text>
  <rect x="570" y="624" width="180" height="36" rx="5" class="gfx"/>
  <text x="582" y="647" class="th">rtcache  (RTU)</text>

  <path d="M 375 646 L 375 700 L 260 700" class="req"/>

  <path d="M 160 252 L 160 700 L 250 700" class="req"/>
  <rect x="260" y="674" width="230" height="52" rx="6" class="gfx"/>
  <text x="272" y="694" class="th">VX_cluster — OR of socket reqs</text>
  <text x="272" y="714" class="cm">cluster_flush_if.req</text>

  <path d="M 490 700 L 570 700" class="req"/>
  <rect x="570" y="682" width="180" height="36" rx="5" class="gfx"/>
  <text x="582" y="705" class="th">rcache  (raster)</text>
  <rect x="570" y="726" width="180" height="36" rx="5" class="gfx"/>
  <text x="582" y="749" class="th">ocache  (output merger)</text>

  <text x="766" y="600" class="tt">Sockets fire their reqs</text>
  <text x="766" y="614" class="tt">sequentially; the shared</text>
  <text x="766" y="628" class="tt">resource flushes once per</text>
  <text x="766" y="642" class="tt">req. Later reqs see an</text>
  <text x="766" y="656" class="tt">already-empty cache, so the</text>
  <text x="766" y="670" class="tt">redundant sweeps are cheap,</text>
  <text x="766" y="684" class="tt">not incorrect.</text>

  <text x="766" y="712" class="tt">rcache/ocache are cluster-</text>
  <text x="766" y="726" class="tt">level, inside VX_graphics;</text>
  <text x="766" y="740" class="tt">tcache/rtcache are socket-</text>
  <text x="766" y="754" class="tt">level.</text>

  <!-- ===== the AND tree ===== -->
  <rect x="956" y="560" width="460" height="200" rx="6" class="and"/>
  <text x="968" y="580" class="th">The completion AND tree</text>

  <text x="968" y="606" class="cm">VX_cluster:  per_socket.done = cluster_flush_if.done</text>
  <text x="968" y="628" class="cm">VX_socket:   per_core.done  = cluster_flush_if.done</text>
  <text x="968" y="644" class="cm">                            &amp; tcache.done</text>
  <text x="968" y="660" class="cm">                            &amp; rtcache.done</text>
  <text x="968" y="682" class="cm">VX_core:     dcr_flush_if.done = dcache.done</text>
  <text x="968" y="698" class="cm">                               &amp; icache.done</text>
  <text x="968" y="714" class="cm">                               &amp; cluster_flush_if.done</text>

  <text x="968" y="740" class="ts">Only when every leg reports done does VX_dcr_data return the DCR read</text>
  <text x="968" y="754" class="ts">and drop req — which re-arms every VX_dcr_flush for the next flush.</text>

  <!-- done arrows -->
  <path d="M 720 336 L 640 336" class="don"/>
  <path d="M 380 336 L 300 336 L 300 250" class="don"/>
  <text x="306" y="300" class="lbg">done</text>

  <path d="M 720 546 L 640 546" class="don"/>
  <path d="M 380 546 L 330 546" class="don"/>

  <!-- bottom banner -->
  <rect x="40" y="792" width="1376" height="70" rx="6" class="box"/>
  <text x="52" y="812" class="th">There is exactly one flush primitive — and this is deliberate</text>
  <text x="52" y="832" class="ts">No line-granular invalidate, no way-granular invalidate, no tag-only invalidate, no software-addressable per-line writeback. The walk is counter-driven with no external address input,</text>
  <text x="52" y="850" class="ts">and it freezes every input for its duration. Where a single line must be written back and invalidated, the AMO subsystem uses its own inline probe path in the bank pipeline instead.</text>
</svg>

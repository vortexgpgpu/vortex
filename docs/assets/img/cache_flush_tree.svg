<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1440 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ft_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e5e82"/>
    </marker>
    <marker id="ft_d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7d44"/>
    </marker>
  </defs>
  <style>
    .t   { fill:#1b2733; font-size:20px; font-weight:bold; }
    .st  { fill:#5a6772; font-size:11.5px; font-style:italic; }
    .th  { fill:#1b2733; font-size:12.5px; font-weight:bold; }
    .ts  { fill:#44525f; font-size:10.5px; }
    .tt  { fill:#5a6772; font-size:10px; font-style:italic; }
    .cm  { font-family:"DejaVu Sans Mono", monospace; font-size:9.5px; fill:#1b2733; }
    .box { fill:#fbfcfd; stroke:#5a7184; stroke-width:1.3; }
    .src { fill:#f7eef5; stroke:#8e4a7e; stroke-width:1.5; }
    .shim{ fill:#e8f0f7; stroke:#2e5e82; stroke-width:1.5; }
    .cache{ fill:#fdf6e3; stroke:#b58900; stroke-width:1.5; }
    .gfx { fill:#f4faf4; stroke:#3a7d44; stroke-width:1.4; }
    .and { fill:#fdeeea; stroke:#a03020; stroke-width:1.5; }
    .req { stroke:#2e5e82; stroke-width:1.7; fill:none; marker-end:url(#ft_a); }
    .don { stroke:#3a7d44; stroke-width:1.6; fill:none; marker-end:url(#ft_d); stroke-dasharray:6 3; }
    .lb  { fill:#2e5e82; font-size:9.5px; }
    .lbg { fill:#2f6b39; font-size:9.5px; }
  </style>

  <rect x="0" y="0" width="1440" height="880" fill="#ffffff"/>
  <text x="24" y="34" class="t">The flush fan-out tree — one broadcast write, every cache</text>
  <text x="24" y="56" class="st">Solid blue = req fans DOWN. Dashed green = done ANDs back UP. Every done is level-held until req drops, which is what makes the AND race-free.</text>

  <!-- source -->
  <rect x="40" y="86" width="250" height="88" rx="6" class="src"/>
  <text x="52" y="106" class="th">VX_dcr_data (per core)</text>
  <text x="52" y="124" class="cm">dcr_write(CACHE_FLUSH): all cores start</text>
  <text x="52" y="140" class="cm">dcr_read(CACHE_FLUSH, cid): report one</text>
  <text x="52" y="160" class="ts">holds req until done comes back</text>

  <path d="M 165 174 L 165 200" class="req"/>

  <rect x="40" y="200" width="250" height="52" rx="6" class="box"/>
  <text x="52" y="220" class="th">VX_core — the fan-out point</text>
  <text x="52" y="240" class="cm">dcr_flush_if</text>

  <!-- ===== core level: dcache ===== -->
  <path d="M 165 252 L 165 316 L 380 316" class="req"/>
  <text x="178" y="308" class="lb">req &amp;&amp; store_drained</text>

  <rect x="380" y="276" width="250" height="88" rx="6" class="shim"/>
  <text x="392" y="296" class="th">VX_dcr_flush per buffered lane</text>
  <text x="392" y="314" class="ts">lane 0 of a private dcache, else every</text>
  <text x="392" y="330" class="ts">lane. Lane dones AND together</text>
  <text x="392" y="352" class="cm">VX_mem_unit.sv</text>

  <path d="M 630 316 L 720 316" class="req"/>
  <rect x="720" y="282" width="216" height="72" rx="6" class="cache"/>
  <text x="732" y="302" class="th">dcache</text>
  <text x="732" y="320" class="ts">walks, then one token per</text>
  <text x="732" y="336" class="ts">memory port to the next level</text>

  <!-- ===== core level: icache ===== -->
  <path d="M 165 252 L 165 420 L 380 420" class="req"/>
  <text x="178" y="412" class="lb">req (concurrent with the dcache)</text>

  <rect x="380" y="394" width="250" height="52" rx="6" class="shim"/>
  <text x="392" y="414" class="th">VX_dcr_flush (icache)</text>
  <text x="392" y="434" class="cm">VX_core.sv — between fetch and iMMU</text>

  <path d="M 630 420 L 720 420" class="req"/>
  <rect x="720" y="394" width="216" height="52" rx="6" class="cache"/>
  <text x="732" y="414" class="th">icache  (FLUSH_FORWARD=0)</text>
  <text x="732" y="434" class="ts">invalidates locally; no forward</text>

  <!-- notes -->
  <rect x="956" y="276" width="460" height="104" rx="6" class="box"/>
  <text x="968" y="296" class="th">Why a token per write path</text>
  <text x="968" y="316" class="ts">A token only orders the requests ahead of it on its own path. Separate paths</text>
  <text x="968" y="332" class="ts">into a cache can be buffered independently (a shared dcache's arbiter buffers</text>
  <text x="968" y="348" class="ts">each lane), so a store on one lane could still be queued when another lane's</text>
  <text x="968" y="364" class="ts">token arrives. The same rule gives one token per memory port between levels.</text>

  <rect x="956" y="392" width="460" height="104" rx="6" class="box"/>
  <text x="968" y="412" class="th">Why the icache flushes, and why only locally</text>
  <text x="968" y="432" class="ts">A kernel re-loaded to the same virtual address would otherwise execute stale</text>
  <text x="968" y="448" class="ts">lines from the previous launch. The icache holds no dirty data, and the dcache's</text>
  <text x="968" y="464" class="ts">flush already walks and invalidates every shared level the icache reads through,</text>
  <text x="968" y="480" class="ts">so the icache's flush ends at the icache.</text>

  <!-- ===== gfx legs ===== -->
  <path d="M 165 252 L 165 620 L 260 620" class="req"/>
  <text x="178" y="578" class="lb">EXT_GFX_ANY_ENABLE only</text>

  <rect x="260" y="594" width="230" height="52" rx="6" class="gfx"/>
  <text x="272" y="614" class="th">VX_socket — OR of core reqs</text>
  <text x="272" y="634" class="cm">socket_flush_req = |per_core_req</text>

  <path d="M 490 620 L 570 620" class="req"/>
  <rect x="570" y="580" width="200" height="36" rx="5" class="gfx"/>
  <text x="582" y="603" class="th">tcache  (TEX)</text>
  <rect x="570" y="624" width="200" height="36" rx="5" class="gfx"/>
  <text x="582" y="647" class="th">rtcache  (RTU)</text>

  <path d="M 375 646 L 375 700 L 260 700" class="req"/>

  <path d="M 165 252 L 165 700 L 250 700" class="req"/>
  <rect x="260" y="674" width="230" height="52" rx="6" class="gfx"/>
  <text x="272" y="694" class="th">VX_cluster — OR of socket reqs</text>
  <text x="272" y="714" class="cm">cluster_flush_if.req</text>

  <path d="M 490 700 L 570 700" class="req"/>
  <rect x="570" y="682" width="200" height="36" rx="5" class="gfx"/>
  <text x="582" y="705" class="th">rcache  (raster, 1 token)</text>
  <rect x="570" y="726" width="200" height="36" rx="5" class="gfx"/>
  <text x="582" y="749" class="th">ocache  (1 token / OM input)</text>

  <text x="786" y="600" class="tt">tcache, rtcache and rcache</text>
  <text x="786" y="614" class="tt">flush once for all cores;</text>
  <text x="786" y="628" class="tt">the OR drops when the</text>
  <text x="786" y="642" class="tt">last core finishes.</text>
  <text x="786" y="662" class="tt">The ocache flushes once the</text>
  <text x="786" y="676" class="tt">OM has drained, for the</text>
  <text x="786" y="690" class="tt">cluster flush and for each</text>
  <text x="786" y="704" class="tt">dcache token a steer holds</text>
  <text x="786" y="718" class="tt">on its way to the L2.</text>
  <text x="786" y="738" class="tt">tcache/rtcache: socket;</text>
  <text x="786" y="752" class="tt">rcache/ocache: cluster.</text>

  <!-- ===== the AND tree ===== -->
  <rect x="956" y="530" width="460" height="230" rx="6" class="and"/>
  <text x="968" y="550" class="th">The completion AND tree</text>

  <text x="968" y="576" class="cm">VX_cluster:  per_socket.done = cluster_flush_if.done</text>
  <text x="968" y="598" class="cm">VX_socket:   per_core.done  = cluster_flush_if.done</text>
  <text x="968" y="614" class="cm">                            &amp; tcache.done</text>
  <text x="968" y="630" class="cm">                            &amp; rtcache.done</text>
  <text x="968" y="652" class="cm">VX_core:     dcr_flush_if.done = dcache.done</text>
  <text x="968" y="668" class="cm">                               &amp; icache.done</text>
  <text x="968" y="684" class="cm">                               &amp; cluster_flush_if.done</text>
  <text x="968" y="700" class="cm">VX_mem_unit: dcache.done = &amp;lane_flush_done</text>

  <text x="968" y="726" class="ts">When every leg reports done, VX_dcr_data drops req (re-arming every</text>
  <text x="968" y="742" class="ts">VX_dcr_flush) and answers this core's flush read, at once if it came first.</text>

  <!-- done arrows -->
  <path d="M 720 344 L 640 344" class="don"/>
  <path d="M 380 344 L 310 344 L 310 250" class="don"/>
  <text x="316" y="300" class="lbg">done</text>

  <path d="M 720 436 L 640 436" class="don"/>
  <path d="M 380 436 L 330 436" class="don"/>

  <!-- bottom banner -->
  <rect x="40" y="792" width="1376" height="70" rx="6" class="box"/>
  <text x="52" y="812" class="th">There is exactly one flush primitive — and this is deliberate</text>
  <text x="52" y="832" class="ts">No line-granular invalidate, no way-granular invalidate, no tag-only invalidate, no software-addressable per-line writeback. The walk is counter-driven with no external address input,</text>
  <text x="52" y="850" class="ts">and it freezes every input for its duration. Where a single line must be written back and invalidated, the AMO subsystem uses its own inline probe path in the bank pipeline instead.</text>
</svg>

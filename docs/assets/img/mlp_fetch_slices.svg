<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Before, one warp scheduler, fetch and decode path fed every issue slice, one instruction per cycle. With four fetch slices, each slice has its own scheduler, fetch, decode and icache port, serves the warps with wid % 4 equal to its index, and feeds its own issue slice.">
  <title>Before, one warp scheduler, fetch and decode path fed every issue slice, one instruction per cycle. With four fetch slices, each slice has its own scheduler, fetch, decode and icache port, serves the warps with wid % 4 equal to its index, and feeds its own issue slice.</title>
  <defs><marker id="fetsli_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="fetsli_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="fetsli_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="250" fill="#ffffff"/>
<g class="dl">
<text x="160" y="20" text-anchor="middle" class="dh">One fetch path for four issue slices</text>
<text x="480" y="20" text-anchor="middle" class="dh">One fetch slice per issue slice</text>
<rect x="20" y="40" width="170" height="50" class="dbad"/><text x="105" y="62.5" text-anchor="middle" class="ds">warp scheduler (all warps)</text><text x="105" y="75.5" text-anchor="middle" class="ds">fetch → decode</text>
<rect x="220" y="40" width="80" height="50" class="db"/><text x="260" y="62.5" text-anchor="middle" class="ds">icache</text><text x="260" y="75.5" text-anchor="middle" class="ds">1 port</text>
<line x1="190" y1="65" x2="218" y2="65" class="ln" marker-start="url(#fetsli_a)" marker-end="url(#fetsli_a)"/>
<rect x="20" y="150" width="62" height="26" class="db"/><text x="51" y="167" text-anchor="middle" class="ds">issue 0</text>
<line x1="105" y1="90" x2="51" y2="148" class="lb" marker-end="url(#fetsli_b)"/>
<rect x="92" y="150" width="62" height="26" class="db"/><text x="123" y="167" text-anchor="middle" class="ds">issue 1</text>
<line x1="105" y1="90" x2="123" y2="148" class="lb" marker-end="url(#fetsli_b)"/>
<rect x="164" y="150" width="62" height="26" class="db"/><text x="195" y="167" text-anchor="middle" class="ds">issue 2</text>
<line x1="105" y1="90" x2="195" y2="148" class="lb" marker-end="url(#fetsli_b)"/>
<rect x="236" y="150" width="62" height="26" class="db"/><text x="267" y="167" text-anchor="middle" class="ds">issue 3</text>
<line x1="105" y1="90" x2="267" y2="148" class="lb" marker-end="url(#fetsli_b)"/>
<text x="20" y="216" class="dm">1 instruction per cycle; issue slices wait</text>
<text x="20" y="232" class="dm">on the front end</text>
<line x1="320" y1="30" x2="320" y2="235" class="sep"/>
<rect x="340" y="40" width="280" height="26" class="db"/><text x="480" y="57" text-anchor="middle" class="ds">icache: one bank and port per fetch slice</text>
<rect x="340" y="92" width="64" height="52" class="dgood"/><text x="372" y="109" text-anchor="middle" class="ds">sched</text><text x="372" y="122" text-anchor="middle" class="ds">fetch</text><text x="372" y="135" text-anchor="middle" class="ds">decode</text>
<line x1="372" y1="66" x2="372" y2="90" class="ln" marker-end="url(#fetsli_a)"/>
<rect x="340" y="166" width="64" height="26" class="db"/><text x="372" y="183" text-anchor="middle" class="ds">issue 0</text>
<line x1="372" y1="144" x2="372" y2="164" class="lg" marker-end="url(#fetsli_g)"/>
<rect x="412" y="92" width="64" height="52" class="dgood"/><text x="444" y="109" text-anchor="middle" class="ds">sched</text><text x="444" y="122" text-anchor="middle" class="ds">fetch</text><text x="444" y="135" text-anchor="middle" class="ds">decode</text>
<line x1="444" y1="66" x2="444" y2="90" class="ln" marker-end="url(#fetsli_a)"/>
<rect x="412" y="166" width="64" height="26" class="db"/><text x="444" y="183" text-anchor="middle" class="ds">issue 1</text>
<line x1="444" y1="144" x2="444" y2="164" class="lg" marker-end="url(#fetsli_g)"/>
<rect x="484" y="92" width="64" height="52" class="dgood"/><text x="516" y="109" text-anchor="middle" class="ds">sched</text><text x="516" y="122" text-anchor="middle" class="ds">fetch</text><text x="516" y="135" text-anchor="middle" class="ds">decode</text>
<line x1="516" y1="66" x2="516" y2="90" class="ln" marker-end="url(#fetsli_a)"/>
<rect x="484" y="166" width="64" height="26" class="db"/><text x="516" y="183" text-anchor="middle" class="ds">issue 2</text>
<line x1="516" y1="144" x2="516" y2="164" class="lg" marker-end="url(#fetsli_g)"/>
<rect x="556" y="92" width="64" height="52" class="dgood"/><text x="588" y="109" text-anchor="middle" class="ds">sched</text><text x="588" y="122" text-anchor="middle" class="ds">fetch</text><text x="588" y="135" text-anchor="middle" class="ds">decode</text>
<line x1="588" y1="66" x2="588" y2="90" class="ln" marker-end="url(#fetsli_a)"/>
<rect x="556" y="166" width="64" height="26" class="db"/><text x="588" y="183" text-anchor="middle" class="ds">issue 3</text>
<line x1="588" y1="144" x2="588" y2="164" class="lg" marker-end="url(#fetsli_g)"/>
<text x="340" y="216" class="dm">slice f serves warps with wid % 4 = f</text>
<text x="340" y="232" class="dm">up to 4 instructions per cycle</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="An atomic executes once at the last-level cache, and every L1 it passes through drops its copy of the line.">
  <title>An atomic executes once at the last-level cache, and every L1 it passes through drops its copy of the line.</title>
  <defs><marker id="llcato_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="llcato_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="llcato_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<g class="dl">
<rect x="60" y="30" width="160" height="28" class="db"/><text x="140" y="49" text-anchor="middle">core 0: amoadd X</text>
<rect x="420" y="30" width="160" height="28" class="db"/><text x="500" y="49" text-anchor="middle">core 1: ld X</text>
<rect x="60" y="94" width="160" height="28" class="db"/><text x="140" y="113" text-anchor="middle">L1: pass, drop X</text>
<rect x="420" y="94" width="160" height="28" class="db"/><text x="500" y="113" text-anchor="middle">L1: miss on X</text>
<rect x="200" y="168" width="240" height="32" class="dgood"/><text x="320" y="189" text-anchor="middle">L2 (LLC): read-modify-write X</text>
<line x1="140" y1="58" x2="140" y2="92" class="ln" marker-end="url(#llcato_a)"/>
<line x1="140" y1="122" x2="250" y2="166" class="ln" marker-end="url(#llcato_a)"/><text x="160" y="152" class="dm">AMO</text>
<line x1="500" y1="58" x2="500" y2="92" class="ln" marker-end="url(#llcato_a)"/>
<line x1="500" y1="122" x2="390" y2="166" class="ln" marker-end="url(#llcato_a)"/><text x="470" y="152" class="dm">sees new X</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mm_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e5e82"/></marker>
    <marker id="mm_p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e4a7e"/></marker>
    <marker id="mm_y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b58900"/></marker>
  </defs>
  <style>
    .lane { stroke:#c2ccd6; stroke-width:1.3; }
    .t    { fill:#1b2733; font-size:19px; font-weight:bold; }
    .th   { fill:#1b2733; font-size:12.5px; font-weight:bold; }
    .ts   { fill:#44525f; font-size:11px; }
    .tt   { fill:#5a6772; font-size:10.5px; font-style:italic; }
    .cm   { font-family:"DejaVu Sans Mono", monospace; font-size:10px; fill:#1b2733; }
    .act  { fill:#e8f0f7; stroke:#2e5e82; stroke-width:1.3; }
    .actp { fill:#f7eef5; stroke:#8e4a7e; stroke-width:1.3; }
    .mem  { fill:#fdf6e3; stroke:#b58900; stroke-width:1.3; }
    .note { fill:#fbfcfd; stroke:#5a7184; stroke-width:1.2; }
    .grp  { fill:none; stroke:#9aa7b3; stroke-width:1.2; stroke-dasharray:5 4; }
    .m    { stroke:#2e5e82; stroke-width:1.7; fill:none; marker-end:url(#mm_a); }
    .mp   { stroke:#8e4a7e; stroke-width:1.7; fill:none; marker-end:url(#mm_p); }
    .my   { stroke:#b58900; stroke-width:1.7; fill:none; marker-end:url(#mm_y); }
    .rtn  { stroke:#b58900; stroke-width:1.4; fill:none; marker-end:url(#mm_y); stroke-dasharray:6 4; }
    .lb   { fill:#2e5e82; font-size:10.5px; }
    .lbp  { fill:#8e4a7e; font-size:10.5px; }
    .lby  { fill:#8a6d00; font-size:10.5px; }
    .gl   { fill:#5a6772; font-size:11px; font-weight:bold; }
  </style>

  <rect x="0" y="0" width="1360" height="860" fill="#ffffff"/>
  <text x="24" y="34" class="t">Buffer data movement — write / read / map, and the sub-buffer origin</text>
  <text x="24" y="55" class="tt">Every transfer follows the same async submit → worker path; the driver adds the sub-buffer byte origin exactly once.</text>

  <text x="150"  y="90" class="th" text-anchor="middle" fill="#5a7184">host app</text>
  <text x="450"  y="90" class="th" text-anchor="middle" fill="#8e4a7e">PoCL queue + worker</text>
  <text x="780"  y="90" class="th" text-anchor="middle" fill="#2e5e82">Vortex driver mem ops</text>
  <text x="1130" y="90" class="th" text-anchor="middle" fill="#8a6d00">Vortex SDK / device mem</text>

  <line x1="150"  y1="100" x2="150"  y2="800" class="lane"/>
  <line x1="450"  y1="100" x2="450"  y2="800" class="lane"/>
  <line x1="780"  y1="100" x2="780"  y2="800" class="lane"/>
  <line x1="1130" y1="100" x2="1130" y2="800" class="lane"/>

  <!-- shared submit -->
  <path d="M 154 128 L 446 128" class="m"/>
  <text x="170" y="120" class="lb">clEnqueue{Write,Read,Copy,Fill,Map,Unmap}Buffer → ops->submit</text>
  <rect x="330" y="142" width="240" height="40" rx="5" class="actp"/>
  <text x="340" y="160" class="ts">push ready_list, signal worker</text>
  <text x="340" y="176" class="tt">app returns; worker calls the op below</text>

  <!-- WRITE group -->
  <rect x="120" y="204" width="1200" height="86" rx="6" class="grp"/>
  <text x="134" y="222" class="gl">Host → Device  (clEnqueueWriteBuffer / unmap of a writable map)</text>
  <path d="M 458 250 L 776 250" class="mp"/>
  <text x="474" y="242" class="lbp">pocl_vortex_write / unmap_mem(dst, offset, host_ptr, size)</text>
  <path d="M 788 250 L 1126 250" class="my"/>
  <text x="804" y="242" class="lby">vx_enqueue_write(vx_buffer, offset + origin, host_ptr, size)</text>
  <rect x="1040" y="264" width="200" height="18" rx="3" class="mem"/>
  <text x="1050" y="278" class="cm">bytes land in global mem</text>

  <!-- READ group -->
  <rect x="120" y="304" width="1200" height="86" rx="6" class="grp"/>
  <text x="134" y="322" class="gl">Device → Host  (clEnqueueReadBuffer / map_mem)</text>
  <path d="M 458 350 L 776 350" class="mp"/>
  <text x="474" y="342" class="lbp">pocl_vortex_read / map_mem(src, offset, host_ptr, size)</text>
  <path d="M 788 350 L 1126 350" class="my"/>
  <text x="804" y="342" class="lby">vx_enqueue_read(host_ptr, vx_buffer, offset + origin, size)</text>
  <path d="M 1126 378 L 788 378" class="rtn"/>
  <text x="900" y="370" class="lby">host_ptr filled</text>

  <!-- COPY / FILL group -->
  <rect x="120" y="404" width="1200" height="86" rx="6" class="grp"/>
  <text x="134" y="422" class="gl">On-device  (clEnqueueCopyBuffer / FillBuffer / rect variants)</text>
  <path d="M 458 450 L 776 450" class="mp"/>
  <text x="474" y="442" class="lbp">pocl_vortex_copy / memfill / {read,write,copy}_rect</text>
  <path d="M 788 450 L 1126 450" class="my"/>
  <text x="804" y="442" class="lby">vx_enqueue_copy / fill_buffer / *_rect  (each offset + origin)</text>
  <rect x="1010" y="464" width="230" height="18" rx="3" class="mem"/>
  <text x="1020" y="478" class="cm">device-to-device; no host round-trip</text>

  <!-- sync back -->
  <path d="M 788 520 L 458 520" class="rtn"/>
  <text x="500" y="512" class="lby">vx_sync_event → node complete → notify / idle_cond</text>
  <path d="M 446 548 L 154 548" style="stroke:#8e4a7e;stroke-width:1.4;fill:none;marker-end:url(#mm_p);stroke-dasharray:6 4;"/>
  <text x="200" y="540" class="lbp">clFinish / blocking call returns</text>

  <!-- notes -->
  <rect x="120" y="586" width="580" height="130" rx="6" class="note"/>
  <text x="132" y="606" class="th">Sub-buffers share the parent allocation</text>
  <text x="132" y="626" class="ts">A sub-buffer makes no device allocation: its wrapper retains the</text>
  <text x="132" y="642" class="ts">parent vx_buffer and records the region origin (bytes). Every</text>
  <text x="132" y="658" class="ts">transfer adds that origin to its offset; the pointer form baked into</text>
  <text x="132" y="674" class="ts">a kernel arg uses buf_address (already origin-adjusted). Applied</text>
  <text x="132" y="690" class="cm">exactly once</text>
  <text x="216" y="690" class="ts">per path — no double counting. Freeing releases the</text>
  <text x="132" y="706" class="ts">parent retain.</text>

  <rect x="720" y="586" width="600" height="130" rx="6" class="note"/>
  <text x="732" y="606" class="th">Rect and image transfers</text>
  <text x="732" y="626" class="ts">2D/3D rect ops map to the SDK's rect DMA (vx_enqueue_*_rect):</text>
  <text x="732" y="642" class="ts">PoCL no longer slices the rectangle row by row. The sub-buffer</text>
  <text x="732" y="658" class="ts">origin is folded into buffer_origin[0] (the linear byte base).</text>
  <text x="732" y="678" class="ts">Images move as rect transfers over the row/slice pitch, and</text>
  <text x="732" y="694" class="ts">CopyBufferToImage / CopyImageToBuffer route to the device-to-</text>
  <text x="732" y="710" class="ts">device rect copy (no host staging).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .app  { fill:#eef2f6; stroke:#5a7184; stroke-width:1.5; }
    .mesa { fill:#f7eef5; stroke:#8e4a7e; stroke-width:1.5; }
    .plat { fill:#e8f0f7; stroke:#2e5e82; stroke-width:1.5; }
    .sw   { fill:#f4faf4; stroke:#3a7d44; stroke-width:1.4; }
    .mem  { fill:#fdf6e3; stroke:#b58900; stroke-width:1.4; }
    .grp  { fill:none; stroke:#8899aa; stroke-width:1.3; stroke-dasharray:6 4; }
    .t    { fill:#1b2733; font-size:15px; font-weight:bold; }
    .th   { fill:#1b2733; font-size:13.5px; font-weight:bold; }
    .ts   { fill:#44525f; font-size:12px; }
    .tt   { fill:#5a6772; font-size:11.5px; font-style:italic; }
    .flow { stroke:#444; stroke-width:1.9; fill:none; marker-end:url(#arr); }
    .bnd  { stroke:#b58900; stroke-width:2; stroke-dasharray:9 5; fill:none; }
    .lbl  { fill:#33404c; font-size:12px; }
    .lblg { fill:#8a6d00; font-size:12px; font-weight:bold; }
  </style>

  <rect x="0" y="0" width="1080" height="720" fill="#ffffff"/>
  <text x="24" y="32" class="t" font-size="18">Graphics software stack — Vulkan app to hardware, one-directional mesa → Vortex</text>

  <!-- application -->
  <rect x="300" y="52" width="480" height="44" rx="6" class="app"/>
  <text x="540" y="80" class="th" text-anchor="middle">Vulkan application — vkCmdDraw / vkCmdDispatch / vkCmdTraceRays</text>
  <path d="M 540 96 L 540 122" class="flow"/>

  <!-- mesa_vortex -->
  <rect x="60" y="122" width="960" height="180" rx="6" class="grp"/>
  <text x="76" y="145" class="t" fill="#8e4a7e">mesa_vortex (branch vortex_3.x) — the Vulkan / Gallium driver</text>

  <rect x="76" y="156" width="270" height="128" rx="6" class="mesa"/>
  <text x="88" y="178" class="th">lavapipe</text>
  <text x="88" y="197" class="ts">Mesa Vulkan frontend</text>
  <text x="88" y="215" class="ts">→ Gallium pipe_context,</text>
  <text x="88" y="233" class="ts">NIR shaders</text>

  <rect x="366" y="156" width="638" height="128" rx="6" class="mesa"/>
  <text x="378" y="178" class="th">vortexpipe — Gallium driver (src/gallium/drivers/vortexpipe)</text>
  <text x="378" y="200" class="ts">vp_screen · vp_context — caps + state + draw orchestration</text>
  <text x="378" y="218" class="ts">vp_nir_to_llvm → vp_compile — VS/FS/compute NIR → .vxbin (FS per variant)</text>
  <text x="378" y="236" class="ts">vp_nir_lower_ray_tracing_to_rtu — RT intrinsics → RTU ops</text>
  <text x="378" y="254" class="ts">vp_raster — draw batch → front end + FF DCRs + delegated RASTER kick</text>
  <text x="378" y="272" class="ts">kernels/gfx_frontend/ — build recipe (sources from the SDK; blob embedded)</text>

  <path d="M 346 220 L 366 220" class="flow"/>

  <!-- SDK boundary -->
  <line x1="60" y1="322" x2="1020" y2="322" class="bnd"/>
  <text x="540" y="316" class="lblg" text-anchor="middle">SDK boundary — $VORTEX_PATH (install) / $VORTEX_HOME (source); vortex2 API + on-wire ABI (vx_gfx_abi.h)</text>
  <path d="M 540 302 L 540 344" class="flow"/>

  <!-- prism_v3 -->
  <rect x="60" y="344" width="960" height="320" rx="6" class="grp"/>
  <text x="76" y="367" class="t" fill="#2e5e82">this tree — the Vortex platform (SDK + SimX + RTL), single source of truth</text>

  <!-- sw layer -->
  <rect x="76" y="380" width="928" height="120" rx="6" class="sw"/>
  <text x="88" y="402" class="th" fill="#3a7d44">sw/ — VORTEX SDK (software)</text>
  <text x="88" y="422" class="ts">sw/runtime — libvortex.so: vortex2 API · FrontEndPool · program_raster/om/tex emitters</text>
  <text x="88" y="440" class="ts">sw/gfx — device kernels: expand_k + setup_k + binning_k + msaa_resolve_k, and libgfx_sw (SIMT software fallback)</text>
  <text x="88" y="458" class="ts">sw/common — ABI contracts (vx_gfx_abi, gfx_frontend_abi, gfx_fs_desc_abi, gfx_sw_abi) + gfx_ff_model reference oracle</text>
  <text x="88" y="476" class="ts">sw/kernel/include — vx_graphics.h (FF intrinsics: vx_om_export, vx_tex, vx_frag_*)</text>
  <text x="88" y="494" class="tt">the SimX tests and vortexpipe compile the same sw/gfx sources — no copies, no drift</text>

  <path d="M 260 500 L 260 528" class="flow"/>
  <path d="M 540 500 L 540 528" class="flow"/>
  <path d="M 820 500 L 820 528" class="flow"/>
  <text x="540" y="520" class="lbl" text-anchor="middle">backend — pick one at runtime (VORTEX_DRIVER)</text>

  <!-- backends -->
  <rect x="76" y="528" width="280" height="118" rx="6" class="plat"/>
  <text x="88" y="550" class="th">sim/simx — C++ model</text>
  <text x="88" y="570" class="ts">raster_core · om_core · tex_core</text>
  <text x="88" y="588" class="ts">(+ *_unit SFU-PE glue)</text>
  <text x="88" y="606" class="ts">drives real cache traffic</text>
  <text x="88" y="626" class="tt">SimX-first dev + eval; the oracle</text>

  <rect x="400" y="528" width="280" height="118" rx="6" class="plat"/>
  <text x="412" y="550" class="th">hw/rtl — Verilog</text>
  <text x="412" y="570" class="ts">VX_raster_* · VX_om_* · VX_tex_*</text>
  <text x="412" y="588" class="ts">VX_graphics.sv cluster wrapper</text>
  <text x="412" y="606" class="ts">rcache / ocache / tcache</text>
  <text x="412" y="626" class="tt">300 MHz U55C signoff</text>

  <rect x="724" y="528" width="280" height="118" rx="6" class="mem"/>
  <text x="736" y="550" class="th">XRT / FPGA — Alveo U55C</text>
  <text x="736" y="570" class="ts">synthesized bitstream</text>
  <text x="736" y="588" class="ts">on-card execution</text>
  <text x="736" y="626" class="tt">same SDK + kernels as above</text>

  <text x="76" y="690" class="tt">All three backends run the identical SDK + kernels and are validated against the gfx_ff_model oracle and the tests/graphics PNGs.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="Before, uploading a launch&#x27;s arguments forced a full LLC flush; now arguments go into a slot no kernel has read since the last full flush, so the launch follows right away.">
  <title>Before, uploading a launch&#x27;s arguments forced a full LLC flush; now arguments go into a slot no kernel has read since the last full flush, so the launch follows right away.</title>
  <defs><marker id="argslo_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="argslo_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="argslo_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="190" fill="#ffffff"/>
<g class="dl">
<text x="20" y="22" class="dh">Before</text>
<rect x="20" y="36" width="110" height="30" class="db"/><text x="75" y="56" text-anchor="middle">upload args</text>
<rect x="150" y="36" width="220" height="30" class="dbad"/><text x="260" y="56" text-anchor="middle">full LLC flush</text>
<rect x="390" y="36" width="90" height="30" class="db"/><text x="435" y="56" text-anchor="middle">launch</text>
<line x1="130" y1="51" x2="148" y2="51" class="ln" marker-end="url(#argslo_a)"/>
<line x1="370" y1="51" x2="388" y2="51" class="ln" marker-end="url(#argslo_a)"/>
<text x="20" y="112" class="dh">After</text>
<rect x="20" y="126" width="200" height="30" class="dgood"/><text x="120" y="146" text-anchor="middle">upload args to a clean slot</text>
<rect x="240" y="126" width="90" height="30" class="db"/><text x="285" y="146" text-anchor="middle">launch</text>
<line x1="220" y1="141" x2="238" y2="141" class="ln" marker-end="url(#argslo_a)"/>
<text x="345" y="138" class="dm">no kernel has read this slot</text>
<text x="345" y="153" class="dm">since the last full flush</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Fetch on write reads a store-missed sector from DRAM before merging the store. Without fetch, the sector is installed by a data-less fill with a dirty-byte mask and a partial bit; a later load refetches the sector and fills only its unwritten bytes, and an eviction writes back only the dirty bytes.">
  <title>Fetch on write reads a store-missed sector from DRAM before merging the store. Without fetch, the sector is installed by a data-less fill with a dirty-byte mask and a partial bit; a later load refetches the sector and fills only its unwritten bytes, and an eviction writes back only the dirty bytes.</title>
  <defs><marker id="wrvali_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="wrvali_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="wrvali_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="250" fill="#ffffff"/>
<text x="160" y="20" text-anchor="middle" class="dh">Fetch on write</text>
<text x="480" y="20" text-anchor="middle" class="dh">Write-allocate without fetch</text>
<g class="dl">
<rect x="20" y="36" width="220" height="24" class="db"/><text x="130.0" y="52.0" text-anchor="middle" class="ds">store miss to sector S</text>
<line x1="130" y1="60" x2="130" y2="78" class="ln" marker-end="url(#wrvali_a)"/>
<rect x="20" y="80" width="220" height="24" class="dbad"/><text x="130.0" y="96.0" text-anchor="middle" class="ds">read S from DRAM</text>
<line x1="130" y1="104" x2="130" y2="122" class="lb" marker-end="url(#wrvali_b)"/>
<rect x="20" y="124" width="220" height="24" class="db"/><text x="130.0" y="140.0" text-anchor="middle" class="ds">fill S, then merge the store</text>
<text x="20" y="178" class="db-t">every streamed line is read first,</text>
<text x="20" y="194" class="db-t">then overwritten</text>
<rect x="20" y="212" width="220" height="24" class="db"/><text x="130.0" y="228.0" text-anchor="middle" class="ds">evict: write back the sector</text>
<rect x="340" y="36" width="260" height="24" class="db"/><text x="470.0" y="52.0" text-anchor="middle" class="ds">store miss to sector S</text>
<line x1="470" y1="60" x2="470" y2="78" class="lg" marker-end="url(#wrvali_g)"/>
<rect x="340" y="80" width="260" height="24" class="dgood"/><text x="470.0" y="96.0" text-anchor="middle" class="ds">data-less fill from the loopback queue</text>
<line x1="470" y1="104" x2="470" y2="120" class="lg" marker-end="url(#wrvali_g)"/>
<rect x="340" y="124" width="20" height="20" class="dgood"/><rect x="362" y="124" width="20" height="20" class="dgood"/><rect x="384" y="124" width="20" height="20" class="dgood"/><rect x="406" y="124" width="20" height="20" class="didle"/><rect x="428" y="124" width="20" height="20" class="didle"/><rect x="450" y="124" width="20" height="20" class="didle"/><rect x="472" y="124" width="20" height="20" class="didle"/><rect x="494" y="124" width="20" height="20" class="didle"/>
<text x="522" y="139" class="ds">partial = 1</text>
<text x="340" y="162" class="g-t">dirty-byte mask, no DRAM read</text>
<rect x="340" y="176" width="260" height="24" class="db"/><text x="470.0" y="192.0" text-anchor="middle" class="ds">load: refetch, fill only the unwritten bytes</text>
<rect x="340" y="212" width="260" height="24" class="dgood"/><text x="470.0" y="228.0" text-anchor="middle" class="ds">evict: write back the dirty bytes only</text>
<line x1="320" y1="30" x2="320" y2="235" class="sep"/>
</g>
</svg>

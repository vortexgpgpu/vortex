<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Before, a 32-thread instruction on an 8-lane unit took four writeback beats on the commit port. The lane gather parks the partial passes in a hold and commits them with the completing pass in one beat.">
  <title>Before, a 32-thread instruction on an 8-lane unit took four writeback beats on the commit port. The lane gather parks the partial passes in a hold and commits them with the completing pass in one beat.</title>
  <defs><marker id="lanega_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="lanega_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="lanega_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: one beat per pass</text>
<text x="480" y="20" class="dh" text-anchor="middle">After: one beat per instruction</text>
<g class="dl">
<rect x="20" y="36" width="104" height="40" class="db"/><text x="72" y="53" text-anchor="middle">ALU / FPU</text><text x="72" y="68" text-anchor="middle" class="ds">8 lanes, 32 threads</text>
<line x1="72" y1="76" x2="72" y2="94" class="ln" marker-end="url(#lanega_a)"/>
<rect x="20" y="96" width="104" height="22" class="db"/><text x="72" y="111" text-anchor="middle" class="ds">pass 0 · t0–7</text>
<rect x="20" y="124" width="104" height="22" class="db"/><text x="72" y="139" text-anchor="middle" class="ds">pass 1 · t8–15</text>
<rect x="20" y="152" width="104" height="22" class="db"/><text x="72" y="167" text-anchor="middle" class="ds">pass 2 · t16–23</text>
<rect x="20" y="180" width="104" height="22" class="db"/><text x="72" y="195" text-anchor="middle" class="ds">pass 3 · t24–31</text>
<text x="150" y="104" class="dm">commit port</text>
<rect x="150" y="112" width="32" height="22" class="dbad"/>
<text x="166" y="127" text-anchor="middle" class="ds">p0</text>
<rect x="186" y="112" width="32" height="22" class="dbad"/>
<text x="202" y="127" text-anchor="middle" class="ds">p1</text>
<rect x="222" y="112" width="32" height="22" class="dbad"/>
<text x="238" y="127" text-anchor="middle" class="ds">p2</text>
<rect x="258" y="112" width="32" height="22" class="dbad"/>
<text x="274" y="127" text-anchor="middle" class="ds">p3</text>
<line x1="126" y1="150" x2="148" y2="128" class="lb" marker-end="url(#lanega_b)"/>
<text x="150" y="156" class="dm db-t">4 beats, port held</text>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
<rect x="340" y="36" width="104" height="40" class="db"/><text x="392" y="53" text-anchor="middle">ALU / FPU</text><text x="392" y="68" text-anchor="middle" class="ds">8 lanes, 32 threads</text>
<line x1="392" y1="76" x2="392" y2="94" class="ln" marker-end="url(#lanega_a)"/>
<rect x="340" y="96" width="104" height="22" class="db"/><text x="392" y="111" text-anchor="middle" class="ds">pass 0 · t0–7</text>
<rect x="340" y="124" width="104" height="22" class="db"/><text x="392" y="139" text-anchor="middle" class="ds">pass 1 · t8–15</text>
<rect x="340" y="152" width="104" height="22" class="db"/><text x="392" y="167" text-anchor="middle" class="ds">pass 2 · t16–23</text>
<rect x="340" y="180" width="104" height="22" class="db"/><text x="392" y="195" text-anchor="middle" class="ds">pass 3 · t24–31</text>
<rect x="476" y="96" width="140" height="50" class="dwait"/><text x="546" y="116" text-anchor="middle">hold</text><text x="546" y="133" text-anchor="middle" class="ds">p0, p1, p2 parked</text>
<line x1="446" y1="107" x2="474" y2="112" class="ln" marker-end="url(#lanega_a)"/>
<line x1="446" y1="135" x2="474" y2="121" class="ln" marker-end="url(#lanega_a)"/>
<line x1="446" y1="163" x2="474" y2="132" class="ln" marker-end="url(#lanega_a)"/>
<rect x="476" y="176" width="140" height="26" class="dgood"/><text x="546" y="193" text-anchor="middle">1 beat: t0–31</text>
<line x1="546" y1="146" x2="546" y2="174" class="lg" marker-end="url(#lanega_g)"/>
<line x1="446" y1="191" x2="474" y2="189" class="lg" marker-end="url(#lanega_g)"/>
<text x="340" y="222" class="dm">the completing pass commits with the hold</text>
</g>
</svg>

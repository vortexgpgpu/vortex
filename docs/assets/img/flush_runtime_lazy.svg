<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-label="The runtime tracks dirty L1s and a dirty LLC; it posts a device-scope flush before a launch that follows a launch, and a system-scope flush before a device-memory transfer while the LLC is dirty.">
  <title>The runtime tracks dirty L1s and a dirty LLC; it posts a device-scope flush before a launch that follows a launch, and a system-scope flush before a device-memory transfer while the LLC is dirty.</title>
  <defs><marker id="lazy_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 10.5px; }
    .ds { font-size: 10.5px; }
    .op { font-size: 10.5px; fill: #2f6fb0; font-family: Menlo, Consolas, monospace; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .dwarn { fill: #fdf3e1; stroke: #a8650b; stroke-width: 1.2; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
  </style>
  <rect width="780" height="470" fill="#ffffff"/>

  <rect x="40" y="140" width="180" height="60" rx="8" class="dgood"/>
  <text x="130" y="165" text-anchor="middle" class="dh">clean</text>
  <text x="130" y="183" text-anchor="middle" class="ds">l1_dirty = 0 · llc_dirty = 0</text>

  <rect x="560" y="140" width="180" height="60" rx="8" class="dwarn"/>
  <text x="650" y="165" text-anchor="middle" class="dh">L1 + LLC dirty</text>
  <text x="650" y="183" text-anchor="middle" class="ds">l1_dirty = 1 · llc_dirty = 1</text>

  <rect x="300" y="310" width="180" height="60" rx="8" class="db"/>
  <text x="390" y="335" text-anchor="middle" class="dh">LLC dirty</text>
  <text x="390" y="353" text-anchor="middle" class="ds">l1_dirty = 0 · llc_dirty = 1</text>

  <!-- clean -> dirty: launch -->
  <line x1="220" y1="156" x2="558" y2="156" class="ln" marker-end="url(#lazy_a)"/>
  <text x="389" y="148" text-anchor="middle">launch</text>
  <text x="389" y="134" text-anchor="middle" class="dm">no flush owed</text>
  <!-- dirty -> clean: DMA -->
  <line x1="558" y1="186" x2="222" y2="186" class="ln" marker-end="url(#lazy_a)"/>
  <text x="389" y="204" text-anchor="middle">transfer to/from device memory</text>
  <text x="389" y="219" text-anchor="middle" class="op">post ACQ|REL|SYS first</text>
  <!-- self loop on dirty: launch -->
  <path d="M620,140 C600,70 700,70 680,140" class="ln" marker-end="url(#lazy_a)"/>
  <text x="650" y="60" text-anchor="middle">launch</text>
  <text x="650" y="46" text-anchor="middle" class="op">post ACQ|REL first</text>
  <!-- self loop on clean: DMA -->
  <path d="M100,140 C80,70 180,70 160,140" class="ln" marker-end="url(#lazy_a)"/>
  <text x="130" y="60" text-anchor="middle">transfer</text>
  <text x="130" y="46" text-anchor="middle" class="dm">no flush owed</text>
  <!-- dirty -> LLC dirty: draw -->
  <line x1="610" y1="200" x2="470" y2="308" class="ln" marker-end="url(#lazy_a)"/>
  <text x="600" y="262">draw: ends on its own</text>
  <text x="600" y="277" class="op">ACQ|REL step</text>
  <!-- LLC dirty -> dirty: launch -->
  <line x1="480" y1="330" x2="640" y2="202" class="ln" marker-end="url(#lazy_a)"/>
  <text x="560" y="320">launch</text>
  <text x="560" y="335" class="dm">no flush owed</text>
  <!-- LLC dirty -> clean: DMA -->
  <line x1="300" y1="330" x2="150" y2="202" class="ln" marker-end="url(#lazy_a)"/>
  <text x="60" y="262">transfer</text>
  <text x="60" y="277" class="op">post ACQ|REL|SYS first</text>

  <line x1="20" y1="398" x2="760" y2="398" stroke="#c9d1d9" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="20" y="420" class="dm">A transfer inside the IO aperture, or a write into memory the LLC holds no line of (launch argument slots), owes nothing.</text>
  <text x="20" y="438" class="dm">When the CP DMA is a client of the LLC (device capability bit 28), launches leave the LLC clean and a transfer needs only ACQ|REL.</text>
  <text x="20" y="456" class="dm">Source: Device::cp_ring_append_ (sw/runtime/common/device.cpp). The flush is appended under the same lock as the command it precedes.</text>
</svg>

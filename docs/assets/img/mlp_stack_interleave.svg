<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="With a 16-byte slot row and a 64-byte dcache line, skewing by one row puts slot 0 of four warps in one line and one set. Skewing the warp index by whole lines puts each warp&#x27;s slot 0 in its own line and set.">
  <title>With a 16-byte slot row and a 64-byte dcache line, skewing by one row puts slot 0 of four warps in one line and one set. Skewing the warp index by whole lines puts each warp&#x27;s slot 0 in its own line and set.</title>
  <defs><marker id="stacki_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="stacki_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="stacki_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: skew by one row</text>
<text x="480" y="20" class="dh" text-anchor="middle">After: skew by whole lines</text>
<g class="dl">
<text x="138" y="44" text-anchor="middle" class="dm">row 0</text><text x="184" y="44" text-anchor="middle" class="dm">row 1</text><text x="230" y="44" text-anchor="middle" class="dm">row 2</text><text x="276" y="44" text-anchor="middle" class="dm">row 3</text>
<text x="16" y="67" class="dm">line 0 · set s</text>
<rect x="116" y="52" width="44" height="22" class="dbad"/>
<text x="138" y="67" text-anchor="middle" class="ds">w0</text>
<rect x="162" y="52" width="44" height="22" class="dbad"/>
<text x="184" y="67" text-anchor="middle" class="ds">w1</text>
<rect x="208" y="52" width="44" height="22" class="dbad"/>
<text x="230" y="67" text-anchor="middle" class="ds">w2</text>
<rect x="254" y="52" width="44" height="22" class="dbad"/>
<text x="276" y="67" text-anchor="middle" class="ds">w3</text>
<text x="16" y="95" class="dm">line 1 · set s+1</text>
<rect x="116" y="80" width="44" height="22" class="didle"/>
<rect x="162" y="80" width="44" height="22" class="didle"/>
<rect x="208" y="80" width="44" height="22" class="didle"/>
<rect x="254" y="80" width="44" height="22" class="didle"/>
<text x="16" y="123" class="dm">line 2 · set s+2</text>
<rect x="116" y="108" width="44" height="22" class="didle"/>
<rect x="162" y="108" width="44" height="22" class="didle"/>
<rect x="208" y="108" width="44" height="22" class="didle"/>
<rect x="254" y="108" width="44" height="22" class="didle"/>
<text x="16" y="151" class="dm">line 3 · set s+3</text>
<rect x="116" y="136" width="44" height="22" class="didle"/>
<rect x="162" y="136" width="44" height="22" class="didle"/>
<rect x="208" y="136" width="44" height="22" class="didle"/>
<rect x="254" y="136" width="44" height="22" class="didle"/>
<text x="16" y="176" class="dm">slot = word ^ warp</text>
<text x="16" y="192" class="dm db-t">4 warps' slot 0 in one line: one set</text>
<line x1="320" y1="30" x2="320" y2="200" class="sep"/>
<text x="458" y="44" text-anchor="middle" class="dm">row 0</text><text x="504" y="44" text-anchor="middle" class="dm">row 1</text><text x="550" y="44" text-anchor="middle" class="dm">row 2</text><text x="596" y="44" text-anchor="middle" class="dm">row 3</text>
<text x="336" y="67" class="dm">line 0 · set s</text>
<rect x="436" y="52" width="44" height="22" class="dgood"/>
<text x="458" y="67" text-anchor="middle" class="ds">w0</text>
<rect x="482" y="52" width="44" height="22" class="didle"/>
<rect x="528" y="52" width="44" height="22" class="didle"/>
<rect x="574" y="52" width="44" height="22" class="didle"/>
<text x="336" y="95" class="dm">line 1 · set s+1</text>
<rect x="436" y="80" width="44" height="22" class="dgood"/>
<text x="458" y="95" text-anchor="middle" class="ds">w1</text>
<rect x="482" y="80" width="44" height="22" class="didle"/>
<rect x="528" y="80" width="44" height="22" class="didle"/>
<rect x="574" y="80" width="44" height="22" class="didle"/>
<text x="336" y="123" class="dm">line 2 · set s+2</text>
<rect x="436" y="108" width="44" height="22" class="dgood"/>
<text x="458" y="123" text-anchor="middle" class="ds">w2</text>
<rect x="482" y="108" width="44" height="22" class="didle"/>
<rect x="528" y="108" width="44" height="22" class="didle"/>
<rect x="574" y="108" width="44" height="22" class="didle"/>
<text x="336" y="151" class="dm">line 3 · set s+3</text>
<rect x="436" y="136" width="44" height="22" class="dgood"/>
<text x="458" y="151" text-anchor="middle" class="ds">w3</text>
<rect x="482" y="136" width="44" height="22" class="didle"/>
<rect x="528" y="136" width="44" height="22" class="didle"/>
<rect x="574" y="136" width="44" height="22" class="didle"/>
<text x="336" y="176" class="dm">slot = word ^ (warp &lt;&lt; log2(line ÷ row))</text>
<text x="336" y="192" class="dm g-t">each warp's slot 0 in its own line and set</text>
<text x="16" y="218" class="dm">slot row = one word per thread: 16 B at 4 threads, XLEN 32; dcache line 64 B</text>
</g>

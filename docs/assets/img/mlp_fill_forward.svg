<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Before, every waiting request replayed through the bank pipeline after a fill. With fill forwarding, the waiting reads take their data from the staged fill, and only the first write replays.">
  <title>Before, every waiting request replayed through the bank pipeline after a fill. With fill forwarding, the waiting reads take their data from the staged fill, and only the first write replays.</title>
  <defs><marker id="fillfo_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="fillfo_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="fillfo_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: every waiter replays</text>
<text x="480" y="20" class="dh" text-anchor="middle">After: reads forward from the fill</text>
<g class="dl">
<rect x="20" y="36" width="110" height="26" class="db"/><text x="75" y="53" text-anchor="middle">fill: line L</text>
<rect x="20" y="90" width="110" height="24" class="db"/><text x="75" y="106" text-anchor="middle" class="ds">ld L+0 (waiting)</text>
<rect x="20" y="124" width="110" height="24" class="db"/><text x="75" y="140" text-anchor="middle" class="ds">ld L+4 (waiting)</text>
<rect x="20" y="158" width="110" height="24" class="db"/><text x="75" y="174" text-anchor="middle" class="ds">st L+8 (waiting)</text>
<rect x="190" y="110" width="110" height="44" class="dbad"/><text x="245" y="129" text-anchor="middle">bank pipeline</text><text x="245" y="145" text-anchor="middle" class="ds">3 replay passes</text>
<line x1="130" y1="102" x2="188" y2="120" class="lb" marker-end="url(#fillfo_b)"/>
<line x1="130" y1="136" x2="188" y2="132" class="lb" marker-end="url(#fillfo_b)"/>
<line x1="130" y1="170" x2="188" y2="144" class="lb" marker-end="url(#fillfo_b)"/>
<text x="245" y="176" text-anchor="middle" class="dm">new requests wait</text>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
<rect x="340" y="36" width="110" height="26" class="dgood"/><text x="395" y="53" text-anchor="middle">fill: line L</text>
<rect x="340" y="90" width="110" height="24" class="db"/><text x="395" y="106" text-anchor="middle" class="ds">ld L+0: done</text>
<rect x="340" y="124" width="110" height="24" class="db"/><text x="395" y="140" text-anchor="middle" class="ds">ld L+4: done</text>
<rect x="340" y="158" width="110" height="24" class="db"/><text x="395" y="174" text-anchor="middle" class="ds">st L+8 (waiting)</text>
<path d="M452,49 C480,60 480,95 452,102" class="lg" fill="none" marker-end="url(#fillfo_g)"/>
<path d="M452,52 C500,70 500,125 452,136" class="lg" fill="none" marker-end="url(#fillfo_g)"/>
<text x="505" y="96" class="dm">forward</text>
<rect x="510" y="150" width="110" height="40" class="db"/><text x="565" y="167" text-anchor="middle">bank pipeline</text><text x="565" y="182" text-anchor="middle" class="ds">1 replay, keeps order</text>
<line x1="450" y1="170" x2="508" y2="170" class="ln" marker-end="url(#fillfo_a)"/>
</g>
</svg>

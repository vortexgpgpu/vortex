<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Four consecutive words take four fetched flw instructions. One vx_flw.q is fetched once, and the micro-op sequencer expands it into four plain flw micro-ops, word k to register fd + k.">
  <title>Four consecutive words take four fetched flw instructions. One vx_flw.q is fetched once, and the micro-op sequencer expands it into four plain flw micro-ops, word k to register fd + k.</title>
  <defs><marker id="ldstwd_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="ldstwd_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="ldstwd_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="240" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: one load per word</text>
<text x="480" y="20" class="dh" text-anchor="middle">After: one wide load</text>
<g class="dl">
<rect x="20" y="44" width="120" height="22" class="db"/><text x="80" y="59" text-anchor="middle" class="ds">flw f28, 0(a0)</text>
<rect x="20" y="72" width="120" height="22" class="db"/><text x="80" y="87" text-anchor="middle" class="ds">flw f29, 4(a0)</text>
<rect x="20" y="100" width="120" height="22" class="db"/><text x="80" y="115" text-anchor="middle" class="ds">flw f30, 8(a0)</text>
<rect x="20" y="128" width="120" height="22" class="db"/><text x="80" y="143" text-anchor="middle" class="ds">flw f31, 12(a0)</text>
<rect x="180" y="44" width="110" height="106" class="dbad"/><text x="235" y="92" text-anchor="middle">fetch · decode</text><text x="235" y="108" text-anchor="middle" class="ds">4 front-end slots</text>
<line x1="140" y1="55" x2="178" y2="55" class="lb" marker-end="url(#ldstwd_b)"/>
<line x1="140" y1="83" x2="178" y2="83" class="lb" marker-end="url(#ldstwd_b)"/>
<line x1="140" y1="111" x2="178" y2="111" class="lb" marker-end="url(#ldstwd_b)"/>
<line x1="140" y1="139" x2="178" y2="139" class="lb" marker-end="url(#ldstwd_b)"/>
<text x="20" y="180" class="dm">4 consecutive words, 4 fetched instructions:</text>
<text x="20" y="196" class="dm">fetch slots the arithmetic needs</text>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
<rect x="340" y="40" width="140" height="24" class="db"/><text x="410" y="56" text-anchor="middle" class="ds">vx_flw.q f28, 0(a0)</text>
<rect x="500" y="40" width="120" height="24" class="dgood"/><text x="560" y="56" text-anchor="middle" class="ds">fetch · decode: 1 slot</text>
<line x1="480" y1="52" x2="498" y2="52" class="lg" marker-end="url(#ldstwd_g)"/>
<rect x="500" y="84" width="120" height="24" class="db"/><text x="560" y="100" text-anchor="middle" class="ds">uop sequencer</text>
<line x1="560" y1="64" x2="560" y2="82" class="ln" marker-end="url(#ldstwd_a)"/>
<line x1="500" y1="100" x2="482" y2="122" class="ln" marker-end="url(#ldstwd_a)"/>
<rect x="340" y="124" width="140" height="20" class="dgood"/><text x="410" y="138" text-anchor="middle" class="ds">flw f28 ← a0 + 0</text>
<rect x="340" y="147" width="140" height="20" class="dgood"/><text x="410" y="161" text-anchor="middle" class="ds">flw f29 ← a0 + 4</text>
<rect x="340" y="170" width="140" height="20" class="dgood"/><text x="410" y="184" text-anchor="middle" class="ds">flw f30 ← a0 + 8</text>
<rect x="340" y="193" width="140" height="20" class="dgood"/><text x="410" y="207" text-anchor="middle" class="ds">flw f31 ← a0 + 12</text>
<text x="500" y="140" class="dm">uop k: register + k,</text>
<text x="500" y="156" class="dm">offset + 4k (an OR)</text>
<text x="500" y="180" class="dm">fd: multiple of 4</text>
<text x="500" y="196" class="dm">imm: multiple of 16</text>
<text x="340" y="232" class="dm">each uop issues as a plain flw</text>
</g>
</svg>

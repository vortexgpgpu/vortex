<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="In a write-through cache, a load to a word with an older store still waiting must wait behind that store, not hit the old data.">
  <title>In a write-through cache, a load to a word with an older store still waiting must wait behind that store, not hit the old data.</title>
  <defs><marker id="wtorde_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="wtorde_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="wtorde_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: the load hits stale data</text>
<text x="480" y="20" class="dh" text-anchor="middle">After: the load waits for the store</text>
<g class="dl">
<rect x="20" y="40" width="130" height="26" class="db"/><text x="85" y="57" text-anchor="middle" class="ds">read miss, line L</text>
<rect x="20" y="86" width="130" height="26" class="db"/><text x="85" y="103" text-anchor="middle" class="ds">store X (waiting)</text>
<line x1="85" y1="66" x2="85" y2="84" class="ln" marker-end="url(#wtorde_a)"/>
<rect x="190" y="140" width="110" height="26" class="db"/><text x="245" y="157" text-anchor="middle" class="ds">load X (new)</text>
<rect x="20" y="180" width="130" height="26" class="dbad"/><text x="85" y="197" text-anchor="middle" class="ds">hit: returns old X</text>
<path d="M190,160 C150,165 150,180 152,190" class="lb" fill="none" marker-end="url(#wtorde_b)"/>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
<rect x="340" y="40" width="130" height="26" class="db"/><text x="405" y="57" text-anchor="middle" class="ds">read miss, line L</text>
<rect x="340" y="86" width="130" height="26" class="db"/><text x="405" y="103" text-anchor="middle" class="ds">store X (waiting)</text>
<rect x="340" y="132" width="130" height="26" class="dgood"/><text x="405" y="149" text-anchor="middle" class="ds">load X: linked behind</text>
<line x1="405" y1="66" x2="405" y2="84" class="ln" marker-end="url(#wtorde_a)"/>
<line x1="405" y1="112" x2="405" y2="130" class="lg" marker-end="url(#wtorde_g)"/>
<rect x="340" y="180" width="130" height="26" class="dgood"/><text x="405" y="197" text-anchor="middle" class="ds">returns new X</text>
<line x1="405" y1="158" x2="405" y2="178" class="lg" marker-end="url(#wtorde_g)"/>
<text x="490" y="103" class="dm">a waiting store</text><text x="490" y="118" class="dm">now counts as</text><text x="490" y="133" class="dm">a hazard</text>
</g>
</svg>

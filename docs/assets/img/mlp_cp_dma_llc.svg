<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Before: CP DMA writes DRAM directly, leaving stale lines in L2 that force a full LLC walk. After: CP DMA enters L2 on its own client slot, so only the L1s are flushed.">
  <title>Before: CP DMA writes DRAM directly, leaving stale lines in L2 that force a full LLC walk. After: CP DMA enters L2 on its own client slot, so only the L1s are flushed.</title>
  <defs><marker id="cpdmal_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="cpdmal_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="cpdmal_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="250" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: DMA beside the LLC</text>
        <text x="480" y="20" class="dh" text-anchor="middle">After: DMA as an LLC client</text>
        <g class="dl">
          <rect x="20" y="40" width="100" height="28" class="db"/><text x="70" y="59" text-anchor="middle">host</text>
          <rect x="20" y="110" width="100" height="28" class="db"/><text x="70" y="129" text-anchor="middle">CP DMA</text>
          <rect x="190" y="40" width="110" height="28" class="db"/><text x="245" y="59" text-anchor="middle">core L1s</text>
          <rect x="190" y="110" width="110" height="28" class="dbad"/><text x="245" y="129" text-anchor="middle">L2: stale lines</text>
          <rect x="105" y="190" width="110" height="28" class="db"/><text x="160" y="209" text-anchor="middle">DRAM</text>
          <line x1="70" y1="68" x2="70" y2="108" class="ln" marker-end="url(#cpdmal_a)"/>
          <line x1="245" y1="68" x2="245" y2="108" class="ln" marker-end="url(#cpdmal_a)"/>
          <line x1="70" y1="138" x2="130" y2="188" class="lb" marker-end="url(#cpdmal_b)"/><text x="60" y="172" class="dm">writes DRAM</text>
          <line x1="245" y1="138" x2="190" y2="188" class="ln" marker-end="url(#cpdmal_a)"/>
          <text x="245" y="160" class="dm db-t" text-anchor="middle">needs full walk</text>
          <line x1="320" y1="30" x2="320" y2="235" class="sep"/>
          <rect x="340" y="40" width="100" height="28" class="db"/><text x="390" y="59" text-anchor="middle">host</text>
          <rect x="340" y="110" width="100" height="28" class="db"/><text x="390" y="129" text-anchor="middle">CP DMA</text>
          <rect x="510" y="40" width="110" height="28" class="db"/><text x="565" y="59" text-anchor="middle">core L1s</text>
          <rect x="510" y="110" width="110" height="28" class="dgood"/><text x="565" y="129" text-anchor="middle">L2: coherent</text>
          <rect x="425" y="190" width="110" height="28" class="db"/><text x="480" y="209" text-anchor="middle">DRAM</text>
          <line x1="390" y1="68" x2="390" y2="108" class="ln" marker-end="url(#cpdmal_a)"/>
          <line x1="565" y1="68" x2="565" y2="108" class="ln" marker-end="url(#cpdmal_a)"/><text x="571" y="92" class="dm">L1-only flush</text>
          <line x1="440" y1="124" x2="508" y2="124" class="lg" marker-end="url(#cpdmal_g)"/><text x="474" y="116" class="dm" text-anchor="middle">client slot</text>
          <line x1="565" y1="138" x2="510" y2="188" class="ln" marker-end="url(#cpdmal_a)"/>
        </g>
</svg>

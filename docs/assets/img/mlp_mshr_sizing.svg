<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="A fixed 16-entry MSHR keeps fewer misses in flight than an a100 L2 bank needs to cover its memory latency at peak bandwidth; sizing it from bandwidth times latency gives the bank 64 entries.">
  <title>A fixed 16-entry MSHR keeps fewer misses in flight than an a100 L2 bank needs to cover its memory latency at peak bandwidth; sizing it from bandwidth times latency gives the bank 64 entries.</title>
  <defs><marker id="mshrsz_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="mshrsz_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="mshrsz_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="220" fill="#ffffff"/>
<text x="160" y="20" text-anchor="middle" class="dh">Fixed depth</text>
<text x="480" y="20" text-anchor="middle" class="dh">Depth from bandwidth × latency</text>
<g class="dl">
<text x="20" y="44" class="dm">a100 L2 bank: bandwidth × latency</text>
<rect x="20" y="54" width="16" height="20" class="dgood"/><rect x="37" y="54" width="16" height="20" class="dgood"/><rect x="54" y="54" width="16" height="20" class="dgood"/><rect x="71" y="54" width="16" height="20" class="dgood"/><rect x="88" y="54" width="16" height="20" class="didle"/><rect x="105" y="54" width="16" height="20" class="didle"/><rect x="122" y="54" width="16" height="20" class="didle"/><rect x="139" y="54" width="16" height="20" class="didle"/><rect x="156" y="54" width="16" height="20" class="didle"/><rect x="173" y="54" width="16" height="20" class="didle"/><rect x="190" y="54" width="16" height="20" class="didle"/><rect x="207" y="54" width="16" height="20" class="didle"/><rect x="224" y="54" width="16" height="20" class="didle"/><rect x="241" y="54" width="16" height="20" class="didle"/><rect x="258" y="54" width="16" height="20" class="didle"/><rect x="275" y="54" width="16" height="20" class="didle"/>
<line x1="20" y1="84" x2="291" y2="84" class="ln" marker-end="url(#mshrsz_a)"/>
<text x="20" y="100" class="ds">memory latency</text>
<text x="20" y="122" class="db-t">16 entries per bank</text>
<text x="340" y="44" class="dm">a100 L2 bank: bandwidth × latency</text>
<rect x="340" y="54" width="16" height="20" class="dgood"/><rect x="357" y="54" width="16" height="20" class="dgood"/><rect x="374" y="54" width="16" height="20" class="dgood"/><rect x="391" y="54" width="16" height="20" class="dgood"/><rect x="408" y="54" width="16" height="20" class="dgood"/><rect x="425" y="54" width="16" height="20" class="dgood"/><rect x="442" y="54" width="16" height="20" class="dgood"/><rect x="459" y="54" width="16" height="20" class="dgood"/><rect x="476" y="54" width="16" height="20" class="dgood"/><rect x="493" y="54" width="16" height="20" class="dgood"/><rect x="510" y="54" width="16" height="20" class="dgood"/><rect x="527" y="54" width="16" height="20" class="dgood"/><rect x="544" y="54" width="16" height="20" class="dgood"/><rect x="561" y="54" width="16" height="20" class="dgood"/><rect x="578" y="54" width="16" height="20" class="dgood"/><rect x="595" y="54" width="16" height="20" class="dgood"/>
<line x1="340" y1="84" x2="611" y2="84" class="ln" marker-end="url(#mshrsz_a)"/>
<text x="340" y="100" class="ds">memory latency</text>
<text x="340" y="122" class="g-t">64 entries per bank</text>
<text x="20" y="150" class="dm">every platform: MSHR 16 per bank,</text>
<text x="20" y="166" class="dm">LSU pending pool at most 32</text>
<text x="20" y="190" class="db-t">misses wait while bandwidth idles</text>
<text x="340" y="150" class="ds">in flight = peak BW ÷ clock × latency</text>
<text x="340" y="166" class="ds">MSHR = bank's share ÷ sector, power of two,</text>
<text x="340" y="182" class="ds">16 to 256 (dcache 64)</text>
<text x="340" y="198" class="ds">LSU pool: VX_CFG_LSU_PENDING_LIMIT, 32 to 256</text>
<line x1="320" y1="30" x2="320" y2="205" class="sep"/>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c6ca8"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7d44"/>
    </marker>
    <marker id="arry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b58900"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>
  <style>
    .blk  { fill:#e8f0f7; stroke:#2e5e82; stroke-width:1.6; }
    .ff   { fill:#f7eef5; stroke:#8e4a7e; stroke-width:1.6; }
    .ram  { fill:#fdf6e3; stroke:#b58900; stroke-width:1.6; }
    .bad  { fill:#fbeeed; stroke:#b03a2e; stroke-width:1.6; }
    .grp  { fill:none; stroke:#8899aa; stroke-width:1.2; stroke-dasharray:6 4; }
    .t    { fill:#1b2733; font-size:15px; font-weight:bold; }
    .ts   { fill:#44525f; font-size:12.5px; }
    .tg   { fill:#5a6772; font-size:13px; font-weight:bold; }
    .w    { stroke:#444; stroke-width:1.8; fill:none; marker-end:url(#arr); }
    .wmis { stroke:#1c6ca8; stroke-width:1.8; fill:none; marker-end:url(#arrb); }
    .whit { stroke:#3a7d44; stroke-width:2.0; fill:none; marker-end:url(#arrg); }
    .wram { stroke:#b58900; stroke-width:1.8; fill:none; marker-end:url(#arry); }
    .wbus { stroke:#b58900; stroke-width:1.8; fill:none; marker-end:url(#arry); marker-start:url(#arry); }
    .wflt { stroke:#b03a2e; stroke-width:1.8; fill:none; marker-end:url(#arrr); stroke-dasharray:5 3; }
    .wctl { stroke:#3a7d44; stroke-width:1.5; fill:none; marker-end:url(#arrg); stroke-dasharray:4 3; }
    .l    { fill:#444; font-size:12px; }
    .li   { fill:#1b2733; font-size:12.5px; font-weight:bold; }
    .lg   { fill:#2f6b39; font-size:12px; }
    .lb   { fill:#1c6ca8; font-size:12px; }
    .ly   { fill:#8a6d00; font-size:12px; }
    .lr   { fill:#b03a2e; font-size:12px; }
  </style>

  <rect x="0" y="0" width="1500" height="620" fill="#ffffff"/>
  <text x="24" y="34" class="t" font-size="20">VX_ptw — shared page-table walker complex</text>

  <rect x="200" y="120" width="190" height="90" rx="6" class="ff"/>
  <text x="295" y="150" class="t" text-anchor="middle">Walk cache</text>
  <text x="295" y="170" class="ts" text-anchor="middle">direct-mapped</text>
  <text x="295" y="186" class="ts" text-anchor="middle">WALK_CACHE_SIZE × table PPN</text>

  <rect x="450" y="120" width="170" height="90" rx="6" class="blk"/>
  <text x="535" y="150" class="t" text-anchor="middle">Dispatch</text>
  <text x="535" y="170" class="ts" text-anchor="middle">lowest idle walker</text>
  <text x="535" y="186" class="ts" text-anchor="middle">start ppn / level</text>

  <rect x="450" y="250" width="170" height="60" rx="6" class="ff"/>
  <text x="535" y="274" class="t" text-anchor="middle">Dispatch record</text>
  <text x="535" y="294" class="ts" text-anchor="middle">vpn · access · amo per walker</text>

  <rect x="450" y="370" width="170" height="60" rx="6" class="blk"/>
  <text x="535" y="394" class="t" text-anchor="middle">WC write pick</text>
  <text x="535" y="414" class="ts" text-anchor="middle">lowest writing walker</text>

  <!-- walker group -->
  <rect x="680" y="80" width="400" height="300" rx="6" class="grp"/>
  <text x="692" y="102" class="tg">VX_ptw_walker × NUM_WALKERS</text>

  <rect x="700" y="120" width="170" height="90" rx="6" class="blk"/>
  <text x="785" y="150" class="t" text-anchor="middle">Walker FSM</text>
  <text x="785" y="170" class="ts" text-anchor="middle">IDLE · REQ · WAIT · RESP</text>
  <text x="785" y="186" class="ts" text-anchor="middle">level counter</text>

  <rect x="900" y="120" width="160" height="90" rx="6" class="blk"/>
  <text x="980" y="150" class="t" text-anchor="middle">PTE address</text>
  <text x="980" y="170" class="ts" text-anchor="middle">{table ppn, vpn[level]}</text>
  <text x="980" y="186" class="ts" text-anchor="middle">one line read per level</text>

  <rect x="700" y="260" width="170" height="90" rx="6" class="blk"/>
  <text x="785" y="290" class="t" text-anchor="middle">PTE decode</text>
  <text x="785" y="310" class="ts" text-anchor="middle">leaf · bad · misaligned</text>
  <text x="785" y="326" class="ts" text-anchor="middle">walk_done / walk_fault</text>

  <rect x="900" y="260" width="160" height="90" rx="6" class="ff"/>
  <text x="980" y="290" class="t" text-anchor="middle">Result</text>
  <text x="980" y="310" class="ts" text-anchor="middle">ppn · flags · level · fault</text>
  <text x="980" y="326" class="ts" text-anchor="middle">held until accepted</text>

  <rect x="1140" y="120" width="170" height="90" rx="6" class="blk"/>
  <text x="1225" y="150" class="t" text-anchor="middle">Mem arb</text>
  <text x="1225" y="170" class="ts" text-anchor="middle">VX_mem_bus_arb N → 1</text>
  <text x="1225" y="186" class="ts" text-anchor="middle">walker index in tag</text>

  <rect x="900" y="440" width="160" height="70" rx="6" class="blk"/>
  <text x="980" y="466" class="t" text-anchor="middle">Rsp arb</text>
  <text x="980" y="486" class="ts" text-anchor="middle">VX_stream_arb N → 1</text>

  <rect x="1140" y="440" width="170" height="70" rx="6" class="bad"/>
  <text x="1225" y="466" class="t" text-anchor="middle">Fault pick</text>
  <text x="1225" y="486" class="ts" text-anchor="middle">lowest faulting walker</text>

  <!-- wires -->
  <path d="M 40 165 L 200 165" class="wmis"/>
  <text x="40" y="146" class="li">miss_if.req</text>
  <text x="40" y="160" class="lb">{id, access, amo, vpn}</text>
  <path d="M 120 165 L 120 100 L 470 100 L 470 120" class="wmis"/>
  <text x="200" y="94" class="lb">request (id · vpn · access · amo)</text>
  <path d="M 390 165 L 450 165" class="wram"/>
  <text x="394" y="158" class="ly">hit · ppn</text>
  <path d="M 580 60 L 580 120" class="wctl"/>
  <text x="590" y="80" class="li">satp</text>
  <text x="590" y="94" class="lg">root PPN</text>
  <path d="M 60 190 L 200 190" class="wctl"/>
  <text x="60" y="210" class="li">flush_if.req</text>
  <text x="60" y="224" class="lg">clear</text>
  <path d="M 620 165 L 700 165" class="wmis"/>
  <text x="626" y="158" class="lb">dispatch_i</text>
  <path d="M 870 165 L 900 165" class="w"/>
  <path d="M 1060 165 L 1140 165" class="wram"/>
  <text x="1070" y="158" class="ly">req[i]</text>
  <path d="M 1310 165 L 1440 165" class="wbus"/>
  <text x="1320" y="146" class="li">mem_bus_if</text>
  <text x="1320" y="160" class="ly">L2 client L2_PTW_IDX</text>
  <path d="M 1140 195 L 1100 195 L 1100 240 L 830 240 L 830 260" class="wram"/>
  <text x="840" y="254" class="ly">line data [i]</text>
  <path d="M 785 260 L 785 210" class="w"/>
  <text x="778" y="238" class="l" text-anchor="end">done / descend</text>
  <path d="M 870 305 L 900 305" class="w"/>
  <path d="M 700 320 L 665 320 L 665 400 L 620 400" class="wram"/>
  <text x="672" y="360" class="ly">level 1 → 0:</text>
  <text x="672" y="374" class="ly">{vpn, ppn}</text>
  <path d="M 450 400 L 295 400 L 295 210" class="wram"/>
  <text x="300" y="394" class="ly">write</text>
  <path d="M 980 350 L 980 440" class="whit"/>
  <text x="988" y="400" class="lg">rsp[i]</text>
  <path d="M 1060 330 L 1225 330 L 1225 440" class="wflt"/>
  <text x="1232" y="400" class="lr">fault[i]</text>
  <path d="M 535 210 L 535 250" class="w"/>
  <path d="M 620 280 L 650 280 L 650 530 L 1225 530 L 1225 510" class="wctl"/>
  <text x="700" y="524" class="lg">record[i] → fault va · access · amo</text>
  <path d="M 900 475 L 40 475" class="whit"/>
  <text x="40" y="495" class="li">miss_if.rsp</text>
  <text x="40" y="509" class="lg">{id, fault, level, ppn, flags}</text>
  <path d="M 1310 475 L 1440 475" class="wflt"/>
  <text x="1320" y="456" class="li">fault_if</text>
  <text x="1320" y="470" class="lr">va · access · amo</text>
  <path d="M 785 380 L 785 560 L 1440 560" class="wctl"/>
  <text x="1320" y="552" class="li">empty · flush_if.done</text>
  <text x="800" y="554" class="lg">¬ any walker active</text>
</svg>

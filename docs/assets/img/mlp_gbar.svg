<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Before, each cluster had its own global-barrier unit and released its cores after its own arrivals. With one device unit, every cluster forwards its cores&#x27; arrivals through a device arbiter to one barrier unit, which counts all four cores and releases them together.">
  <title>Before, each cluster had its own global-barrier unit and released its cores after its own arrivals. With one device unit, every cluster forwards its cores&#x27; arrivals through a device arbiter to one barrier unit, which counts all four cores and releases them together.</title>
  <defs><marker id="gbarde_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="gbarde_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="gbarde_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="250" fill="#ffffff"/>
<g class="dl">
<text x="160" y="20" text-anchor="middle" class="dh">A barrier unit per cluster</text>
<text x="480" y="20" text-anchor="middle" class="dh">One barrier unit for the device</text>
<rect x="20" y="36" width="130" height="134" class="didle"/>
<text x="85" y="52" text-anchor="middle" class="dm">cluster 0</text>
<rect x="30" y="60" width="50" height="24" class="db"/><text x="55" y="76" text-anchor="middle" class="ds">core 0</text>
<rect x="90" y="60" width="50" height="24" class="db"/><text x="115" y="76" text-anchor="middle" class="ds">core 1</text>
<rect x="30" y="122" width="110" height="38" class="dbad"/><text x="85" y="138.5" text-anchor="middle" class="ds">gbar: 2 of 2</text><text x="85" y="151.5" text-anchor="middle" class="ds">→ release</text>
<line x1="55" y1="84" x2="70" y2="120" class="lb" marker-end="url(#gbarde_b)"/>
<line x1="115" y1="84" x2="100" y2="120" class="lb" marker-end="url(#gbarde_b)"/>
<rect x="170" y="36" width="130" height="134" class="didle"/>
<text x="235" y="52" text-anchor="middle" class="dm">cluster 1</text>
<rect x="180" y="60" width="50" height="24" class="db"/><text x="205" y="76" text-anchor="middle" class="ds">core 2</text>
<rect x="240" y="60" width="50" height="24" class="db"/><text x="265" y="76" text-anchor="middle" class="ds">core 3</text>
<rect x="180" y="122" width="110" height="38" class="dbad"/><text x="235" y="138.5" text-anchor="middle" class="ds">gbar: 2 of 2</text><text x="235" y="151.5" text-anchor="middle" class="ds">→ release</text>
<line x1="205" y1="84" x2="220" y2="120" class="lb" marker-end="url(#gbarde_b)"/>
<line x1="265" y1="84" x2="250" y2="120" class="lb" marker-end="url(#gbarde_b)"/>
<text x="20" y="192" class="dm">each cluster releases after its own cores:</text>
<text x="20" y="208" class="dm">no ordering between clusters</text>
<line x1="320" y1="30" x2="320" y2="225" class="sep"/>
<rect x="340" y="36" width="130" height="70" class="didle"/>
<text x="405" y="52" text-anchor="middle" class="dm">cluster 0</text>
<rect x="350" y="60" width="50" height="24" class="db"/><text x="375" y="76" text-anchor="middle" class="ds">core 0</text>
<rect x="410" y="60" width="50" height="24" class="db"/><text x="435" y="76" text-anchor="middle" class="ds">core 1</text>
<line x1="405" y1="106" x2="450" y2="128" class="ln" marker-end="url(#gbarde_a)"/>
<rect x="490" y="36" width="130" height="70" class="didle"/>
<text x="555" y="52" text-anchor="middle" class="dm">cluster 1</text>
<rect x="500" y="60" width="50" height="24" class="db"/><text x="525" y="76" text-anchor="middle" class="ds">core 2</text>
<rect x="560" y="60" width="50" height="24" class="db"/><text x="585" y="76" text-anchor="middle" class="ds">core 3</text>
<line x1="555" y1="106" x2="510" y2="128" class="ln" marker-end="url(#gbarde_a)"/>
<rect x="400" y="130" width="160" height="24" class="db"/><text x="480" y="146" text-anchor="middle" class="ds">device arbiter</text>
<line x1="480" y1="154" x2="480" y2="168" class="ln" marker-end="url(#gbarde_a)"/>
<rect x="390" y="170" width="180" height="30" class="dgood"/><text x="480" y="189" text-anchor="middle" class="ds">VX_gbar_unit: 4 of 4</text>
<path d="M390,185 C350,185 350,140 360,108" class="lg" fill="none" marker-end="url(#gbarde_g)"/>
<path d="M570,185 C610,185 610,140 600,108" class="lg" fill="none" marker-end="url(#gbarde_g)"/>
<text x="340" y="222" class="dm">one arrival counter per barrier; the release</text>
<text x="340" y="238" class="dm">returns to every core at once</text>
</g>
</svg>

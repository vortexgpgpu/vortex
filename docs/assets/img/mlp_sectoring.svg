<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="L2 and L3 lines carry one tag over two 64-byte sectors; dcache banks scale with the thread count.">
  <title>L2 and L3 lines carry one tag over two 64-byte sectors; dcache banks scale with the thread count.</title>
  <defs><marker id="sector_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="sector_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="sector_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">L2/L3: one tag, two sectors</text>
<text x="480" y="20" class="dh" text-anchor="middle">Dcache: banks follow the lanes</text>
<g class="dl">
<text x="20" y="48" class="dm">before</text>
<rect x="60" y="34" width="44" height="24" class="dbad"/><text x="82" y="50" text-anchor="middle" class="ds">tag</text>
<rect x="106" y="34" width="100" height="24" class="db"/><text x="156" y="50" text-anchor="middle" class="ds">64 B line</text>
<rect x="60" y="62" width="44" height="24" class="dbad"/><text x="82" y="78" text-anchor="middle" class="ds">tag</text>
<rect x="106" y="62" width="100" height="24" class="db"/><text x="156" y="78" text-anchor="middle" class="ds">64 B line</text>
<text x="215" y="66" class="dm">2 tags per 128 B</text>
<text x="20" y="132" class="dm">after</text>
<rect x="60" y="118" width="44" height="24" class="dgood"/><text x="82" y="134" text-anchor="middle" class="ds">tag</text>
<rect x="106" y="118" width="100" height="24" class="db"/><text x="156" y="134" text-anchor="middle" class="ds">sector 0 · 64 B</text>
<rect x="208" y="118" width="100" height="24" class="db"/><text x="258" y="134" text-anchor="middle" class="ds">sector 1 · 64 B</text>
<text x="60" y="166" class="dm">1 tag per 128 B: half the tags</text>
<text x="60" y="182" class="dm">fills and evictions move one 64 B sector</text>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
<text x="340" y="48" class="dm">4 threads → 4 banks</text>
<rect x="340" y="56" width="14" height="16" class="dgood"/><rect x="356" y="56" width="14" height="16" class="dgood"/><rect x="372" y="56" width="14" height="16" class="dgood"/><rect x="388" y="56" width="14" height="16" class="dgood"/>
<text x="340" y="98" class="dm">8 threads → 8 banks</text>
<rect x="340" y="106" width="14" height="16" class="dgood"/><rect x="356" y="106" width="14" height="16" class="dgood"/><rect x="372" y="106" width="14" height="16" class="dgood"/><rect x="388" y="106" width="14" height="16" class="dgood"/><rect x="404" y="106" width="14" height="16" class="dgood"/><rect x="420" y="106" width="14" height="16" class="dgood"/><rect x="436" y="106" width="14" height="16" class="dgood"/><rect x="452" y="106" width="14" height="16" class="dgood"/>
<text x="340" y="148" class="dm">16 threads → 16 banks</text>
<g><rect x="340" y="156" width="14" height="16" class="dgood"/><rect x="356" y="156" width="14" height="16" class="dgood"/><rect x="372" y="156" width="14" height="16" class="dgood"/><rect x="388" y="156" width="14" height="16" class="dgood"/><rect x="404" y="156" width="14" height="16" class="dgood"/><rect x="420" y="156" width="14" height="16" class="dgood"/><rect x="436" y="156" width="14" height="16" class="dgood"/><rect x="452" y="156" width="14" height="16" class="dgood"/><rect x="468" y="156" width="14" height="16" class="dgood"/><rect x="484" y="156" width="14" height="16" class="dgood"/><rect x="500" y="156" width="14" height="16" class="dgood"/><rect x="516" y="156" width="14" height="16" class="dgood"/><rect x="532" y="156" width="14" height="16" class="dgood"/><rect x="548" y="156" width="14" height="16" class="dgood"/><rect x="564" y="156" width="14" height="16" class="dgood"/><rect x="580" y="156" width="14" height="16" class="dgood"/></g>
<text x="340" y="198" class="dm">banks = line footprint / word size, line size unchanged</text>
</g>
</svg>

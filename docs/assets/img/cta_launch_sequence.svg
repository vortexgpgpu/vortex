<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cl_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e5e82"/>
    </marker>
    <marker id="cl_p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8e4a7e"/>
    </marker>
    <marker id="cl_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7d44"/>
    </marker>
    <marker id="cl_y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b58900"/>
    </marker>
  </defs>
  <style>
    .lane { stroke:#c2ccd6; stroke-width:1.3; }
    .t    { fill:#1b2733; font-size:19px; font-weight:bold; }
    .th   { fill:#1b2733; font-size:12.5px; font-weight:bold; }
    .ts   { fill:#44525f; font-size:11px; }
    .tt   { fill:#5a6772; font-size:10.5px; font-style:italic; }
    .cm   { font-family:"DejaVu Sans Mono", monospace; font-size:10px; fill:#1b2733; }
    .act  { fill:#e8f0f7; stroke:#2e5e82; stroke-width:1.3; }
    .actp { fill:#f7eef5; stroke:#8e4a7e; stroke-width:1.3; }
    .actg { fill:#f4faf4; stroke:#3a7d44; stroke-width:1.3; }
    .mem  { fill:#fdf6e3; stroke:#b58900; stroke-width:1.3; }
    .note { fill:#fbfcfd; stroke:#5a7184; stroke-width:1.2; }
    .loop { fill:none; stroke:#2f6b39; stroke-width:1.5; stroke-dasharray:7 4; }
    .loopl{ fill:#eef7ef; stroke:#2f6b39; stroke-width:1.3; }
    .m    { stroke:#2e5e82; stroke-width:1.7; fill:none; marker-end:url(#cl_a); }
    .mp   { stroke:#8e4a7e; stroke-width:1.7; fill:none; marker-end:url(#cl_p); }
    .mg   { stroke:#3a7d44; stroke-width:1.7; fill:none; marker-end:url(#cl_g); }
    .my   { stroke:#b58900; stroke-width:1.7; fill:none; marker-end:url(#cl_y); }
    .lb   { fill:#2e5e82; font-size:10.5px; }
    .lbp  { fill:#8e4a7e; font-size:10.5px; }
    .lbg  { fill:#2f6b39; font-size:10.5px; }
    .lby  { fill:#8a6d00; font-size:10.5px; }
  </style>

  <rect x="0" y="0" width="1520" height="1000" fill="#ffffff"/>
  <text x="24" y="34" class="t">One kernel launch, end to end — DCR write to warp retirement</text>
  <text x="24" y="56" class="tt">A 2-CTA grid on a single core. The CTA never carries an identity: it acquires one — a local slot — on arrival.</text>

  <!-- lifelines -->
  <text x="120"  y="94" class="th" text-anchor="middle" fill="#5a7184">host / CP</text>
  <text x="360"  y="94" class="th" text-anchor="middle" fill="#8e4a7e">VX_kmu</text>
  <text x="620"  y="94" class="th" text-anchor="middle" fill="#2e5e82">kmu_arb tree</text>
  <text x="890"  y="94" class="th" text-anchor="middle" fill="#8e4a7e">VX_cta_dispatch</text>
  <text x="1180" y="94" class="th" text-anchor="middle" fill="#2e5e82">VX_scheduler</text>
  <text x="1420" y="94" class="th" text-anchor="middle" fill="#8a6d00">warp / CSR unit</text>

  <line x1="120"  y1="104" x2="120"  y2="944" class="lane"/>
  <line x1="360"  y1="104" x2="360"  y2="944" class="lane"/>
  <line x1="620"  y1="104" x2="620"  y2="944" class="lane"/>
  <line x1="890"  y1="104" x2="890"  y2="944" class="lane"/>
  <line x1="1180" y1="104" x2="1180" y2="944" class="lane"/>
  <line x1="1420" y1="104" x2="1420" y2="944" class="lane"/>

  <!-- ===== DCR programming ===== -->
  <path d="M 124 132 L 356 132" class="m"/>
  <text x="140" y="124" class="lb">DCR writes — 0x010..0x023, one per field</text>

  <rect x="240" y="146" width="240" height="42" rx="5" class="actp"/>
  <text x="250" y="164" class="ts">latch config regs</text>
  <text x="250" y="180" class="tt">never read back</text>

  <path d="M 124 212 L 356 212" class="mp"/>
  <text x="140" y="204" class="lbp">start pulse</text>

  <rect x="240" y="226" width="300" height="58" rx="5" class="actp"/>
  <text x="250" y="244" class="ts">ctx_id_r++  — a new launch identity</text>
  <text x="250" y="260" class="cm">running &lt;= grid_nonempty</text>
  <text x="250" y="278" class="tt">cluster_size_r / aligned_lmem_size_r settle here</text>

  <rect x="560" y="212" width="330" height="60" rx="5" class="note"/>
  <text x="572" y="230" class="th">An empty grid never enters this path</text>
  <text x="572" y="248" class="ts">grid_dim = 0 makes `running` stay low and kicks the</text>
  <text x="572" y="264" class="ts">raster engines instead — a delegated draw launch.</text>

  <!-- ===== CTA 0 ===== -->
  <path d="M 364 320 L 616 320" class="mp"/>
  <text x="380" y="312" class="lbp">CTA 0 — kmu_req_t, kind = COMPUTE, eop = 1</text>

  <rect x="500" y="334" width="240" height="42" rx="5" class="act"/>
  <text x="510" y="352" class="ts">round-robin: any ready core</text>
  <text x="510" y="368" class="tt">no placement hint on a CTA</text>

  <path d="M 624 400 L 886 400" class="m"/>
  <text x="640" y="392" class="lb">accept — ready = IDLE &amp;&amp; admit_ok</text>

  <rect x="760" y="414" width="300" height="76" rx="5" class="actp"/>
  <text x="770" y="432" class="ts">ctx_id != cur_ctx_id_r → clear init record</text>
  <text x="770" y="450" class="cm">slot_valid_r[base_slot] &lt;= 1</text>
  <text x="770" y="466" class="cm">cur_lmem_base_r &lt;= base_slot * stride</text>
  <text x="770" y="484" class="tt">state &lt;= DISPATCH — this is where cta_id is born</text>

  <!-- warp loop -->
  <rect x="700" y="510" width="800" height="150" rx="6" class="loop"/>
  <rect x="700" y="510" width="266" height="24" rx="4" class="loopl"/>
  <text x="710" y="527" class="lbg">loop  one warp per cycle, until is_last_warp</text>

  <path d="M 894 558 L 1176 558" class="mp"/>
  <text x="910" y="550" class="lbp">cta_fire — wid, PC, tmask, param, init</text>

  <rect x="1060" y="572" width="240" height="42" rx="5" class="act"/>
  <text x="1070" y="590" class="ts">active_warps[wid] = 1</text>
  <text x="1070" y="606" class="cm">warp_pcs[wid] = cta_PC</text>

  <path d="M 894 640 L 1416 640" class="my"/>
  <text x="1010" y="632" class="lby">in parallel: TID ripple writes cta_warp_ram, 2 lanes/cycle</text>

  <rect x="200" y="510" width="480" height="150" rx="6" class="note"/>
  <text x="212" y="530" class="th">Why the warp loop cannot stall the bus</text>
  <text x="212" y="550" class="ts">kmu_bus_if.ready is gated on state == IDLE, so the KMU sees</text>
  <text x="212" y="566" class="ts">back-pressure for the whole expansion and simply holds CTA 1</text>
  <text x="212" y="582" class="ts">on the wire. `valid` stays high — which is exactly why the arb</text>
  <text x="212" y="598" class="ts">lock must key on eop and not on valid falling.</text>
  <text x="212" y="622" class="ts">A CTA of N threads expands to ceil(N / NUM_THREADS) warps, so</text>
  <text x="212" y="638" class="ts">the bus is held for that many cycles — the dispatcher, not the</text>
  <text x="212" y="654" class="ts">KMU, sets the launch rate.</text>

  <!-- ===== CSR read ===== -->
  <path d="M 1416 700 L 1184 700" class="my"/>
  <text x="1220" y="692" class="lby">csrr CTA_BLOCK_ID_X — cta_id rides the instruction header</text>

  <path d="M 1176 732 L 894 732" class="m"/>
  <text x="960" y="724" class="lb">csr_rd_wid, csr_rd_cta_id</text>

  <rect x="700" y="746" width="300" height="42" rx="5" class="mem"/>
  <text x="710" y="764" class="ts">cta_ctx_ram[cta_id] read</text>
  <text x="710" y="780" class="tt">1 cycle, no divider</text>

  <path d="M 894 812 L 1416 812" class="my"/>
  <text x="1010" y="804" class="lby">cta_csrs + cta_lane — the read address is held stable for the RAM&#8217;s cycle</text>

  <rect x="1040" y="700" width="0" height="0" fill="none"/>

  <!-- ===== retirement ===== -->
  <path d="M 1416 860 L 1184 860" class="my"/>
  <text x="1230" y="852" class="lby">tmc with tmask == 0 — the warp exits</text>

  <path d="M 1176 892 L 894 892" class="mg"/>
  <text x="944" y="884" class="lbg">warp_done, wid</text>

  <rect x="620" y="906" width="380" height="34" rx="5" class="actg"/>
  <text x="630" y="928" class="cm">T0 → T1 → T2 : rem_warps-1; slot frees at 0</text>

  <rect x="1040" y="860" width="460" height="80" rx="5" class="note"/>
  <text x="1052" y="878" class="th">The slot frees immediately — and out of order</text>
  <text x="1052" y="896" class="ts">CTA 1 may already be resident in a later slot and retire first.</text>
  <text x="1052" y="912" class="ts">Nothing serialises reclaim, because slot i&#8217;s LMEM base is pinned</text>
  <text x="1052" y="928" class="ts">at i·stride for the whole kernel: a freed slot reuses its own region.</text>

  <!-- side note on cta_id -->
  <rect x="140" y="700" width="480" height="112" rx="5" class="note"/>
  <text x="152" y="720" class="th">cta_id is not sent — it is acquired, and it travels</text>
  <text x="152" y="740" class="ts">The dispatcher assigns cta_id = the local slot index at accept, then</text>
  <text x="152" y="756" class="ts">latches wid → cta_id. The scheduler reads that map with schedule_wid</text>
  <text x="152" y="772" class="ts">and stamps cta_id into the instruction header at issue.</text>
  <text x="152" y="794" class="ts">So by the time a csrr executes, its cta_id is already in hand and the</text>
  <text x="152" y="810" class="ts">CSR read is a direct RAM index — no reverse lookup, no stall.</text>
</svg>

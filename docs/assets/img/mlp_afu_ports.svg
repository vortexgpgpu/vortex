<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="The AFU now has one AXI port per GPU memory port, each mapped to its own HBM group, and a write&#x27;s data now leaves in the same cycle as its address.">
  <title>The AFU now has one AXI port per GPU memory port, each mapped to its own HBM group, and a write&#x27;s data now leaves in the same cycle as its address.</title>
  <defs><marker id="afupor_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="afupor_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="afupor_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="260" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: fixed per board</text>
<text x="480" y="20" class="dh" text-anchor="middle">After: follows the GPU</text>
<g class="dl">
<rect x="20" y="36" width="60" height="22" class="db"/><text x="50" y="51" text-anchor="middle" class="ds">GPU port 0</text>
<rect x="20" y="62" width="60" height="22" class="db"/><text x="50" y="77" text-anchor="middle" class="ds">GPU port 1</text>
<rect x="20" y="88" width="60" height="22" class="db"/><text x="50" y="103" text-anchor="middle" class="ds">GPU port 2</text>
<rect x="20" y="114" width="60" height="22" class="db"/><text x="50" y="129" text-anchor="middle" class="ds">GPU port 3</text>
<rect x="130" y="70" width="70" height="34" class="dbad"/><text x="165" y="91" text-anchor="middle" class="ds">1 AXI port</text>
<rect x="230" y="70" width="70" height="34" class="db"/><text x="265" y="91" text-anchor="middle" class="ds">HBM</text>
<line x1="80" y1="47" x2="128" y2="80" class="lb" marker-end="url(#afupor_b)"/><line x1="80" y1="73" x2="128" y2="84" class="lb" marker-end="url(#afupor_b)"/><line x1="80" y1="99" x2="128" y2="90" class="lb" marker-end="url(#afupor_b)"/><line x1="80" y1="125" x2="128" y2="96" class="lb" marker-end="url(#afupor_b)"/>
<line x1="200" y1="87" x2="228" y2="87" class="ln" marker-end="url(#afupor_a)"/>
<line x1="320" y1="30" x2="320" y2="150" class="sep"/>
<rect x="340" y="36" width="60" height="22" class="db"/><text x="370" y="51" text-anchor="middle" class="ds">GPU port 0</text>
<rect x="340" y="62" width="60" height="22" class="db"/><text x="370" y="77" text-anchor="middle" class="ds">GPU port 1</text>
<rect x="340" y="88" width="60" height="22" class="db"/><text x="370" y="103" text-anchor="middle" class="ds">GPU port 2</text>
<rect x="340" y="114" width="60" height="22" class="db"/><text x="370" y="129" text-anchor="middle" class="ds">GPU port 3</text>
<rect x="440" y="36" width="70" height="22" class="dgood"/><text x="475" y="51" text-anchor="middle" class="ds">AXI 0</text>
<rect x="440" y="62" width="70" height="22" class="dgood"/><text x="475" y="77" text-anchor="middle" class="ds">AXI 1</text>
<rect x="440" y="88" width="70" height="22" class="dgood"/><text x="475" y="103" text-anchor="middle" class="ds">AXI 2</text>
<rect x="440" y="114" width="70" height="22" class="dgood"/><text x="475" y="129" text-anchor="middle" class="ds">AXI 3</text>
<rect x="545" y="36" width="80" height="22" class="db"/><text x="585" y="51" text-anchor="middle" class="ds">HBM group 0</text>
<rect x="545" y="62" width="80" height="22" class="db"/><text x="585" y="77" text-anchor="middle" class="ds">HBM group 1</text>
<rect x="545" y="88" width="80" height="22" class="db"/><text x="585" y="103" text-anchor="middle" class="ds">HBM group 2</text>
<rect x="545" y="114" width="80" height="22" class="db"/><text x="585" y="129" text-anchor="middle" class="ds">HBM group 3</text>
<line x1="400" y1="47" x2="438" y2="47" class="lg" marker-end="url(#afupor_g)"/><line x1="400" y1="73" x2="438" y2="73" class="lg" marker-end="url(#afupor_g)"/><line x1="400" y1="99" x2="438" y2="99" class="lg" marker-end="url(#afupor_g)"/><line x1="400" y1="125" x2="438" y2="125" class="lg" marker-end="url(#afupor_g)"/>
<line x1="510" y1="47" x2="543" y2="47" class="ln" marker-end="url(#afupor_a)"/><line x1="510" y1="73" x2="543" y2="73" class="ln" marker-end="url(#afupor_a)"/><line x1="510" y1="99" x2="543" y2="99" class="ln" marker-end="url(#afupor_a)"/><line x1="510" y1="125" x2="543" y2="125" class="ln" marker-end="url(#afupor_a)"/>
<text x="20" y="182" class="dh">Write fall-through</text>
<text x="20" y="208" class="dm">before</text>
<rect x="80" y="196" width="60" height="18" class="db"/><text x="110" y="209" text-anchor="middle" class="ds">AW</text>
<rect x="142" y="196" width="60" height="18" class="dbad"/><text x="172" y="209" text-anchor="middle" class="ds">W</text>
<text x="212" y="209" class="dm">2 cycles per write</text>
<text x="20" y="240" class="dm">after</text>
<rect x="80" y="228" width="60" height="18" class="dgood"/><text x="110" y="241" text-anchor="middle" class="ds">AW + W</text>
<text x="150" y="241" class="dm">1 cycle per write</text>
</g>
</svg>

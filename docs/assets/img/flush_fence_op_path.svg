<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="One four-bit fence operation travels unchanged from the runtime and from kernel fences and ordered atomics, through the command processor, DCR receiver, flush injectors and LSU, into the dcache and down every cache level to memory.">
  <title>One four-bit fence operation travels unchanged from the runtime and from kernel fences and ordered atomics, through the command processor, DCR receiver, flush injectors and LSU, into the dcache and down every cache level to memory.</title>
  <defs><marker id="fop_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .lab { font-size: 10.5px; fill: #2f6fb0; font-family: Menlo, Consolas, monospace; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dsrc { fill: #eef3f8; stroke: #5a7184; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
  </style>
  <rect width="900" height="540" fill="#ffffff"/>

  <text x="20" y="22" class="dh">Kernel boundaries and host transfers</text>
  <rect x="20" y="36" width="180" height="62" class="dsrc"/>
  <text x="110" y="56" text-anchor="middle">Host runtime</text>
  <text x="110" y="72" text-anchor="middle" class="ds">lazy flush policy</text>
  <text x="110" y="87" text-anchor="middle" class="ds">l1_dirty / llc_dirty</text>

  <rect x="260" y="36" width="170" height="62" class="db"/>
  <text x="345" y="56" text-anchor="middle">Command processor</text>
  <text x="345" y="72" text-anchor="middle" class="ds">CMD_CACHE_FLUSH</text>
  <text x="345" y="87" text-anchor="middle" class="ds">broadcast write, per-core read</text>

  <rect x="490" y="36" width="170" height="62" class="db"/>
  <text x="575" y="56" text-anchor="middle">VX_dcr_data</text>
  <text x="575" y="72" text-anchor="middle" class="ds">one per core</text>
  <text x="575" y="87" text-anchor="middle" class="ds">latches the scope</text>

  <rect x="700" y="36" width="180" height="62" class="db"/>
  <text x="790" y="56" text-anchor="middle">VX_dcr_flush ×N</text>
  <text x="790" y="72" text-anchor="middle" class="ds">dcache lanes · icache</text>
  <text x="790" y="87" text-anchor="middle" class="ds">graphics caches</text>

  <line x1="200" y1="67" x2="258" y2="67" class="ln" marker-end="url(#fop_a)"/>
  <text x="229" y="122" text-anchor="middle" class="lab">flags[5:2]</text>
  <line x1="229" y1="110" x2="229" y2="70" class="sep"/>
  <line x1="430" y1="67" x2="488" y2="67" class="ln" marker-end="url(#fop_a)"/>
  <text x="459" y="122" text-anchor="middle" class="lab">DCR value</text>
  <line x1="459" y1="110" x2="459" y2="70" class="sep"/>
  <line x1="660" y1="67" x2="698" y2="67" class="ln" marker-end="url(#fop_a)"/>
  <text x="679" y="122" text-anchor="middle" class="lab">flush_op</text>
  <line x1="679" y1="110" x2="679" y2="70" class="sep"/>

  <text x="20" y="160" class="dh">Inside a kernel</text>
  <rect x="20" y="172" width="180" height="50" class="dsrc"/>
  <text x="110" y="192" text-anchor="middle">FENCE · FENCE.TSO · FENCE.I</text>
  <text x="110" y="208" text-anchor="middle" class="ds">vx_fence() = fence iorw,iorw</text>

  <rect x="20" y="252" width="180" height="50" class="dsrc"/>
  <text x="110" y="272" text-anchor="middle">AMO · LR · SC</text>
  <text x="110" y="288" text-anchor="middle" class="ds">with .aq / .rl</text>

  <rect x="260" y="172" width="170" height="50" class="db"/>
  <text x="345" y="192" text-anchor="middle">VX_decode</text>
  <text x="345" y="208" text-anchor="middle" class="ds">pred/succ sets → fence_op</text>

  <rect x="260" y="252" width="170" height="50" class="db"/>
  <text x="345" y="272" text-anchor="middle">VX_uop_amo</text>
  <text x="345" y="288" text-anchor="middle" class="ds">[REL fence] atomic [ACQ fence]</text>

  <rect x="490" y="207" width="170" height="62" class="db"/>
  <text x="575" y="227" text-anchor="middle">VX_lsu_block</text>
  <text x="575" y="243" text-anchor="middle" class="ds">a token per lane path</text>
  <text x="575" y="258" text-anchor="middle" class="ds">fence_lock until answered</text>

  <line x1="200" y1="197" x2="258" y2="197" class="ln" marker-end="url(#fop_a)"/>
  <line x1="200" y1="277" x2="258" y2="277" class="ln" marker-end="url(#fop_a)"/>
  <polyline points="430,197 460,197 460,228 488,228" class="ln" marker-end="url(#fop_a)"/>
  <polyline points="430,277 460,277 460,250 488,250" class="ln" marker-end="url(#fop_a)"/>

  <rect x="700" y="207" width="180" height="62" class="db"/>
  <text x="790" y="227" text-anchor="middle">dcache (L1)</text>
  <text x="790" y="243" text-anchor="middle" class="ds">VX_cache_init</text>
  <text x="790" y="258" text-anchor="middle" class="ds">applies the level rule</text>

  <line x1="660" y1="238" x2="698" y2="238" class="ln" marker-end="url(#fop_a)"/>
  <text x="679" y="196" text-anchor="middle" class="lab">amo_op</text>
  <line x1="679" y1="202" x2="679" y2="235" class="sep"/>
  <line x1="790" y1="98" x2="790" y2="205" class="ln" marker-end="url(#fop_a)"/>
  <text x="798" y="155" class="ds">flush token</text>

  <rect x="700" y="330" width="180" height="44" class="db"/>
  <text x="790" y="350" text-anchor="middle">L2</text>
  <text x="790" y="365" text-anchor="middle" class="ds">same rule</text>
  <rect x="700" y="410" width="180" height="44" class="db"/>
  <text x="790" y="430" text-anchor="middle">L3</text>
  <text x="790" y="445" text-anchor="middle" class="ds">same rule</text>
  <rect x="700" y="490" width="180" height="36" class="didle"/>
  <text x="790" y="512" text-anchor="middle">Memory</text>

  <line x1="760" y1="269" x2="760" y2="328" class="ln" marker-end="url(#fop_a)"/>
  <line x1="820" y1="269" x2="820" y2="328" class="ln" marker-end="url(#fop_a)"/>
  <line x1="760" y1="374" x2="760" y2="408" class="ln" marker-end="url(#fop_a)"/>
  <line x1="820" y1="374" x2="820" y2="408" class="ln" marker-end="url(#fop_a)"/>
  <line x1="760" y1="454" x2="760" y2="488" class="ln" marker-end="url(#fop_a)"/>
  <line x1="820" y1="454" x2="820" y2="488" class="ln" marker-end="url(#fop_a)"/>
  <text x="692" y="303" text-anchor="end" class="ds">one token per memory port,</text>
  <text x="692" y="317" text-anchor="end" class="ds">carrying the round's fence_op</text>

  <rect x="20" y="356" width="560" height="160" class="didle"/>
  <text x="36" y="380" class="dh">fence_op: 4 bits, defined once in VX_types.toml</text>
  <text x="36" y="404" class="lab">ACQ</text><text x="80" y="404">invalidate the levels above the point of coherence</text>
  <text x="36" y="426" class="lab">REL</text><text x="80" y="426">write back, or drain, the levels above it</text>
  <text x="36" y="448" class="lab">SYS</text><text x="80" y="448">system scope: the point of coherence is memory, not the LLC</text>
  <text x="36" y="470" class="lab">IO</text><text x="80" y="470">also wait for the uncached (device) path</text>
  <text x="36" y="500" class="dm">Blue labels name the field that carries the value on each hop. No hop re-encodes it.</text>
</svg>

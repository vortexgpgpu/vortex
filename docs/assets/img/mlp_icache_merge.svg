<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Before: four fetch slices request the same icache line and are served one per cycle. After: one access returns word 0 to 3 to slices 0 to 3 in the same cycle.">
  <title>Before: four fetch slices request the same icache line and are served one per cycle. After: one access returns word 0 to 3 to slices 0 to 3 in the same cycle.</title>
  <defs><marker id="icache_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="icache_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="icache_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: slices take turns</text>
        <text x="480" y="20" class="dh" text-anchor="middle">After: one access, a word per slice</text>
        <g class="dl">
          <rect x="20" y="40" width="88" height="26" class="db"/><text x="64" y="57" text-anchor="middle">slice 0: line L</text>
          <rect x="20" y="80" width="88" height="26" class="db"/><text x="64" y="97" text-anchor="middle">slice 1: line L</text>
          <rect x="20" y="120" width="88" height="26" class="db"/><text x="64" y="137" text-anchor="middle">slice 2: line L</text>
          <rect x="20" y="160" width="88" height="26" class="db"/><text x="64" y="177" text-anchor="middle">slice 3: line L</text>
          <rect x="150" y="96" width="62" height="34" class="dbad"/><text x="181" y="117" text-anchor="middle">icache</text>
          <line x1="108" y1="53" x2="148" y2="104" class="lb" marker-end="url(#icache_b)"/>
          <line x1="108" y1="93" x2="148" y2="110" class="lb" marker-end="url(#icache_b)"/>
          <line x1="108" y1="133" x2="148" y2="116" class="lb" marker-end="url(#icache_b)"/>
          <line x1="108" y1="173" x2="148" y2="122" class="lb" marker-end="url(#icache_b)"/>
          <rect x="222" y="100" width="20" height="26" class="dbad"/><text x="232" y="117" text-anchor="middle" class="ds">S0</text>
          <rect x="244" y="100" width="20" height="26" class="dbad"/><text x="254" y="117" text-anchor="middle" class="ds">S1</text>
          <rect x="266" y="100" width="20" height="26" class="dbad"/><text x="276" y="117" text-anchor="middle" class="ds">S2</text>
          <rect x="288" y="100" width="20" height="26" class="dbad"/><text x="298" y="117" text-anchor="middle" class="ds">S3</text>
          <text x="265" y="146" text-anchor="middle" class="dm">4 cycles</text>
          <line x1="320" y1="30" x2="320" y2="215" class="sep"/>
          <rect x="340" y="40" width="88" height="26" class="db"/><text x="384" y="57" text-anchor="middle">slice 0: line L</text>
          <rect x="340" y="80" width="88" height="26" class="db"/><text x="384" y="97" text-anchor="middle">slice 1: line L</text>
          <rect x="340" y="120" width="88" height="26" class="db"/><text x="384" y="137" text-anchor="middle">slice 2: line L</text>
          <rect x="340" y="160" width="88" height="26" class="db"/><text x="384" y="177" text-anchor="middle">slice 3: line L</text>
          <rect x="500" y="96" width="62" height="34" class="dgood"/><text x="531" y="117" text-anchor="middle">icache</text>
          <line x1="428" y1="53" x2="498" y2="106" class="ln" marker-end="url(#icache_a)"/>
          <path d="M500,124 C470,150 460,170 430,173" class="lg dash" fill="none" marker-end="url(#icache_g)"/>
          <path d="M500,121 C470,135 460,135 430,133" class="lg dash" fill="none" marker-end="url(#icache_g)"/>
          <path d="M500,118 C475,105 460,95 430,93" class="lg dash" fill="none" marker-end="url(#icache_g)"/>
          <path d="M500,115 C480,80 460,60 430,56" class="lg dash" fill="none" marker-end="url(#icache_g)"/>
          <text x="470" y="68" class="ds g-t">w0</text><text x="470" y="98" class="ds g-t">w1</text><text x="470" y="140" class="ds g-t">w2</text><text x="470" y="166" class="ds g-t">w3</text>
          <rect x="574" y="100" width="44" height="26" class="dgood"/><text x="596" y="117" text-anchor="middle" class="ds">S0–3</text>
          <text x="596" y="146" text-anchor="middle" class="dm">1 cycle</text>
        </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="A matrix fragment takes one fetched flw per register plus the per-lane address arithmetic. One vx_ldm names the fragment shape in its immediate, and the micro-op sequencer expands it into one flw per register, with the row group and column from the micro-op counter.">
  <title>A matrix fragment takes one fetched flw per register plus the per-lane address arithmetic. One vx_ldm names the fragment shape in its immediate, and the micro-op sequencer expands it into one flw per register, with the row group and column from the micro-op counter.</title>
  <defs><marker id="ldstmx_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="ldstmx_g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/></marker><marker id="ldstmx_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1b2733; font-size: 11.5px; }
    .dh { font-size: 13px; font-weight: bold; }
    .dm { fill: #5a6772; font-size: 11px; }
    .ds { font-size: 10.5px; }
    .db { fill: #fbfcfd; stroke: #5a7184; stroke-width: 1.2; }
    .dbad { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; }
    .dgood { fill: #e3f3ea; stroke: #1f7a4d; stroke-width: 1.2; }
    .didle { fill: #f3f5f8; stroke: #c9d1d9; stroke-width: 1.2; }
    .dwait { fill: #fbe5e3; stroke: #b3261e; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .ln { stroke: #1b2733; stroke-width: 1.3; fill: none; }
    .lb { stroke: #b3261e; stroke-width: 1.5; fill: none; }
    .lg { stroke: #1f7a4d; stroke-width: 1.5; }
    .dash { stroke-dasharray: 4 3; }
    .sep { stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 2 4; }
    text.db-t { fill: #b3261e; } text.g-t { fill: #1f7a4d; }
  </style>
  <rect width="640" height="230" fill="#ffffff"/>
<text x="160" y="20" class="dh" text-anchor="middle">Before: one load per register</text>
<text x="480" y="20" class="dh" text-anchor="middle">After: one fragment load</text>
<g class="dl">
<rect x="20" y="38" width="90" height="18" class="db"/><text x="65" y="51" text-anchor="middle" class="ds">flw f0, …</text>
<rect x="20" y="60" width="90" height="18" class="db"/><text x="65" y="73" text-anchor="middle" class="ds">flw f1, …</text>
<rect x="20" y="82" width="90" height="18" class="db"/><text x="65" y="95" text-anchor="middle" class="ds">flw f2, …</text>
<rect x="20" y="104" width="90" height="18" class="db"/><text x="65" y="117" text-anchor="middle" class="ds">flw f3, …</text>
<rect x="20" y="126" width="90" height="18" class="db"/><text x="65" y="139" text-anchor="middle" class="ds">flw f4, …</text>
<rect x="20" y="148" width="90" height="18" class="db"/><text x="65" y="161" text-anchor="middle" class="ds">flw f5, …</text>
<rect x="20" y="170" width="90" height="18" class="db"/><text x="65" y="183" text-anchor="middle" class="ds">flw f6, …</text>
<rect x="20" y="192" width="90" height="18" class="db"/><text x="65" y="205" text-anchor="middle" class="ds">flw f7, …</text>
<rect x="150" y="38" width="140" height="172" class="dbad"/><text x="220" y="112" text-anchor="middle">fetch · decode</text><text x="220" y="128" text-anchor="middle" class="ds">8 slots per fragment,</text><text x="220" y="142" text-anchor="middle" class="ds">plus per-lane address math</text>
<line x1="110" y1="124" x2="148" y2="124" class="lb" marker-end="url(#ldstmx_b)"/>
<line x1="320" y1="30" x2="320" y2="215" class="sep"/>
<rect x="340" y="40" width="140" height="24" class="db"/><text x="410" y="56" text-anchor="middle" class="ds">vx_ldm f0, imm(rs1)</text>
<text x="340" y="84" class="dm">imm[4:0] = shape:</text>
<text x="340" y="99" class="dm">A, B, C, sparse A,</text>
<text x="340" y="114" class="dm">sparse B, WGMMA C</text>
<rect x="500" y="40" width="120" height="24" class="dgood"/><text x="560" y="56" text-anchor="middle" class="ds">fetch · decode: 1 slot</text>
<line x1="480" y1="52" x2="498" y2="52" class="lg" marker-end="url(#ldstmx_g)"/>
<rect x="500" y="84" width="120" height="40" class="db"/><text x="560" y="100" text-anchor="middle" class="ds">uop sequencer</text><text x="560" y="115" text-anchor="middle" class="ds">row, column from uop #</text>
<line x1="560" y1="64" x2="560" y2="82" class="ln" marker-end="url(#ldstmx_a)"/>
<line x1="560" y1="124" x2="560" y2="146" class="ln" marker-end="url(#ldstmx_a)"/>
<rect x="340" y="148" width="32" height="22" class="dgood"/>
<text x="356" y="163" text-anchor="middle" class="ds">f0</text>
<rect x="375" y="148" width="32" height="22" class="dgood"/>
<text x="391" y="163" text-anchor="middle" class="ds">f1</text>
<rect x="410" y="148" width="32" height="22" class="dgood"/>
<text x="426" y="163" text-anchor="middle" class="ds">f2</text>
<rect x="445" y="148" width="32" height="22" class="dgood"/>
<text x="461" y="163" text-anchor="middle" class="ds">f3</text>
<rect x="480" y="148" width="32" height="22" class="dgood"/>
<text x="496" y="163" text-anchor="middle" class="ds">f4</text>
<rect x="515" y="148" width="32" height="22" class="dgood"/>
<text x="531" y="163" text-anchor="middle" class="ds">f5</text>
<rect x="550" y="148" width="32" height="22" class="dgood"/>
<text x="566" y="163" text-anchor="middle" class="ds">f6</text>
<rect x="585" y="148" width="32" height="22" class="dgood"/>
<text x="601" y="163" text-anchor="middle" class="ds">f7</text>
<text x="340" y="194" class="dm">one flw uop per register, 4 or 8 per fragment</text>
<text x="340" y="210" class="dm">address register of each uop: x[rs1 | row group]</text>
</g>
</svg>

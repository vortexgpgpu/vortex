<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The three core structures at issue width 4: compute slices, backend slices behind a frontend crossbar, and the stage-sliced core">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <style>
    .box     { fill:#f4f7fa; stroke:#5a7184; stroke-width:1.5; }
    .unit    { fill:#e8f0f7; stroke:#2e5e82; stroke-width:1.5; }
    .mem     { fill:#fdf6e3; stroke:#b58900; stroke-width:1.5; }
    .core    { fill:#f7eef5; stroke:#8e4a7e; stroke-width:1.5; }
    .grp     { fill:none; stroke:#8899aa; stroke-width:1.2; stroke-dasharray:6 4; }
    .tb      { fill:#1b2733; font-size:16px; font-weight:bold; }
    .t       { fill:#1b2733; font-size:14px; }
    .ts      { fill:#44525f; font-size:12.5px; }
    .tt      { fill:#5a6772; font-size:12.5px; font-style:italic; }
    .flow    { stroke:#444; stroke-width:1.6; fill:none; marker-end:url(#arr); }
  </style>

  <rect x="0" y="0" width="1500" height="600" fill="#ffffff"/>
  <text x="24" y="34" class="tb" font-size="20">Core partitioning at issue width 4: the widths select the structure</text>
  <rect x="20" y="52" width="460" height="500" rx="0" class="grp"/>
  <text x="36" y="78" class="tb" text-anchor="start">Compute slices</text>
  <text x="36" y="98" class="tt" text-anchor="start">FW = IW = every B = 4</text>
  <rect x="35" y="470" width="430" height="62" rx="6" class="mem"/>
  <text x="250" y="494" class="ts" text-anchor="middle">core-wide: CTA dispatch, barriers, retirement,</text>
  <text x="250" y="512" class="ts" text-anchor="middle">SFU/TCU shared services, icache · dcache · LMEM</text>
  <rect x="520" y="52" width="460" height="500" rx="0" class="grp"/>
  <text x="536" y="78" class="tb" text-anchor="start">Backend slices</text>
  <text x="536" y="98" class="tt" text-anchor="start">FW = 2 &lt; IW = every B = 4</text>
  <rect x="535" y="470" width="430" height="62" rx="6" class="mem"/>
  <text x="750" y="494" class="ts" text-anchor="middle">core-wide: CTA dispatch, barriers, retirement,</text>
  <text x="750" y="512" class="ts" text-anchor="middle">SFU/TCU shared services, icache · dcache · LMEM</text>
  <rect x="1020" y="52" width="460" height="500" rx="0" class="grp"/>
  <text x="1036" y="78" class="tb" text-anchor="start">Stage-sliced</text>
  <text x="1036" y="98" class="tt" text-anchor="start">FW = IW = 4, but the SFU has B = 1</text>
  <rect x="1035" y="470" width="430" height="62" rx="6" class="mem"/>
  <text x="1250" y="494" class="ts" text-anchor="middle">core-wide: CTA dispatch, barriers, retirement,</text>
  <text x="1250" y="512" class="ts" text-anchor="middle">SFU/TCU shared services, icache · dcache · LMEM</text>
  <rect x="38" y="112" width="100" height="332" rx="4" class="grp"/>
  <text x="88" y="130" class="ts" text-anchor="middle">compute slice 0</text>
  <rect x="46" y="142" width="84" height="80" rx="6" class="box"/>
  <text x="88" y="170" class="t" text-anchor="middle">frontend</text>
  <text x="88" y="188" class="ts" text-anchor="middle">slice</text>
  <text x="88" y="206" class="ts" text-anchor="middle">wid mod 4 = 0</text>
  <line x1="88" y1="222" x2="88" y2="250" class="flow"/>
  <rect x="46" y="252" width="84" height="182" rx="6" class="unit"/>
  <text x="88" y="276" class="t" text-anchor="middle">backend</text>
  <text x="88" y="294" class="ts" text-anchor="middle">slice</text>
  <text x="88" y="322" class="ts" text-anchor="middle">issue</text>
  <text x="88" y="342" class="ts" text-anchor="middle">ALU · FPU</text>
  <text x="88" y="362" class="ts" text-anchor="middle">LSU · SFU</text>
  <text x="88" y="382" class="ts" text-anchor="middle">TCU</text>
  <text x="88" y="402" class="ts" text-anchor="middle">commit</text>
  <line x1="88" y1="434" x2="88" y2="468" class="flow"/>

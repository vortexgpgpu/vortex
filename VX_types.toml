[dcr_raster]
VX_DCR_RASTER_STATE_BEGIN   = 0x060
VX_DCR_RASTER_TBUF_ADDR     = 0x060
VX_DCR_RASTER_TILE_COUNT    = 0x061
VX_DCR_RASTER_PBUF_ADDR     = 0x062
VX_DCR_RASTER_PBUF_STRIDE   = 0x063
VX_DCR_RASTER_SCISSOR_X     = 0x064
VX_DCR_RASTER_SCISSOR_Y     = 0x065
# Fragment-shader dispatch descriptor: the raster work distributor launches the FS
# on-device (true-GPU pixel dispatch). FRAG_ENTRY names the FS function and
# FRAG_PARAM its argument; the injected warp's program image base (__vx_cta_entry
# bootstrap PC) is the shared KMU startup PC (VX_DCR_KMU_STARTUP_ADDR0/1) the launch
# already publishes — one source of truth for both the raster dispatch and the KMU.
# The frame kick is the delegated draw launch: a kernel launch with an empty grid
# (GRID_DIM=0) makes the KMU kick the raster engines after all DCRs are delivered.
VX_DCR_RASTER_FRAG_ENTRY_LO = 0x066
VX_DCR_RASTER_FRAG_ENTRY_HI = 0x067
VX_DCR_RASTER_FRAG_PARAM_LO = 0x068
VX_DCR_RASTER_FRAG_PARAM_HI = 0x069
VX_DCR_RASTER_STATE_END     = 0x06A

[dcr_om]
VX_DCR_OM_STATE_BEGIN       = 0x080
VX_DCR_OM_CBUF_ADDR         = 0x080
VX_DCR_OM_CBUF_PITCH        = 0x081
VX_DCR_OM_CBUF_WRITEMASK    = 0x082
VX_DCR_OM_ZBUF_ADDR         = 0x083
VX_DCR_OM_ZBUF_PITCH        = 0x084
VX_DCR_OM_DEPTH_FUNC        = 0x085
VX_DCR_OM_DEPTH_WRITEMASK   = 0x086
VX_DCR_OM_STENCIL_FUNC      = 0x087
VX_DCR_OM_STENCIL_ZPASS     = 0x088
VX_DCR_OM_STENCIL_ZFAIL     = 0x089
VX_DCR_OM_STENCIL_FAIL      = 0x08A
VX_DCR_OM_STENCIL_REF       = 0x08B
VX_DCR_OM_STENCIL_MASK      = 0x08C
VX_DCR_OM_STENCIL_WRITEMASK = 0x08D
VX_DCR_OM_BLEND_MODE        = 0x08E
VX_DCR_OM_BLEND_FUNC        = 0x08F
VX_DCR_OM_BLEND_CONST       = 0x090
VX_DCR_OM_LOGIC_OP          = 0x091
# Early-Z safety gate: driver sets 1 when the FS has no depth-export and the
# depth func is monotonic (LESS/LEQUAL), permitting the raster unit to cull
# occluded fragments against committed depth before shading. 0 = full late-Z only.
VX_DCR_OM_EARLYZ_SAFE       = 0x092
# Fragment-export aperture. The shader exports a
# fragment by STORING to VX_MEM_OM_BASE_ADDR + offset; the cluster's OM steer
# peels the write off the L1->L2 trunk and the ingress turns it back into a
# {pos, colour, depth, face} request. These DCRs tell the ingress how to read an
# offset back.
#
# The encoding is SHIFT-ONLY:
#     offset = ((face << (XBITS+YBITS)) | (y << XBITS) | x) << RECORD_SHIFT
# The framebuffer pitch is padded to a power of two (XBITS = ceil(log2(width)),
# YBITS = ceil(log2(height))) so the ingress decodes by bit-slicing. A packed
# y*width + x would force a DIVIDER into the ingress. The aperture is virtual --
# nothing is stored there -- so the address space the padding wastes is free.
VX_DCR_OM_APERTURE_XBITS    = 0x093
VX_DCR_OM_APERTURE_YBITS    = 0x094
# Record shape. A shader emits colour only (2 -- early-Z owns the depth test AND
# the depth write; the common case), depth only (2 -- z-prepass / shadow map), or
# both (3 -- gl_FragDepth). DEPTH_ONLY disambiguates the two one-word modes.
VX_DCR_OM_APERTURE_RECORD_SHIFT = 0x095
VX_DCR_OM_APERTURE_DEPTH_ONLY   = 0x096
VX_DCR_OM_STATE_END         = 0x097

[dcr_rtu]
# Ray-Tracing Unit DCRs.
VX_DCR_RTU_STATE_BEGIN      = 0x0A0
VX_DCR_RTU_CONFIG           = 0x0A0
VX_DCR_RTU_TLAS_ROOT_LO     = 0x0A1
VX_DCR_RTU_TLAS_ROOT_HI     = 0x0A2
VX_DCR_RTU_CB_ENTRY_LO      = 0x0A3
VX_DCR_RTU_CB_ENTRY_HI      = 0x0A4
VX_DCR_RTU_REFORM_THRESH    = 0x0A5
VX_DCR_RTU_STATS_RESET      = 0x0A6
VX_DCR_RTU_STATE_END        = 0x0A7

[rtu_slots]
# RTU register file slot IDs — per-(warp,lane) named 32-bit slots in the RTU's hit
# window. The layout is CONTIGUITY-ORDERED: the RTU moves ray state as
# two bursts over a slot_base+count span, so the members of each span must abut.
#
#   ray input   [0..9]   one burst-read  (the RTU pulls its operands at arm)
#   result      [10..26] one burst-write (the RTU pushes traversal results)
#
# STATUS is deliberately the LAST slot of the result span: a parked WAIT
# completes on the address-match write to STATUS, so every other result word
# must already be in the window when it lands. Moving STATUS earlier would race
# the warp against its own candidate metadata.

# ── ray input span [0..9] — kernel writes before the trace, RTU burst-reads ──
VX_RT_RAY_ORIGIN            = 0       # origin.{x,y,z}    (0..2)
VX_RT_RAY_DIRECTION         = 3       # direction.{x,y,z} (3..5)
VX_RT_T_MIN                 = 6
VX_RT_T_MAX                 = 7
VX_RT_RAY_FLAGS             = 8
VX_RT_CULL_MASK             = 9
# The ray is NOT window storage: these name the fields of the ray the TRACE burst
# streams straight into the RTU (see VX_rtu_pkg RTU_RAY_BEATS). scene_base, flags,
# cull_mask and the payload pointer are warp-uniform and ride the arm doorbell.

# ── result span [10..26] — RTU burst-writes; STATUS last ──
VX_RT_HIT_T                 = 10
VX_RT_HIT_BARY_U            = 11
VX_RT_HIT_BARY_V            = 12
VX_RT_HIT_PRIMITIVE_ID      = 13
VX_RT_HIT_INSTANCE_ID       = 14
VX_RT_HIT_GEOMETRY_INDEX    = 15
VX_RT_HIT_INSTANCE_CUSTOM   = 16
VX_RT_OBJECT_RAY_ORIGIN     = 17      # object_ray.origin.{x,y,z}    (17..19)
VX_RT_OBJECT_RAY_DIRECTION  = 20      # object_ray.direction.{x,y,z} (20..22)
VX_RT_CB_TYPE               = 23      # candidate kind: ANYHIT(1) | PROC(2) | CHS(3) | MISS(4)
VX_RT_HIT_SBT_IDX           = 24      # candidate's shader-binding-table index
VX_RT_CB_HANDLE             = 25      # candidate's originating slot handle (per lane)
VX_RT_STATUS                = 26      # per-lane VX_RT_STS_*; WAIT completes on this write

# ── RTU-written, outside the record spans ──
# Every slot is written by the RTU and read by the shader; nothing else writes the
# window. The payload pointer rides the arm doorbell (warp-uniform) and the
# hitAttribute rides the CONTINUE, so both reach the RTU without a window write.
VX_RT_PAYLOAD_PTR_LO        = 27      # the tracing shader's payload; the callbacks read it
VX_RT_HIT_ATTR_0            = 29      # user hitAttributeEXT (an IS shader returns it)

VX_RT_SLOT_COUNT            = 32

[rtu_status]
# Per-lane vx_rt_wait / vx_rt_continue return status. Terminal codes 0..1 end
# the lane's traversal loop; codes 2..4 keep it proceeding (rayQueryProceedEXT
# semantics). YIELD_* means this lane has a candidate to service; PENDING means
# it is still traversing and has nothing to service this iteration (its action
# is ignored) — a candidate batch that covers only some lanes (e.g. divergent-SBT
# reformation) leaves the rest PENDING so they neither exit the loop early nor
# act on stale candidate data. Error codes >=128.
VX_RT_STS_DONE_HIT          = 0
VX_RT_STS_DONE_MISS         = 1
VX_RT_STS_YIELD_ANYHIT      = 2
VX_RT_STS_YIELD_PROC        = 3
VX_RT_STS_PENDING           = 4
VX_RT_STS_ERROR             = 128

[rtu_flags]
# Ray flags (matches SpvRayFlags* semantics).
VX_RT_FLAG_OPAQUE                  = 0x01
VX_RT_FLAG_NO_OPAQUE               = 0x02
VX_RT_FLAG_TERMINATE_ON_FIRST_HIT  = 0x04
VX_RT_FLAG_SKIP_CLOSEST_HIT        = 0x08
VX_RT_FLAG_CULL_BACK_FACING        = 0x10
VX_RT_FLAG_CULL_FRONT_FACING       = 0x20
VX_RT_FLAG_CULL_OPAQUE             = 0x40

# Texture unit DCR (32-entry block: 6 base + up to VX_TEX_LOD_MAX mip offsets)
[dcr_tex]
VX_DCR_TEX_STATE_BEGIN = 0x040
VX_DCR_TEX_STAGE       = 0x040
VX_DCR_TEX_ADDR        = 0x041
VX_DCR_TEX_LOGDIM      = 0x042
VX_DCR_TEX_FORMAT      = 0x043
VX_DCR_TEX_FILTER      = 0x044
VX_DCR_TEX_WRAP        = 0x045
# VX_DCR_TEX_MIPOFF(lod) = VX_DCR_TEX_MIPOFF_BASE + lod, lod < VX_TEX_LOD_MAX
VX_DCR_TEX_MIPOFF_BASE = 0x046
VX_DCR_TEX_STATE_END   = 0x060

[tex_const]
VX_TEX_STAGE_COUNT = 2
VX_TEX_DIM_BITS    = 15
VX_TEX_LOD_MAX     = 15
VX_TEX_SUBPIXEL_BITS = 8
VX_TEX_FXD_BITS    = 32

VX_TEX_FILTER_POINT    = 0
VX_TEX_FILTER_BILINEAR = 1
# Mip filter occupies the bit above the mag/min filter. MIP_LINEAR (sample two
# levels and lerp them) is a SOFTWARE sampler capability only: the texture unit
# has a single tap set and no inter-level blend, so it samples one level and the
# `vx_tex` lod operand is an integer level. A shader wanting mip-linear issues
# two vx_tex and lerps the results; the unit rejects the MIP_LINEAR bit.
# The fixed-point form (integer level, blend weight in the low
# VX_TEX_LOD_FRAC_BITS) is how the software LOD math carries a fractional level.
VX_TEX_FILTER_MIP_NONE   = 0
VX_TEX_FILTER_MIP_LINEAR = 2
VX_TEX_LOD_FRAC_BITS     = 8

VX_TEX_WRAP_CLAMP  = 0
VX_TEX_WRAP_REPEAT = 1
VX_TEX_WRAP_MIRROR = 2
# W5: CLAMP_TO_BORDER — out-of-[0,1) taps return the sampler border colour.
# Not representable by the FF TEX unit, so a BORDER wrap routes the draw to the
# on-device software sampler (gfx_tex_sample_sw).
VX_TEX_WRAP_BORDER = 3

VX_TEX_FORMAT_A8R8G8B8 = 0
VX_TEX_FORMAT_R5G6B5   = 1
VX_TEX_FORMAT_A1R5G5B5 = 2
VX_TEX_FORMAT_A4R4G4B4 = 3
VX_TEX_FORMAT_A8L8     = 4
VX_TEX_FORMAT_L8       = 5
VX_TEX_FORMAT_A8       = 6
# W5 extended sampled formats — SOFTWARE sampler only. FF vx_tex4 handles only
# formats 0..VX_TEX_FORMAT_FF_MAX; anything above routes to gfx_tex_sample_sw
# (routing law). sRGB is linearised on sample and depth reads as luminance, both
# into the sampler's 8-bit ARGB working colour; the float formats hold values
# outside [0,1] and are decoded and filtered in float instead.
VX_TEX_FORMAT_FF_MAX   = 6
VX_TEX_FORMAT_SRGB8     = 7    # R8G8B8(X8) sRGB, alpha forced 1.0
VX_TEX_FORMAT_SRGB8A8   = 8    # R8G8B8A8 sRGB (RGB gamma-decoded, alpha linear)
VX_TEX_FORMAT_R8        = 9    # single-channel  -> (r,0,0,1)
VX_TEX_FORMAT_RG8       = 10   # two-channel     -> (r,g,0,1)
VX_TEX_FORMAT_R16F      = 11   # half float      -> (r,0,0,1)
VX_TEX_FORMAT_RG16F     = 12   # 2x half float   -> (r,g,0,1)
VX_TEX_FORMAT_RGBA16F   = 13   # 4x half float
VX_TEX_FORMAT_R32F      = 14   # float           -> (r,0,0,1)
VX_TEX_FORMAT_RG32F     = 15   # 2x float        -> (r,g,0,1)
VX_TEX_FORMAT_RGBA32F   = 16   # 4x float
VX_TEX_FORMAT_D16       = 17   # depth-as-texture, 16-bit unorm -> luminance
VX_TEX_FORMAT_D32F      = 18   # depth-as-texture, float        -> luminance


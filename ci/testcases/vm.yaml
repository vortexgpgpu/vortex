# Test cases for `vm`, drafted from regression.sh.in (review/collapse).
category: vm
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
  configs: -DVX_CFG_VM_ENABLE
tests:
- id: isa-1
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/sgemm
  target: run-{driver}
- id: isa-2
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/diverge
  target: run-{driver}
- id: isa-3
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/dogfood
  target: run-{driver}
- id: isa-4
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/raycast
  target: run-{driver}
- id: isa-5
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/graphics/gfx_draw3d
  target: run-{driver}
- id: isa-6
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/sgemm
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: isa-7
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/diverge
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: isa-8
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/dogfood
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: isa-9
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/raycast
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: isa-10
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/graphics/gfx_draw3d
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: tlb-stress-l1
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t0 -n16 -p1
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: tlb-stress-l2
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t0 -n16 -p32
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: tlb-stress-walk
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t0 -n16 -p128
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-fence
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t1 -n16 -p1
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-drain
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t2 -n16 -p4
  env:
    VORTEX_RANDOMIZE_VA: 1
# TLB-pressure sweep mixed with a VX_MEM_PHYS identity-mapped buffer: every
# task strides across pages (odd stride) while also reading through the
# pinned slab, so paged and identity translations contend in the same run.
- id: vm-stress
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_stress
  target: run-{driver}
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-amo
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  configs+: -DVX_CFG_EXT_A_ENABLE
  vars:
    OPTS: -t3 -n16 -p2
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-superpage
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t4 -n4 -p1
# A hit through a superpage another warp's walk installed must not overtake
# the warp's own store still parked on the page's walk.
- id: vm-sp-order
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t5 -n16 -p8
# The heap mapped once with superpages (VORTEX_VM_MEGAPAGE_HEAP): every buffer
# translates through the TLBs' megapage path at its identity VA.
- id: vm-megapage-heap
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/sgemm
  target: run-{driver}
  env:
    VORTEX_VM_MEGAPAGE_HEAP: 1
- id: tlb-concurrent
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  configs+: -DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE
  vars:
    OPTS: -t0 -n32 -p8
  env:
    VORTEX_RANDOMIZE_VA: 1
# Atomics under translation across a shared L2 (4x L1 -> 1x L2). AMO resolves at
# the LLC while the walker fills the TLBs through the same hierarchy.
- id: mc-l2-amo
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  configs+: -DVX_CFG_NUM_CORES=4 -DVX_CFG_L2_ENABLE -DVX_CFG_EXT_A_ENABLE
  vars:
    OPTS: -t3 -n16 -p2
  env:
    VORTEX_RANDOMIZE_VA: 1
# VM across a two-level cache hierarchy: both app data and walker PTE fetches
# traverse L1 -> L2 -> L3. Mirrors amo mc-l3's topology.
- id: mc-l3
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  configs+: -DVX_CFG_NUM_CORES=4 -DVX_CFG_L2_ENABLE -DVX_CFG_L3_ENABLE
  vars:
    OPTS: -t0 -n32 -p8
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-fault
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_fault
  target: run-{driver}
  vars:
    OPTS: -t0
# vm-fault-perm (-t1, read-only-store permission fault) needs L1 permission-fault
# reporting, which is not currently implemented; only structural faults (-t0,
# above) are reported, via the shared walker. Re-enable when L1 permission-fault
# reporting is added.

# Two SFU blocks: every warp writes SATP at entry, from either block.
- id: vm-sfu2
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: sgemm
  configs: -DVX_CFG_VM_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_NUM_SFU_BLOCKS=2

# Socket unit MMU: the RTU's BVH fetches and the DXA's global reads translate,
# so a scene or a tile source at a minted VA (!= PA) is read correctly (both
# apps check their results; dxa_copy does not).
- id: vm-rtu
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: rt_smoke
  configs+: -DVX_CFG_EXT_RTU_ENABLE
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-dxa
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: sgemm2_dxa
  configs+: -DVX_CFG_EXT_DXA_ENABLE
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-tex
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: gfx_tex
  configs+: -DVX_CFG_EXT_TEX_ENABLE
  args: -i toad.png -r toad_ref_f0.png -f 0 -g 0
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-raster
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: gfx_raster
  configs+: -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -t triangle.cgltrace -r triangle_ref_128.png
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-om
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: gfx_om
  configs+: -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -d -b -r whitebox_db_128.png
  env:
    VORTEX_RANDOMIZE_VA: 1

# ---------------------------------------------------------------------------
# check: model_parity — same VM-enabled app on both drivers (xlen 32); exact
# instret + cycles within tolerance. SimX is the timing model of the RTL.
# Sized so steady state dominates boot/dispatch skew.
# ---------------------------------------------------------------------------
- id: parity-vm-sgemm
  check: model_parity
  via: blackbox
  app: sgemm
- id: parity-vm-vecadd
  check: model_parity
  via: blackbox
  app: vecadd
  args: -n16384
# A Kepler SMX's core (keplertitan profile): 16 warps behind each of four fetch
# slices and four 8-lane LSU blocks keep the kernel's code and argument pages
# busy on every MMU lane, so once a page fills its accesses must hit the TLB
# rather than queue behind the page's miss-station entry.
- id: parity-vm-vecadd-wide
  check: model_parity
  via: blackbox
  app: vecadd
  args: -n16384
  configs+: >-
    -DVX_CFG_NUM_WARPS=64 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4
    -DVX_CFG_FETCH_WIDTH=4 -DVX_CFG_NUM_ALU_LANES=32 -DVX_CFG_NUM_FPU_LANES=32
    -DVX_CFG_NUM_LSU_LANES=8 -DVX_CFG_L1_LINK_LATENCY=4
- id: parity-vm-rt_raycast
  check: model_parity
  via: blackbox
  app: rt_raycast
  configs+: -DVX_CFG_EXT_RTU_ENABLE -DVX_CFG_EXT_DXA_ENABLE
- id: parity-vm-dxa_copy
  check: model_parity
  via: blackbox
  app: dxa_copy
  configs+: -DVX_CFG_EXT_RTU_ENABLE -DVX_CFG_EXT_DXA_ENABLE
  args: -d3
- id: parity-vm-gfx_tex
  check: model_parity
  via: blackbox
  app: gfx_tex
  configs+: -DVX_CFG_EXT_TEX_ENABLE
  args: -i toad.png -r toad_ref_f0.png -f 0 -g 0
- id: parity-vm-gfx_raster
  check: model_parity
  via: blackbox
  app: gfx_raster
  configs+: -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -t triangle.cgltrace -r triangle_ref_128.png
- id: parity-vm-gfx_om
  check: model_parity
  via: blackbox
  app: gfx_om
  configs+: -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -d -b -r whitebox_db_128.png
# The RTL command processor's DMA walks the page table for every upload and
# download; only xrt runs it (simx and rtlsim use the C++ command processor).
- id: cp-dma-walk
  via: blackbox
  drivers:
  - xrt
  app: vm_test
  args: -t1 -n16 -p1
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: cp-dma-walk-megapage
  via: blackbox
  drivers:
  - xrt
  app: sgemm
  args: -n16
  env:
    VORTEX_VM_MEGAPAGE_HEAP: 1

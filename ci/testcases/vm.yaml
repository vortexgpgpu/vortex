# Test cases for `vm`, drafted from regression.sh.in (review/collapse).
category: vm
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
  configs: -DVX_CFG_VM_ENABLE
tests:
- id: isa-1
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/sgemm
  target: run-{driver}
- id: isa-2
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/diverge
  target: run-{driver}
- id: isa-3
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/dogfood
  target: run-{driver}
- id: isa-4
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/raycast
  target: run-{driver}
- id: isa-5
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/graphics/gfx_draw3d
  target: run-{driver}
- id: isa-6
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/sgemm
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: isa-7
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/diverge
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: isa-8
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/dogfood
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: isa-9
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/raycast
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: isa-10
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/graphics/gfx_draw3d
  target: run-{driver}
  configs+: -DVX_CFG_VM_ADDR_MODE=BARE
- id: tlb-stress-l1
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t0 -n16 -p1
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: tlb-stress-l2
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t0 -n16 -p32
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: tlb-stress-walk
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t0 -n16 -p128
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-fence
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t1 -n16 -p1
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-drain
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t2 -n16 -p4
  env:
    VORTEX_RANDOMIZE_VA: 1
# TLB-pressure sweep mixed with a VX_MEM_PHYS identity-mapped buffer: every
# task strides across pages (odd stride) while also reading through the
# pinned slab, so paged and identity translations contend in the same run.
- id: vm-stress
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_stress
  target: run-{driver}
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-amo
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  configs+: -DVX_CFG_EXT_A_ENABLE
  vars:
    OPTS: -t3 -n16 -p2
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-superpage
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  vars:
    OPTS: -t4 -n4 -p1
- id: tlb-concurrent
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  configs+: -DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE
  vars:
    OPTS: -t0 -n32 -p8
  env:
    VORTEX_RANDOMIZE_VA: 1
# Atomics under translation across a shared L2 (4x L1 -> 1x L2). AMO resolves at
# the LLC while the walker fills the TLBs through the same hierarchy.
- id: mc-l2-amo
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  configs+: -DVX_CFG_NUM_CORES=4 -DVX_CFG_L2_ENABLE -DVX_CFG_EXT_A_ENABLE
  vars:
    OPTS: -t3 -n16 -p2
  env:
    VORTEX_RANDOMIZE_VA: 1
# VM across a two-level cache hierarchy: both app data and walker PTE fetches
# traverse L1 -> L2 -> L3. Mirrors amo mc-l3's topology.
- id: mc-l3
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_test
  target: run-{driver}
  configs+: -DVX_CFG_NUM_CORES=4 -DVX_CFG_L2_ENABLE -DVX_CFG_L3_ENABLE
  vars:
    OPTS: -t0 -n32 -p8
  env:
    VORTEX_RANDOMIZE_VA: 1
- id: vm-fault
  via: make-run
  drivers:
  - simx
  - rtlsim
  dir: tests/regression/vm_fault
  target: run-{driver}
  vars:
    OPTS: -t0
# vm-fault-perm (-t1, read-only-store permission fault) needs L1 permission-fault
# reporting, which is not currently implemented; only structural faults (-t0,
# above) are reported, via the shared walker. Re-enable when L1 permission-fault
# reporting is added.

# ---------------------------------------------------------------------------
# check: model_parity — same VM-enabled app on both drivers (xlen 32); exact
# instret + cycles within tolerance. SimX is the timing model of the RTL.
# Sized so steady state dominates boot/dispatch skew.
# ---------------------------------------------------------------------------
- id: parity-vm-sgemm
  check: model_parity
  via: blackbox
  app: sgemm
- id: parity-vm-vecadd
  check: model_parity
  via: blackbox
  app: vecadd
  args: -n16384

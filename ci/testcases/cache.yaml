# Non-power-of-two cache sharing: 3 cores over 2 shared icaches exercises the
# SimX arbiter's ceiling-division input grouping. A floor-grouped arbiter
# (inputs/outputs) never polls the trailing core's fetch port and the run
# hangs at boot; VX_stream_arb sizes its groups by ceiling division, so the
# SimX model must match.
- id: demo-shared-icache-odd
  via: blackbox
  drivers:
  - simx
  app: demo
  configs: -DVX_CFG_SOCKET_SIZE=3 -DVX_CFG_NUM_ICACHES=2
  shape:
    cores: 3
# Hashed bank select, on by default for the dcache and the L2. These cover the
# hash off at both levels, 16 threads, and a write-back L2, where every fill and
# write-back rebuilds the address.
- id: bank_hash-1
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: sgemm
  configs: -DVX_CFG_SOCKET_SIZE=1 -DVX_CFG_DCACHE_BANK_HASH=0 -DVX_CFG_L2_BANK_HASH=0
  shape:
    cores: 2
    l2cache: true
- id: bank_hash-2
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: sgemm
  shape:
    threads: 16
- id: bank_hash-3
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: mstress
  configs: -DVX_CFG_SOCKET_SIZE=1 -DVX_CFG_L2_WRITEBACK=1
  shape:
    cores: 4
    l2cache: true
- id: bank_hash-4
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: mstress
  configs: -DVX_CFG_DCACHE_WRITEBACK=1 -DVX_CFG_DCACHE_DIRTYBYTES=1
  shape:
    threads: 16
# Lazy fetch-on-read on a write-back LLC: a store miss allocates its line
# without a fill, and a load or AMO of a partially written line fetches it and
# merges under the dirty bytes. The default 1-core dcache is such an LLC.
- id: lazy_fetch-1
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: lazy_fetch
  configs: -DVX_CFG_EXT_A_ENABLE -DVX_CFG_DCACHE_LAZY_FETCH=1
# The same on a write-back L2 shared by 4 cores behind write-through L1s.
- id: lazy_fetch-2
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: lazy_fetch
  configs: -DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=1 -DVX_CFG_L2_WRITEBACK=1 -DVX_CFG_L2_LAZY_FETCH=1
  shape:
    cores: 4
    l2cache: true
# Both sectors of one sectored L2 line miss together from different warps and
# cores: each must get its own fill, never chain behind the other sector's.
# Run with the address held per request and with the MSHR line table.
- id: sector_merge-1
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: sector_merge
  configs: -DVX_CFG_SOCKET_SIZE=1
  shape:
    cores: 4
    l2cache: true
- id: sector_merge-2
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: sector_merge
  configs: -DVX_CFG_SOCKET_SIZE=1 -DVX_CFG_DCACHE_MSHR_SIZE=32 -DVX_CFG_DCACHE_MSHR_LINES=8 -DVX_CFG_L2_MSHR_SIZE=32 -DVX_CFG_L2_MSHR_LINES=8
  shape:
    cores: 4
    l2cache: true

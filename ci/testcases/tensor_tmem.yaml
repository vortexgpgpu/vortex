 # Test cases for `tensor_tmem` (UMMA/TMEM).
category: tensor_tmem
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
  touches: [hw/rtl/tcu, sim/simx/tcu, sw/kernel/include/vx_tensor.h]
tests:
- id: sgemm_tcu_tmem-1
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-2
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-3
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-4
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-5
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_INT8_ENABLE -DITYPE=uint8 -DOTYPE=int32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-6
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_TF32_ENABLE -DITYPE=tf32 -DOTYPE=fp32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-7
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=bf16 -DOTYPE=fp32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-8
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DITYPE=fp8 -DOTYPE=fp32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-9
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DITYPE=bf8 -DOTYPE=fp32 -DUMMA_NRC=8

- id: sgemm_tcu_tmem-10
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=16 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=64

- id: sgemm_tcu_tmem-11
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=16 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DUMMA_NRC=64

- id: sgemm_tcu_tmem-12
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=16 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=64

# SimX<->rtlsim cycle parity on the UMMA int8 datapath.
- id: model_parity-umma-int8
  check: model_parity
  via: blackbox
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DUMMA_NRC=32

# SimX<->rtlsim cycle parity on the UMMA fp16 datapath.
- id: model_parity-umma-fp16
  check: model_parity
  via: blackbox
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=32

# Same, with A sourced from TMEM: covers the abuf TMEM refill and its bank arbitration.
- id: model_parity-umma-fp16-ts
  check: model_parity
  via: blackbox
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=32 -DUMMA_A_TMEM

# SimX<->rtlsim cycle parity with concurrent CTAs: two resident at NW=8, four at
# NW=16. Covers the CTA lockstep wait and cross-CTA TMEM bank contention.
- id: model_parity-umma-2cta
  check: model_parity
  via: blackbox
  app: sgemm_tcu_tmem
  args: -m64 -n64 -k64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=32

- id: model_parity-umma-4cta
  check: model_parity
  via: blackbox
  app: sgemm_tcu_tmem
  args: -m64 -n64 -k64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=16 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=32

# FEDP2K doubles FEDP_K, so an A k-stripe spans two TMEM bank words.
- id: sgemm_tcu_tmem-15
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_FEDP2K -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=32

- id: sgemm_tcu_tmem-16
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_FEDP2K -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=32

# A from TMEM (UMMA TS form): abuf refills from TMEM instead of LMEM.
- id: sgemm_tcu_tmem-17
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_tmem
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_TMEM_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DUMMA_NRC=32 -DUMMA_A_TMEM


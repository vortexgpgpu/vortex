# Test cases for `vulkan`, drafted from regression.sh.in (review/collapse).
category: vulkan
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
tests:
- id: isa-1
  via: make-run
  drivers:
  - simx
  dir: tests/vulkan
  target: run-{driver}
- id: isa-4
  via: make-run
  drivers:
  - xrt
  dir: tests/vulkan
  target: run-{driver}

# ── Explicit scenario coverage ───────────────────────────────────────────────
# isa-* above run the whole tests/vulkan suite per driver; the cases below track
# specific scenarios individually and add FF/SW-mix combos the suite does not
# build. vortexpipe routes any disabled fixed-function unit (NO_TEX / NO_RASTER /
# NO_OM) to SIMT software via the gfx_*_sw ABI, so any FF/SW mix runs against the
# same golden as the all-hardware path.

# Ray-tracing benchmark — VK_KHR_ray_query shaded render on the PRISM RTU.
- {id: rt-raytrace, via: make-run, drivers: [simx, rtlsim], dir: tests/vulkan/raytrace, target: "run-{driver}",
   touches: [hw/rtl/rtu/, sim/simx/rtu/, tests/vulkan/raytrace]}
- {id: rt-rtquery, via: make-run, drivers: [simx], dir: tests/vulkan/rtquery, target: "run-{driver}",
   touches: [hw/rtl/rtu/, sim/simx/rtu/]}
# The same query on a 32x32 core, where the acceleration structure is built by
# lavapipe's compute kernels on the device rather than on llvmpipe.
- {id: rt-rtquery-wide, via: make-run, drivers: [simx], dir: tests/vulkan/rtquery, target: "run-{driver}",
   vars: {WIDE: 1}, touches: [hw/rtl/rtu/, sim/simx/rtu/]}

# Every ray-query value against the host's own traversal: committed and
# candidate records, confirm / ignore / terminate, generated procedural hits,
# ray flags and cull masks, a query array, a query abandoned and re-traced, and
# a null acceleration structure. 32x32 so the acceleration-structure builds run
# on the device too.
- {id: rt-rtquery-full, via: make-run, drivers: [simx], dir: tests/vulkan/rtquery_full, target: "run-{driver}",
   touches: [hw/rtl/rtu/, sim/simx/rtu/, tests/vulkan/rtquery_full]}
# vkCmdTraceRaysKHR with every shader stage: any-hit, intersection, both miss
# shaders, callables, a closest-hit that traces again, and SBT record offsets
# and data, each launch cell checked against the host's traversal.
- {id: rt-rtpipe, via: make-run, drivers: [simx], dir: tests/vulkan/rtpipe, target: "run-{driver}",
   touches: [hw/rtl/rtu/, sim/simx/rtu/, tests/vulkan/rtpipe]}
# Both again on the RTL RTU: an 8-warp core runs the query dispatch and the
# trace-rays launch on the device (EXPECT_ATTRIB pins that one device launch),
# while the acceleration-structure builds -- 1024-wide workgroups -- fall back
# to llvmpipe. Every case traces one ray per invocation at a time.
- {id: rt-rtquery-full-rtl, via: make-run, drivers: [rtlsim], dir: tests/vulkan/rtquery_full,
   target: "run-{driver}", configs: "-DVX_CFG_NUM_WARPS=8",
   vars: {WIDE: 0, STRICT: 0, EXPECT_ATTRIB: launches=1/30_draws=0/0},
   touches: [hw/rtl/rtu/, tests/vulkan/rtquery_full]}
- {id: rt-rtpipe-rtl, via: make-run, drivers: [rtlsim], dir: tests/vulkan/rtpipe,
   target: "run-{driver}", configs: "-DVX_CFG_NUM_WARPS=8",
   vars: {WIDE: 0, STRICT: 0, EXPECT_ATTRIB: launches=1/29_draws=0/0},
   touches: [hw/rtl/rtu/, tests/vulkan/rtpipe]}
# Shapes the RTU does not run, on vortexpipe's llvmpipe fallback with exact
# results and the refusal reason pinned: two queries proceeded in turn, and a
# query held open across a workgroup barrier of two warps.
- {id: rt-rtqinterleave, via: make-run, drivers: [simx], dir: tests/vulkan/rtqinterleave,
   target: "run-{driver}", touches: [tests/vulkan/rtquery_full]}
- {id: rt-rtqbarrier, via: make-run, drivers: [simx], dir: tests/vulkan/rtqbarrier,
   target: "run-{driver}", touches: [tests/vulkan/rtquery_full]}
# The query, the ray-tracing pipeline and a fragment-stage query handed to
# llvmpipe on purpose: the software forms lavapipe supplies must give the
# device's results.
- {id: rt-rtquery-full-cpu, via: make-run, drivers: [simx], dir: tests/vulkan/rtquery_full_cpu,
   target: "run-{driver}", touches: [tests/vulkan/rtquery_full]}
- {id: rt-rtpipe-cpu, via: make-run, drivers: [simx], dir: tests/vulkan/rtpipe_cpu,
   target: "run-{driver}", touches: [tests/vulkan/rtpipe]}
- {id: rt-rtqdraw-cpu, via: make-run, drivers: [simx], dir: tests/vulkan/rtqdraw_cpu,
   target: "run-{driver}", touches: [tests/vulkan/rtqdraw]}

# Vulkan memory-model message passing on the CTS runtime shape (four 32x32
# cores, L2): device-scope release/acquire through a storage image and a
# buffer, whose partners sit on other cores, and subgroup-scope passing
# through shared memory with a subgroup that returns before the barrier.
- {id: mm-msgpass, via: make-run, drivers: [simx], dir: tests/vulkan/msgpass, target: "run-{driver}", xlen: [32],
   touches: [hw/rtl/cache/, hw/rtl/core/VX_lsu_slice.sv, sim/simx/mem/, sim/simx/lsu_unit.cpp, tests/vulkan/msgpass]}

# Rasterized 3D with multiple draw calls into one attachment.
- {id: gfx-multidraw, via: make-run, drivers: [simx, rtlsim], dir: tests/vulkan/multidraw, target: "run-{driver}",
   touches: [hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/]}

# Draws over the RASTER pass limit (GFX_RASTER_MAX_PRIMS): the driver splits
# them into passes. An instanced triangle draw whose every pixel names the
# triangle that covered it, and stippled line strips whose counter carries
# across, and restarts at, the pass boundary. Full tier, 32-bit only, outside
# the suite list: the front end sets up ~100k primitives, ~18 min on a loaded
# SimX host.
- {id: gfx-manyprims, via: make-run, drivers: [simx], dir: tests/vulkan/manyprims, target: "run-{driver}", tier: full, xlen: [32],
   touches: [sw/common/vx_gfx_abi.h, sw/common/gfx_frontend_abi.h, sw/gfx/, hw/rtl/raster/, sim/simx/raster/, tests/vulkan/manyprims]}

# Hybrid gfx + RT — a rasterized fragment shader issuing inline ray queries
# (RASTER/OM raster pipeline + RTU traversal in the same frame).
- {id: gfx-rt-rtquery-id, via: make-run, drivers: [simx], dir: tests/vulkan/rtquery_id, target: "run-{driver}",
   touches: [hw/rtl/rtu/, hw/rtl/raster/, hw/rtl/om/]}

# 4x multisample, read back per sample through a sampler2DMS: coverage controls
# (alpha-to-coverage, sample masks, alpha-to-one), shading rate (sample id and
# position, minSampleShading, centroid), per-sample depth across two colour
# attachments, colour resolves (render pass and vkCmdResolveImage), depth/stencil
# resolves, and interpolateAt* with the sample mask in.
- {id: gfx-msaa-cov, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_cov, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_cov]}
- {id: gfx-msaa-rate, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_rate, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_rate]}
- {id: gfx-msaa-mrt, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_mrt, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_mrt]}
- {id: gfx-msaa-resolve, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_resolve, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_resolve]}
- {id: gfx-msaa-dsresolve, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_dsresolve, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_dsresolve]}
- {id: gfx-msaa-interp, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_interp, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_interp]}

# Device-counted queries over draws that stay on the device: pipeline statistics
# (input assembly, vertex, clipping, fragment, compute), VK_EXT_primitives_generated_query,
# occlusion on the fixed-function OM counter and on the software merger, and
# conditional rendering on a predicate copied from an occlusion query.
- {id: gfx-query-stats, via: make-run, drivers: [simx], dir: tests/vulkan/gfxstats, target: "run-{driver}",
   touches: [sw/common/gfx_fs_desc_abi.h, sw/gfx/, hw/rtl/raster/, sim/simx/raster/, tests/vulkan/gfxstats]}
- {id: gfx-query-primgen, via: make-run, drivers: [simx], dir: tests/vulkan/primgen, target: "run-{driver}",
   touches: [sw/common/gfx_fs_desc_abi.h, sw/gfx/, hw/rtl/raster/, sim/simx/raster/, tests/vulkan/primgen]}
- {id: gfx-query-occlusion, via: make-run, drivers: [simx], dir: tests/vulkan/occlusion, target: "run-{driver}",
   touches: [sw/common/gfx_fs_desc_abi.h, sw/common/gfx_sw.h, sw/gfx/, hw/rtl/om/, hw/rtl/VX_graphics.sv, sim/simx/om/, sim/simx/cluster.cpp, tests/vulkan/occlusion]}
- {id: gfx-query-condrender, via: make-run, drivers: [simx], dir: tests/vulkan/condrender, target: "run-{driver}",
   touches: [sw/common/gfx_fs_desc_abi.h, sw/gfx/, hw/rtl/om/, sim/simx/om/, tests/vulkan/condrender]}

# Indirect dispatch with shader-written workgroup counts (zero counts, an offset
# record, a large grid) and dispatches under conditional rendering: the command
# processor reads the counts and the predicate, so simx runs its C++ model and
# xrt the RTL command processor.
- {id: cp-dispatchindirect, via: make-run, drivers: [simx, xrt], dir: tests/vulkan/dispatchindirect, target: "run-{driver}",
   touches: [sim/common/cmd_processor, hw/rtl/cp/, sw/runtime/, sw/common/cp_launch_abi.h, tests/vulkan/dispatchindirect]}

# Input assembly on the device: index buffers of every width read in place,
# strips, fans and lists cut by primitive restart (ia_k), instancing, both
# provoking-vertex modes, each image-exact against the same primitives drawn as
# a plain list; and the statistics a restart draw counts on the device.
- {id: gfx-iaasm, via: make-run, drivers: [simx], dir: tests/vulkan/iaasm, target: "run-{driver}",
   touches: [sw/common/gfx_frontend_abi.h, sw/gfx/, tests/vulkan/iaasm]}
# Draws whose restarts leave no primitive: the command processor skips each one
# past its restart scan, bounded by the run's retired instructions.
- {id: gfx-iacut, via: make-run, drivers: [simx], dir: tests/vulkan/iacut, target: "run-{driver}",
   touches: [sw/common/gfx_frontend_abi.h, sw/gfx/, sim/common/cmd_processor, tests/vulkan/iaasm, tests/vulkan/iacut]}

# Transform feedback from the vertex stage: byte-exact capture over every
# topology and provoking-vertex mode, overflow, pause/resume through counter
# buffers, capture under rasterizer discard, and the stream query.
- {id: gfx-xfb, via: make-run, drivers: [simx], dir: tests/vulkan/xfb, target: "run-{driver}",
   touches: [sw/common/gfx_fs_desc_abi.h, sw/gfx/, tests/vulkan/xfb]}
# Mirror mode (NO_IMPORT=1): simx and rtlsim import every allocation, so only
# these runs reach the driver's resident planes and mirrored ranges -- per-view
# plane bases of a multiview pass, a capture brought home after its draw, and
# depth/stencil formats loaded into and stored back from planes.
- {id: gfx-multiview-mirror, via: make-run, drivers: [simx], dir: tests/vulkan/multiview, target: "run-{driver}",
   vars: {NO_IMPORT: 1}, touches: [tests/vulkan/multiview]}
- {id: gfx-xfb-mirror, via: make-run, drivers: [simx], dir: tests/vulkan/xfb, target: "run-{driver}",
   vars: {NO_IMPORT: 1}, touches: [sw/common/gfx_fs_desc_abi.h, sw/gfx/, tests/vulkan/xfb]}
- {id: gfx-rtinplace-mirror, via: make-run, drivers: [simx], dir: tests/vulkan/rtinplace, target: "run-{driver}",
   vars: {NO_IMPORT: 1}, touches: [hw/rtl/om/, sim/simx/om/, tests/vulkan/rtinplace]}
- {id: gfx-varypack, via: make-run, drivers: [simx], dir: tests/vulkan/varypack, target: "run-{driver}",
   touches: [sw/gfx/, hw/rtl/raster/, sim/simx/raster/, tests/vulkan/varypack]}

# Geometry shaders on the device: pass-through, strips split with their odd
# triangles wound back, expansion, point size, polygon mode, counts known only
# at run time ordered by the device-wide scan (from a vertex, a push constant
# and a texture, side effects counted exactly), GS instancing, adjacency in
# every topology with and without a geometry shader, and gl_PrimitiveID.
- {id: gfx-geometry, via: make-run, drivers: [simx], dir: tests/vulkan/geometry, target: "run-{driver}",
   touches: [sw/common/gfx_frontend_abi.h, sw/gfx/, tests/vulkan/geometry]}
# Tessellation: control and evaluation shaders around the SIMT tessellator,
# every domain, spacing and winding, point mode, levels known on the host or
# only on the device (ordered by the device-wide scan), discarded patches, the
# control stage's barrier, primitive order under blending and gl_PrimitiveID,
# indexed patch lists and ones cut by a restart index, each compared pixel for
# pixel with the host's tessellation drawn as a list.
- {id: gfx-tess, via: make-run, drivers: [simx], dir: tests/vulkan/tess, target: "run-{driver}",
   touches: [sw/common/gfx_tess.h, sw/gfx/gfx_tess_k.h, sw/gfx/gfx_tess_abi.cpp, sw/gfx/,
             tests/vulkan/tess]}
# 956 patches at level 64 through the widest evaluation records: more than a
# 32-bit device allocates at once, so batches run in ranges of their patches.
# Full tier, 32-bit only: 4M evaluation threads on four functional cores.
- {id: gfx-tess-max, via: make-run, drivers: [simx], dir: tests/vulkan/tess, target: "run-{driver}",
   tier: full, xlen: [32], vars: {OPTS: "-c levels_max", EXPECT_LINES: ""},
   touches: [sw/common/gfx_tess.h, sw/gfx/gfx_tess_k.h, sw/gfx/gfx_tess_abi.cpp,
             tests/vulkan/tess]}
# A capture across tessellated draws on the device, on llvmpipe and on the
# device again, as one stream.
- {id: gfx-tess-handoff, via: make-run, drivers: [simx], dir: tests/vulkan/tess, target: "run-{driver}",
   vars: {STRICT: 0, OPTS: "-c handoff", EXPECT_CPU: "transform-feedback=1", EXPECT_LINES: ""},
   touches: [sw/gfx/, tests/vulkan/tess]}
# Transform feedback, vertex streams and queries from a geometry shader.
- {id: gfx-gsxfb, via: make-run, drivers: [simx], dir: tests/vulkan/gsxfb, target: "run-{driver}",
   touches: [sw/common/gfx_frontend_abi.h, sw/common/gfx_fs_desc_abi.h, sw/gfx/, tests/vulkan/gsxfb]}
# Draws past one rasterizer pass's primitives (GFX_RASTER_MAX_PRIMS) from a
# geometry stage, with static and with dynamic counts, split into front-end
# passes. Full tier, 32-bit only, outside the suite list: the stages run
# ~210,000 vertices.
- {id: gfx-bigdraw, via: make-run, drivers: [simx], dir: tests/vulkan/bigdraw, target: "run-{driver}", tier: full, xlen: [32],
   touches: [sw/common/gfx_frontend_abi.h, sw/gfx/, hw/rtl/raster/, sim/simx/raster/, tests/vulkan/bigdraw]}

# Viewport arrays: per-primitive viewport and scissor selection through
# gl_ViewportIndex on the fixed-function and the software rasterizer (4x),
# gl_Layer into a layered target, and both read back in the fragment shader.
- {id: gfx-multiviewport, via: make-run, drivers: [simx, rtlsim], dir: tests/vulkan/multiviewport, target: "run-{driver}",
   touches: [sw/common/gfx_setup.h, sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, sim/simx/raster/, tests/vulkan/multiviewport]}

# fp64 (the toolchain's soft-float library on rv32, D on rv64) in compute and in
# the vertex and fragment stages joined by flat double varyings, and float
# atomics built from integer AMOs and amocas. On a device without Zacas the
# float add and min/max are not offered and atomic_float reports NotSupported.
- {id: shader-fp64, via: make-run, drivers: [simx], dir: tests/vulkan/fp64, target: "run-{driver}",
   touches: [tests/vulkan/fp64]}
- {id: shader-atomic-float, via: make-run, drivers: [simx], dir: tests/vulkan/atomic_float, target: "run-{driver}",
   touches: [sim/simx/mem/, sim/simx/amo/, tests/vulkan/atomic_float]}
# 64-bit integer atomics: the .D atomics on register pairs (AMO64), on a buffer,
# shared memory and a device address.
- {id: shader-atomic64, via: make-run, drivers: [simx, rtlsim], dir: tests/vulkan/atomic64, target: "run-{driver}",
   touches: [sim/simx/lsu_unit.cpp, sim/simx/mem/, sim/simx/amo/, hw/rtl/core/VX_lsu_slice.sv, hw/rtl/core/VX_uop_packld.sv, hw/rtl/mem/VX_local_mem.sv, hw/rtl/cache/VX_cache_amo.sv, tests/vulkan/atomic64]}
# 64-bit atomic loads and stores (OpAtomicLoad/OpAtomicStore) are indivisible:
# on a 32-bit device the driver runs them as register-pair atomics.
- {id: shader-atomic64-tear, via: make-run, drivers: [simx, rtlsim], dir: tests/vulkan/atomic64_tear, target: "run-{driver}",
   touches: [sim/simx/lsu_unit.cpp, sim/simx/mem/, hw/rtl/core/VX_lsu_slice.sv, hw/rtl/mem/VX_local_mem.sv, tests/vulkan/atomic64_tear]}
# The same at 32 warps x 32 threads (WIDE=1), where concurrent stores to one
# word race often enough to expose a store done as two word writes; imported
# and mirrored (NO_IMPORT=1) buffers.
- {id: shader-atomic64-tear-wide, via: make-run, drivers: [simx], dir: tests/vulkan/atomic64_tear, target: "run-{driver}",
   vars: {WIDE: 1}, touches: [tests/vulkan/atomic64_tear]}
- {id: shader-atomic64-tear-wide-mirror, via: make-run, drivers: [simx], dir: tests/vulkan/atomic64_tear, target: "run-{driver}",
   vars: {WIDE: 1, NO_IMPORT: 1}, touches: [tests/vulkan/atomic64_tear]}

# sparseImageLoadARB on ordinary storage images (2D, 2D array, cube, 3D, a packed
# RGBA8 view and a format-less read): the seeded texel and a resident code; and
# load/store through a layer view of a sparse array the device addresses.
- {id: shader-imgsparse, via: make-run, drivers: [simx], dir: tests/vulkan/imgsparse, target: "run-{driver}",
   touches: [tests/vulkan/imgsparse]}
# A sparse image two tiles wide: a dispatch and a rasterizer-discard draw that
# store into it both run on the device, addressing it through its tiles.
- {id: shader-sparsefb, via: make-run, drivers: [simx], dir: tests/vulkan/sparsefb, target: "run-{driver}",
   touches: [tests/vulkan/sparsefb, tests/vulkan/common.mk]}
# Partially resident sparse images and buffers, several 64 KiB tiles wide, in
# their own tiles: storage access and sparse loads (sparse_image), transfers
# (sparse_xfer), sampling with residency codes (sparse_tex), render targets on
# both mergers (sparse_rt), buffers (sparse_buffer) and float atomics
# (sparse_atomic), with rebinds the next operation must see; views of slices of a
# 3D image starting inside its tiles (sparse_layers3d).
- {id: shader-sparse-image, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_image, target: "run-{driver}",
   touches: [sw/common/gfx_sparse.h, tests/vulkan/sparse_image]}
- {id: shader-sparse-xfer, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_xfer, target: "run-{driver}",
   touches: [sw/common/gfx_sparse.h, sw/gfx/, tests/vulkan/sparse_xfer]}
- {id: shader-sparse-tex, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_tex, target: "run-{driver}",
   touches: [sw/common/gfx_sparse.h, sw/common/gfx_sw.h, sw/common/gfx_frag_tex.h, tests/vulkan/sparse_tex]}
- {id: shader-sparse-rt, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_rt, target: "run-{driver}",
   touches: [sw/common/gfx_sparse.h, sw/common/gfx_sw.h, tests/vulkan/sparse_rt]}
- {id: shader-sparse-buffer, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_buffer, target: "run-{driver}",
   touches: [tests/vulkan/sparse_buffer]}
- {id: shader-sparse-atomic, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_atomic, target: "run-{driver}",
   touches: [sim/simx/amo/, tests/vulkan/sparse_atomic]}
- {id: shader-sparse-layers3d, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_layers3d, target: "run-{driver}",
   touches: [tests/vulkan/sparse_layers3d]}
# The same storage, transfer, buffer and atomic sparse tests on a device with an
# MMU: each sparse resource is the device's own reservation (VX_MEM_SPARSE),
# its bound tiles mapped onto the allocations behind them, so unbound tiles
# read 0 and drop writes in hardware.
- {id: shader-sparse-vm-image, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_image, target: "run-{driver}",
   configs+: "-DVX_CFG_VM_ENABLE", touches: [hw/rtl/vm, sim/simx/mem, sw/runtime/common/vm.cpp, tests/vulkan/sparse_image]}
- {id: shader-sparse-vm-xfer, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_xfer, target: "run-{driver}",
   configs+: "-DVX_CFG_VM_ENABLE", touches: [hw/rtl/vm, sim/simx/mem, sim/common/cmd_processor.cpp, tests/vulkan/sparse_xfer]}
- {id: shader-sparse-vm-buffer, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_buffer, target: "run-{driver}",
   configs+: "-DVX_CFG_VM_ENABLE", touches: [hw/rtl/vm, sim/simx/mem, tests/vulkan/sparse_buffer]}
- {id: shader-sparse-vm-atomic, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_atomic, target: "run-{driver}",
   configs+: "-DVX_CFG_VM_ENABLE", touches: [hw/rtl/vm, sim/simx/mem, tests/vulkan/sparse_atomic]}
- {id: shader-sparse-vm-layers3d, via: make-run, drivers: [simx], dir: tests/vulkan/sparse_layers3d, target: "run-{driver}",
   configs+: "-DVX_CFG_VM_ENABLE", touches: [hw/rtl/vm, sim/simx/mem, tests/vulkan/sparse_layers3d]}
# 4:2:2 packed textures through a sampler Y'CbCr conversion: each texel its own
# luma, both the pair's chroma.
- {id: tex-422, via: make-run, drivers: [simx], dir: tests/vulkan/tex_422, target: "run-{driver}",
   touches: [sw/common/gfx_frag_tex.h, tests/vulkan/tex_422]}

# FF/SW-mix matrix — the full 3D pipeline (draw3d) with fixed-function units
# selectively dropped to SIMT software. Combos that need SW-TEX or SW-RASTER
# routing depend on vortexpipe wiring those stages (the gfx_*_sw ABI already
# exists). Kept on simx to bound the mesa build cost.
- {id: ff-raster-tex-om, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}"}
- {id: ff-raster-tex, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_OM: 1}}
- {id: ff-raster-om, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_TEX: 1}}
- {id: ff-tex-om, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_RASTER: 1}}
- {id: ff-tex-only, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_RASTER: 1, NO_OM: 1}}
- {id: ff-raster-only, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_TEX: 1, NO_OM: 1}}
- {id: ff-om-only, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_TEX: 1, NO_RASTER: 1}}

# All fixed-function disabled — the whole 3D pipeline emulated in SIMT software.
- {id: ff-all-sw, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_TEX: 1, NO_RASTER: 1, NO_OM: 1},
   tier: full}

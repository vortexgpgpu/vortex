# Test cases for `vulkan`, drafted from regression.sh.in (review/collapse).
category: vulkan
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
tests:
- id: isa-1
  via: make-run
  drivers:
  - simx
  dir: tests/vulkan
  target: run-{driver}
- id: isa-4
  via: make-run
  drivers:
  - xrt
  dir: tests/vulkan
  target: run-{driver}

# ── Explicit scenario coverage ───────────────────────────────────────────────
# isa-* above run the whole tests/vulkan suite per driver; the cases below track
# specific scenarios individually and add FF/SW-mix combos the suite does not
# build. vortexpipe routes any disabled fixed-function unit (NO_TEX / NO_RASTER /
# NO_OM) to SIMT software via the gfx_*_sw ABI, so any FF/SW mix runs against the
# same golden as the all-hardware path.

# Ray-tracing benchmark — VK_KHR_ray_query shaded render on the PRISM RTU.
- {id: rt-raytrace, via: make-run, drivers: [simx, rtlsim], dir: tests/vulkan/raytrace, target: "run-{driver}",
   touches: [hw/rtl/rtu/, sim/simx/rtu/, tests/vulkan/raytrace]}
- {id: rt-rtquery, via: make-run, drivers: [simx], dir: tests/vulkan/rtquery, target: "run-{driver}",
   touches: [hw/rtl/rtu/, sim/simx/rtu/]}
# The same query on a 32x32 core, where the acceleration structure is built by
# lavapipe's compute kernels on the device rather than on llvmpipe.
- {id: rt-rtquery-wide, via: make-run, drivers: [simx], dir: tests/vulkan/rtquery, target: "run-{driver}",
   vars: {WIDE: 1}, touches: [hw/rtl/rtu/, sim/simx/rtu/]}

# Rasterized 3D with multiple draw calls into one attachment.
- {id: gfx-multidraw, via: make-run, drivers: [simx, rtlsim], dir: tests/vulkan/multidraw, target: "run-{driver}",
   touches: [hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/]}

# Hybrid gfx + RT — a rasterized fragment shader issuing inline ray queries
# (RASTER/OM raster pipeline + RTU traversal in the same frame).
- {id: gfx-rt-rtquery-id, via: make-run, drivers: [simx], dir: tests/vulkan/rtquery_id, target: "run-{driver}",
   touches: [hw/rtl/rtu/, hw/rtl/raster/, hw/rtl/om/]}

# 4x multisample, read back per sample through a sampler2DMS: coverage controls
# (alpha-to-coverage, sample masks, alpha-to-one), shading rate (sample id and
# position, minSampleShading, centroid), per-sample depth across two colour
# attachments, colour resolves (render pass and vkCmdResolveImage), depth/stencil
# resolves, and interpolateAt* with the sample mask in.
- {id: gfx-msaa-cov, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_cov, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_cov]}
- {id: gfx-msaa-rate, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_rate, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_rate]}
- {id: gfx-msaa-mrt, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_mrt, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_mrt]}
- {id: gfx-msaa-resolve, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_resolve, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_resolve]}
- {id: gfx-msaa-dsresolve, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_dsresolve, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_dsresolve]}
- {id: gfx-msaa-interp, via: make-run, drivers: [simx], dir: tests/vulkan/msaa_interp, target: "run-{driver}",
   touches: [sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, hw/rtl/om/, sim/simx/raster/, sim/simx/om/, tests/vulkan/msaa_interp]}

# Device-counted queries over draws that stay on the device: pipeline statistics
# (input assembly, vertex, clipping, fragment, compute), VK_EXT_primitives_generated_query,
# occlusion on the fixed-function OM counter and on the software merger, and
# conditional rendering on a predicate copied from an occlusion query.
- {id: gfx-query-stats, via: make-run, drivers: [simx], dir: tests/vulkan/gfxstats, target: "run-{driver}",
   touches: [sw/common/gfx_fs_desc_abi.h, sw/gfx/, hw/rtl/raster/, sim/simx/raster/, tests/vulkan/gfxstats]}
- {id: gfx-query-primgen, via: make-run, drivers: [simx], dir: tests/vulkan/primgen, target: "run-{driver}",
   touches: [sw/common/gfx_fs_desc_abi.h, sw/gfx/, hw/rtl/raster/, sim/simx/raster/, tests/vulkan/primgen]}
- {id: gfx-query-occlusion, via: make-run, drivers: [simx], dir: tests/vulkan/occlusion, target: "run-{driver}",
   touches: [sw/common/gfx_fs_desc_abi.h, sw/common/gfx_sw.h, sw/gfx/, hw/rtl/om/, hw/rtl/VX_graphics.sv, sim/simx/om/, sim/simx/cluster.cpp, tests/vulkan/occlusion]}
- {id: gfx-query-condrender, via: make-run, drivers: [simx], dir: tests/vulkan/condrender, target: "run-{driver}",
   touches: [sw/common/gfx_fs_desc_abi.h, sw/gfx/, hw/rtl/om/, sim/simx/om/, tests/vulkan/condrender]}

# Viewport arrays: per-primitive viewport and scissor selection through
# gl_ViewportIndex on the fixed-function and the software rasterizer (4x),
# gl_Layer into a layered target, and both read back in the fragment shader.
- {id: gfx-multiviewport, via: make-run, drivers: [simx, rtlsim], dir: tests/vulkan/multiviewport, target: "run-{driver}",
   touches: [sw/common/gfx_setup.h, sw/common/gfx_frag_rast.h, sw/gfx/, hw/rtl/raster/, sim/simx/raster/, tests/vulkan/multiviewport]}

# FF/SW-mix matrix — the full 3D pipeline (draw3d) with fixed-function units
# selectively dropped to SIMT software. Combos that need SW-TEX or SW-RASTER
# routing depend on vortexpipe wiring those stages (the gfx_*_sw ABI already
# exists). Kept on simx to bound the mesa build cost.
- {id: ff-raster-tex-om, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}"}
- {id: ff-raster-tex, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_OM: 1}}
- {id: ff-raster-om, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_TEX: 1}}
- {id: ff-tex-om, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_RASTER: 1}}
- {id: ff-tex-only, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_RASTER: 1, NO_OM: 1}}
- {id: ff-raster-only, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_TEX: 1, NO_OM: 1}}
- {id: ff-om-only, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_TEX: 1, NO_RASTER: 1}}

# All fixed-function disabled — the whole 3D pipeline emulated in SIMT software.
- {id: ff-all-sw, via: make-run, drivers: [simx], dir: tests/vulkan/draw3d, target: "run-{driver}", vars: {NO_TEX: 1, NO_RASTER: 1, NO_OM: 1},
   tier: full}

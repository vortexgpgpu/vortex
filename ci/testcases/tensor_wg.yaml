# Test cases for `tensor_wg`, drafted from regression.sh.in (review/collapse).
category: tensor_wg
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
  touches: [hw/rtl/tcu, sim/simx/tcu, sw/kernel/include/vx_tensor.h]
tests:
- id: sgemm_tcu-1
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DITYPE=fp16 -DOTYPE=fp32
- id: sgemm_tcu-2
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DITYPE=fp16 -DOTYPE=fp32
- id: sgemm_tcu_sp-1
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_sp
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE
- id: sgemm_tcu_sp-2
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu_sp
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE
- id: sgemm_tcu_sp-3
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_sp
  configs: -DVX_CFG_NUM_THREADS=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32
- id: sgemm_tcu_sp-4
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu_sp
  configs: -DVX_CFG_NUM_THREADS=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DVX_CFG_TCU_TYPE_DPI -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32
- id: sgemm_tcu_sp-5
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_sp
  configs: -DVX_CFG_NUM_THREADS=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DITYPE=fp16 -DOTYPE=fp32
- id: sgemm_tcu_sp-6
  via: blackbox

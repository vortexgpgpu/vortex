- id: sgemm_tcu_wg_mx-fedp2k-nvfp4
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_wg_mx
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_MX_ENABLE -DVX_CFG_TCU_FP4_ENABLE -DVX_CFG_TCU_NVFP4_ENABLE -DVX_CFG_TCU_FEDP2K -DITYPE=nvfp4 -DOTYPE=fp32 -DWGMMA_NRC=8 -DWGMMA_RS -DTCU_MX_TLS -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
# SimX<->rtlsim cycle parity on the WGMMA int8 datapath: same config on both
# drivers, cycles must agree within tolerance (see core.yaml).
- id: model_parity-wgmma-int8
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
    -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DWGMMA_NRC=32
# The same at 64x64x64: the four issue slots share the ALU block through a
# long address loop, and each CTA's four warps start every WGMMA together once
# the tile buffers fill, or a late one waits for the other CTA's WGMMA.
- id: model_parity-wgmma-int8-m64
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg
  args: -m64 -n64 -k64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
    -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DWGMMA_NRC=32

# Dense WGMMA fp16 SS datapath, cycles-vs-baseline.
- id: perf_gate-wgmma-fp16-ss
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg
  args: -m 128 -n 128 -k 128
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=32 -DWGMMA_SS -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1

- id: perf_gate-wgmma-fedp2k-rs
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg

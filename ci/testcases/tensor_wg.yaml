# Cooperative sparse WGMMA (default fp16 operands, 2:4 structured sparsity).
  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.
- id: perf_gate-wgmma-sparse
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_sp
  args: -m 128 -n 128 -k 128
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1

  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.
# Tensor memory: the accumulator in TMEM. A producer warp stages the K loop
# for an MMA warp's tc.mma ops.
- id: sgemm_tcu_tmem
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: sgemm_tcu_tmem
  xlen: [32]
  args: -m64 -n64 -k256
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_FEDP2K -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_TYPE_DPI -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
    -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=32 -DPIPE_N=2 -DB_KMAJOR
- id: model_parity-tmem
  check: model_parity
  via: blackbox
  app: sgemm_tcu_tmem
  xlen: [32]
  args: -m64 -n64 -k256
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_FEDP2K -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_TYPE_DPI -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
    -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=32 -DPIPE_N=2 -DB_KMAJOR
# Sparse MMAs: 2:4 compressed A, K-tile metadata read from TMEM.
- id: sgemm_tcu_tmem-sparse
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: sgemm_tcu_tmem
  xlen: [32]
  args: -m64 -n64 -k64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_FEDP2K -DVX_CFG_TCU_TMEM_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DVX_CFG_TCU_TYPE_DPI -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
    -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=32 -DPIPE_N=2 -DB_KMAJOR -DTMEM_SPARSE
- id: model_parity-tmem-sparse

    -DVX_CFG_TCU_FEDP2K -DVX_CFG_TCU_TYPE_DPI -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8 -DWGMMA_RS

# Sparse FULLK RS: compressed A spans rs1/rs2 and the B descriptor rides a
# setup uop, as in dense FEDP2K RS.
- id: model_parity-wgmma-sp-fullk-rs
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg_sp
  args: -m64 -n64 -k64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE

  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
    -DVX_CFG_TCU_FEDP2K -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8 -DWGMMA_RS

- id: model_parity-wgmma-fedp2k-rs
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg
  args: -m64 -n64 -k64
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  # Two frontend slices: covers the frontend crossbar on both models.
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
    -DVX_CFG_TCU_FEDP2K -DVX_CFG_TCU_TYPE_DPI -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8 -DWGMMA_RS -DVX_CFG_FETCH_WIDTH=2

# Cooperative sparse WGMMA (default fp16 operands, 2:4 structured sparsity).
  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.
- id: perf_gate-wgmma-sparse
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_sp
  args: -m 128 -n 128 -k 128
  # One execution block per unit: the four-block model ISSUE_WIDTH=4 implies is
  # several times the size, and a hosted CI runner cannot build it in a job.
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DWGMMA_NRC=32 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1

  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.

# The WGMMA accumulator stored with vx_stm in 8-register chunks
# (VX_CFG_EXT_LDST_MATRIX_ENABLE).
- id: sgemm_tcu_wg-ldm-1
  via: blackbox
  drivers:

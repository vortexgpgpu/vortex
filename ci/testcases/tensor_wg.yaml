# Test cases for `tensor_wg`, drafted from regression.sh.in (review/collapse).
category: tensor_wg
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
  touches: [hw/rtl/tcu, sim/simx/tcu, sw/kernel/include/vx_tensor.h]
# Every case with ISSUE_WIDTH > 1 pins one execution block per unit: the default
# (one block per issue slot) multiplies the model size, and a hosted CI runner
# cannot build it in a job. simx and rtlsim legs carry the same pin so both
# model one machine.
tests:
- id: sgemm_tcu_wg-1
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_wg
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=1 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DWGMMA_NRC=8
- id: sgemm_tcu_wg-2
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_wg
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=16 -DVX_CFG_NUM_ALU_BLOCKS=1 -DVX_CFG_NUM_LSU_BLOCKS=1 -DVX_CFG_NUM_FPU_BLOCKS=1
- id: sgemm_tcu_wg-3
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu_wg
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE

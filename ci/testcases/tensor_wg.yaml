# SimX<->rtlsim cycle parity on the WGMMA int8 datapath: same config on both
# drivers, cycles must agree within tolerance (see core.yaml).
- id: model_parity-wgmma-int8
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DWGMMA_NRC=32

# Dense WGMMA fp16 SS datapath, cycles-vs-baseline.
- id: perf_gate-wgmma-fp16-ss
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg
  args: -m 64 -n 64 -k 64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=32 -DWGMMA_SS

- id: perf_gate-wgmma-fedp2k-rs
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg
  args: -m64 -n64 -k64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_FEDP2K -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8 -DWGMMA_RS

- id: model_parity-wgmma-fedp2k-rs
  check: model_parity
  known_issue: "cycle-parity gap ~8%: SimX WGMMA setup/tile-buffer timing is optimistic (instrs match)"
  via: blackbox
  app: sgemm_tcu_wg
  args: -m64 -n64 -k64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_FEDP2K -DVX_CFG_TCU_TYPE_DPI -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8 -DWGMMA_RS

# Cooperative sparse WGMMA (default fp16 operands, 2:4 structured sparsity).
  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.
- id: perf_gate-wgmma-sparse
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_sp
  args: -m 128 -n 128 -k 128
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DWGMMA_NRC=32

  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.
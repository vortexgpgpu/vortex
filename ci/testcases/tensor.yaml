  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_FEDP2K -DITYPE=fp16 -DOTYPE=fp32

# SimX<->rtlsim cycle parity on the native (non-DPI) fp16 TCU datapath: same
# config on both drivers, cycles must agree within tolerance (see core.yaml).
- id: model_parity-fp16
  check: model_parity
  # Execution passes and retired instructions match exactly; only cycles
  # diverge (~6%, just over the 5% gate). SimX does not model the decoupled LSU
  # pending pool that feeds the TCU operand loads. Parity divergence only;
  # pending SimX LSU timing alignment.
  known_issue: "cycle-parity gap ~6%: SimX does not model the decoupled LSU pending pool (instrs match)"
  via: blackbox
  app: sgemm_tcu
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DITYPE=fp16 -DOTYPE=fp32

# Perf-regression twin of the model_parity-fp16 benchmark (same run, cycles-vs-baseline).
- id: perf_gate-fp16
  check: perf_gate
  via: blackbox
  app: sgemm_tcu
  args: -m 128 -n 128 -k 128
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DITYPE=fp16 -DOTYPE=fp32

# TCU fp16 wide-issue: NT=NW=8, ISSUE_WIDTH=4 (4 TCU blocks). Locks in the
# wide-issue tensor datapath perf against the same 128^3 SGEMM.
- id: perf_gate-fp16-isw4
  check: perf_gate
  via: blackbox
  app: sgemm_tcu
  args: -m 128 -n 128 -k 128
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DITYPE=fp16 -DOTYPE=fp32

# TCU fp16 multi-core: NT=NW=8 across 2 cores (shared L2).
  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.
- id: model_parity-fp16-mc
  check: model_parity
  via: blackbox
  app: sgemm_tcu
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_EXT_TCU_ENABLE -DITYPE=fp16 -DOTYPE=fp32
  shape: {cores: 2, l2cache: true}

# TCU fp16 multi-core: NT=NW=8 across 2 cores (shared L2).
- id: perf_gate-fp16-mc
  check: perf_gate
  via: blackbox
  app: sgemm_tcu
  args: -m 128 -n 128 -k 128
  configs: -DVX_CFG_NUM_WARPS=8 -DVX_CFG_EXT_TCU_ENABLE -DITYPE=fp16 -DOTYPE=fp32
  shape: {cores: 2, l2cache: true, threads: [4, 16]}
# Shared-memory staged TCU SGEMM (sgemm2 kernel: CTA tiling + local-mem operand
# reuse). K stays at 64: the test's double-accumulated CPU reference vs the
# TCU's sequential fp32 accumulation exceeds the 10-ULP gate at K=128. Parity
# twin of the perf_gate-sgemm2-fp16 benchmark (same run, cycles-vs-baseline).
- id: model_parity-sgemm2-fp16
  check: model_parity
  via: blackbox
  app: sgemm2_tcu
  args: -m 128 -n 128 -k 64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DITYPE=fp16 -DOTYPE=fp32
- id: perf_gate-sgemm2-fp16
  check: perf_gate
  via: blackbox
  app: sgemm2_tcu
  args: -m 128 -n 128 -k 64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DITYPE=fp16 -DOTYPE=fp32

  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.
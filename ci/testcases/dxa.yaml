# SimX<->rtlsim cycle parity on the DXA engine: same config on both drivers,
# cycles must agree within tolerance (see core.yaml).
- id: model_parity-copy
  check: model_parity
  # Retired instructions match exactly and the cycle gap is now within tolerance
  # (~4.8%): the SimX LSU decoupled-pending-pool timing closed the former ~9% gap.
  via: blackbox
  app: dxa_copy
  configs: -DVX_CFG_EXT_DXA_ENABLE
  args: -d1

# Perf-regression twin of the model_parity-copy benchmark (same run, cycles-vs-baseline).
- id: perf_gate-copy
  check: perf_gate
  via: blackbox
  app: dxa_copy
  args: -d1
  configs: -DVX_CFG_EXT_DXA_ENABLE
# Multicast DXA copy: intra-core multicast handshake microbench (work is
# num_recv x tile by design; rtlsim determinism makes the small run gateable).
# Parity twin precedes each perf_gate case (same app/config on both drivers).
  shape:
    threads: [4, 16]
- id: model_parity-copy-mcast
  check: model_parity
  # Same cause as model_parity-copy: instrs match, cycles diverge (~9%).
  tolerance: 0.10   # SimX does not model the decoupled LSU pending pool (instrs match; cycles ~9%)
  via: blackbox
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE
- id: perf_gate-copy-mcast
  check: perf_gate
  via: blackbox
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE
  # Not warp-width swept: the multicast kernel ties its tile geometry to the warp
  # width (it asserts tile_cols == NUM_THREADS for a single-warp CTA).
# DXA-staged shared-memory SGEMM (sgemm2 kernel with DXA operand producer).
# tile 4 fits one 16-thread block on the default NT4/NW4 core.
- id: model_parity-sgemm2-dxa
  check: model_parity
  via: blackbox
  app: sgemm2_dxa
  args: -n128 -t4 -m1
  configs: -DVX_CFG_EXT_DXA_ENABLE
- id: perf_gate-sgemm2-dxa
  check: perf_gate
  via: blackbox
  app: sgemm2_dxa
  args: -n128 -t4 -m1
  configs: -DVX_CFG_EXT_DXA_ENABLE
# DXA-staged SGEMM with multicast fetch of the shared operand.
  shape:
    threads: [4, 16]
- id: model_parity-sgemm2-dxa-mcast
  check: model_parity
  via: blackbox
  app: sgemm2_dxa_mcast
  args: -n128
  configs: -DVX_CFG_EXT_DXA_ENABLE
- id: perf_gate-sgemm2-dxa-mcast
  check: perf_gate
  via: blackbox
  app: sgemm2_dxa_mcast
  args: -n128
  configs: -DVX_CFG_EXT_DXA_ENABLE
# WGMMA consumer fed by a DXA producer pipeline. K stays at 64: the test's
# CPU reference does not replicate the TCU fp32 accumulation order, so K=128
# drifts past the 10-ULP gate.
  shape:
    threads: [4, 16]
- id: model_parity-wgmma-dxa
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg_dxa
  args: -m 128 -n 128 -k 64
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=16
  # Not warp-width swept: a warp-group MMA is defined over a 32-lane warp.
  shape: {threads: 32, warps: 8}
- id: perf_gate-wgmma-dxa
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_dxa
  args: -m 128 -n 128 -k 64
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=16
  # Not warp-width swept: a warp-group MMA is defined over a 32-lane warp.
  shape: {threads: 32, warps: 8}
# Sparse WGMMA consumer fed by a DXA producer pipeline.
- id: model_parity-wgmma-sp-dxa
  check: model_parity
  # Execution passes and retired instructions match exactly; cycles diverge
  # (~22%, RTL slower). The sparse-WGMMA + DXA mix compounds two timing-model
  # gaps: the decoupled LSU pending pool and DXA multicast issue. Parity
  # divergence only; pending SimX timing alignment.
  tolerance: 0.10   # SimX timing model lags the LSU pending pool + DXA issue (instrs match; cycles ~22%)
  via: blackbox
  app: sgemm_tcu_wg_sp_dxa
  args: -m 128 -n 128 -k 128
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32
  shape: {threads: 32, warps: 8}
- id: perf_gate-wgmma-sp-dxa
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_sp_dxa
  args: -m 128 -n 128 -k 128
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DWGMMA_NRC=32
  shape: {threads: 32, warps: 8}
# WGMMA + multicast DXA: the large shared operand is broadcast once. K=64 for
# the same reference-tolerance reason as perf_gate-wgmma-dxa.
- id: model_parity-wgmma-dxa-mcast
  check: model_parity
  # Same cause as model_parity-wgmma-sp-dxa: instrs match, cycles diverge (~9%).
  tolerance: 0.10   # SimX timing model lags the LSU pending pool + DXA issue (instrs match; cycles ~9%)
  via: blackbox
  app: sgemm_tcu_wg_dxa_mcast
  args: -m 128 -n 128 -k 64
  configs: -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_EXT_DXA_ENABLE
- id: perf_gate-wgmma-dxa-mcast
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_dxa_mcast
  args: -m 128 -n 128 -k 64
  configs: -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_EXT_DXA_ENABLE

  shape:
    threads: [4, 16]
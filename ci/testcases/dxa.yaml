# Multicast resolves peers as issuer_base + rank*stride, which only holds while a
# cluster's CTAs stay co-resident. At a 1-wide fan-out that is free, so these are
# the cells that actually exercise it: a split cluster deadlocks on its rendezvous.
- id: dxa_copy_mcast-mc
  touches: [hw/rtl/VX_kmu.sv, hw/rtl/interfaces/VX_kmu_bus_if.sv,
            hw/rtl/core/VX_kmu_bus_arb.sv, hw/rtl/core/VX_cta_dispatch.sv,
            sim/simx/kmu/, sim/simx/cta_dispatcher.cpp,
            hw/rtl/dxa, sim/simx/dxa]
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: dxa_copy_mcast
  configs: -DVX_CFG_EXT_DXA_ENABLE
  shape:
    cores: 2
    l2cache: true

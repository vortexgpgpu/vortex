- id: model_parity-tex-gather
  check: model_parity
  via: blackbox
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -G 1 -s 0.5 -o null
- id: model_parity-tex-cmp
  check: model_parity
  via: blackbox
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -f 17 -z 3 -o null
- id: model_parity-tex-npot
  check: model_parity
  via: blackbox
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -a -w 2 -o null
- id: model_parity-tex-reduce
  check: model_parity
  via: blackbox
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -a -m 1 -w 4 -s 0.5 -o null
- id: model_parity-raster
  check: model_parity
  via: blackbox
  app: gfx_raster
  configs: -DVX_CFG_EXT_RASTER_ENABLE
  args: -w 128 -h 128 -t triangle.cgltrace -r triangle_ref_128.png
- id: model_parity-om
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -r whitebox_128.png
- id: model_parity-om-mrt7
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -m -n 7 -b -r whitebox_b_128.png
- id: model_parity-om-r8
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -F 2 -b
- id: model_parity-om-rgb565
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -F 12 -b
- id: model_parity-om-d16
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 127 -h 64 -y
- id: model_parity-om-float
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -z -d
- id: model_parity-om-float-stencil
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -Z -s
- id: model_parity-om-occ
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -d -q -r whitebox_d_128.png
- id: model_parity-om-occ-nowrite
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -Q

# Tests that self-configure their required extensions and validate in their
# default run-{driver} target.
- {id: gfx_pipeline_tex,   via: make-run, drivers: [simx], dir: tests/graphics/gfx_pipeline_tex,   target: "run-{driver}"}
- {id: gfx_pipeline_om,    via: make-run, drivers: [simx], dir: tests/graphics/gfx_pipeline_om,    target: "run-{driver}"}
- {id: gfx_pipeline_raster,via: make-run, drivers: [simx], dir: tests/graphics/gfx_pipeline_raster,target: "run-{driver}"}

# ── FF/SW routing matrix ─────────────────────────────────────────────────────
# Each fixed-function unit dropped from the build (NO_TEX / NO_OM / NO_RASTER);
# the kernel then routes that stage through its gfx_sw software emitter. Every
# combination must render the SAME golden as the all-FF path, so these are the
# tests that keep the gfx_sw emitters (sw/common/gfx_sw.h, gfx_frag_rast.h,
# gfx_frag_tex.h) honest. Without them the SW back end is unprotected: it was
# carried through two ABI-changing phases (the OM aperture export, the per-lane
# vx_tex) with no test able to notice it break.
#
# box.cgltrace is deliberate: it has a texture AND depth, so SW-TEX and the SW
# depth test are genuinely exercised. A trace with no texture leaves the SW
# sampler dead even under NO_TEX.
- {id: gfx_draw3d-sw_tex,    via: make-run, drivers: [simx], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_TEX: 1, OPTS: "-w 128 -h 128 -t box.cgltrace -r box_ref_128.png"}}
- {id: gfx_draw3d-sw_om,     via: make-run, drivers: [simx], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_OM: 1, OPTS: "-w 128 -h 128 -t box.cgltrace -r box_ref_128.png"}}
# The hardware rasterizer's fragment warps run in any order, so the software
# merger's read-modify-write needs the primitive-order merge: without -p this
# scene's overlapping blended fragments race and one pixel comes out wrong.
- {id: gfx_draw3d-sw_om-ordered, via: make-run, drivers: [simx], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_OM: 1, OPTS: "-w 128 -h 128 -t evilskull.cgltrace -r evilskull_ref_128.png -p"}}
# The same race on the RTL, at a size rtlsim runs quickly: without -p five
# pixels of this scene merge out of order.
- {id: gfx_draw3d-sw_om-ordered-32, via: make-run, drivers: [rtlsim], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_OM: 1, OPTS: "-w 32 -h 32 -t evilskull.cgltrace -r evilskull_ref_32.png -p"}}
- {id: gfx_draw3d-sw_raster, via: make-run, drivers: [simx], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_RASTER: 1, OPTS: "-w 128 -h 128 -t box.cgltrace -r box_ref_128.png"}}
# All fixed-function disabled — the whole 3D pipeline in SIMT software.
- {id: gfx_draw3d-sw_all,    via: make-run, drivers: [simx], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_TEX: 1, NO_OM: 1, NO_RASTER: 1, OPTS: "-w 128 -h 128 -t box.cgltrace -r box_ref_128.png"},
   tier: full}

# CLAMP_TO_BORDER, sampled over a span twice the width of the texture so the
# outer margin lands where a border and a clamp disagree. Checked in-test
# against a colour no texel of the source carries.
- id: gfx_tex-border-point
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i palette64.png -B -g 0 -o null
- id: gfx_tex-border-bilinear
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i palette64.png -B -g 1 -o null

# Per-lane state in the lod operand against a point-filtered stage: an array
# layer (the second layer is the first inverted), a bilinear or point tap and a
# two-level blend that change from pixel to pixel, at the base level and
# minified. Checked in-test against the software sampler at the same operand.
- id: gfx_tex-lanes
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -a -o null
- id: gfx_tex-lanes-minified
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -a -s 0.5 -o null

# textureGather in the unit: each channel's four taps in GL gather order,
# checked in-test against the software gather.
- id: gfx_tex-gather-r
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -G 0 -s 0.5 -o null
- id: gfx_tex-gather-a
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -G 3 -s 0.5 -o null

# Textures of any size: a 45x27 (and 37x23) crop, sampled across [-0.5,1.5) so
# every wrap mode folds and every edge is crossed. Checked in-test against the
# software sampler at the same operand.
- id: gfx_tex-npot-mirror
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -a -w 2 -o null
- id: gfx_tex-npot-repeat-minified
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -a -w 1 -s 0.5 -o null
- id: gfx_tex-npot-border
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -a -B -o null
- id: gfx_tex-npot-gather
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 37x23 -G 1 -w 1 -o null
- id: gfx_tex-gather-border
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -G 2 -B -o null
# Gather under mirrored repeat: in a reflected period the fold returns an
# axis's taps reversed, which the gather undoes so each keeps its position.
- id: gfx_tex-gather-mirror
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -G 1 -w 2 -o null

# Depth compare (vx_tex_cmp) of a two-layer depth texture, each pixel taking its
# own layer, tap filter and reference, checked in-test against the software
# shadow sampler: D16 clamped, under a border wrap (whose depth is an f32 of 1.0,
# against references the unorm compare clamps) and mirrored, D24 under a border
# wrap, and D32F repeating, with five different compare functions.
- id: gfx_tex-cmp-d16
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -f 17 -z 2 -o null
- id: gfx_tex-cmp-d24-border
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -f 56 -z 5 -B -c 24x20 -o null
- id: gfx_tex-cmp-d32f-repeat
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -f 18 -z 7 -w 1 -o null
- id: gfx_tex-cmp-d16-border
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -f 17 -z 3 -B -c 20x24 -o null
- id: gfx_tex-cmp-d16-mirror
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -f 17 -z 6 -w 2 -o null

# Sampler reductions: the per-channel min or max of the taps with a nonzero
# weight, over one level and over two (lanes mix both), and under
# mirror-clamp-to-edge. Checked in-test against the software sampler.
- id: gfx_tex-reduce-min
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -a -m 1 -s 0.5 -o null
- id: gfx_tex-reduce-max
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -a -m 2 -w 4 -o null
- id: gfx_tex-mirror-clamp
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -c 45x27 -a -w 4 -o null

# Two colour attachments from one draw. Attachment 0 still matches the
# single-attachment golden; attachment 1 is checked in-test against the colour
# the kernel computes, so a shared buffer or a shared writemask fails.
- id: gfx_om-mrt
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -m -r whitebox_128.png
- id: gfx_om-mrt-blend
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -m -b -r whitebox_b_128.png
# The highest attachment: its index rides the export's depth word, so this is
# the case that covers every bit of that field and every per-attachment slot.
- id: gfx_om-mrt7
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -m -n 7 -b -r whitebox_b_128.png

# Per-unit software emitters, against the same goldens as their FF cases.
- id: gfx_om-sw
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -r whitebox_128.png -S
# Stencil test and ops against every depth/stencil word, on the fixed-function
# and the software merger: a stencil failure must leave depth untouched.
- id: gfx_om-stencil
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -s
- id: gfx_om-stencil-sw
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -s -S
# D32F: stored depths below, at (both zeros) and above a -1.0 fragment, and
# outside [0, 1], compared as ordered keys and checked per pixel; then the
# float pair's attachment field in the export address (attachment 5, whose
# bits are not all ones, so a shifted field decodes to another attachment).
- id: gfx_om-float
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -z -d
- id: gfx_om-float-sw
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -z -d -S
- id: gfx_om-float-mrt5
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -z -m -n 5 -r whitebox_128.png
# D32F_S8: the -s stencil outcomes on the stencil word of an 8-byte texel,
# beside the float depth.
- id: gfx_om-float-stencil
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -Z -s
- id: gfx_om-float-stencil-sw
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -Z -s -S
# The back face compares against another reference, so the face bit a float
# pair carries in its address decides every pixel.
- id: gfx_om-float-stencil-back
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -Z -s -f
# Occlusion counter: the passing-fragment count against every pixel's depth
# (and stencil) outcome; once per fragment on two attachments; a draw that
# writes nothing still tests and counts; and the per-core counters summed
# across several OM cores.
- id: gfx_om-occ
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -d -q -r whitebox_d_128.png
- id: gfx_om-occ-stencil
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -s -q
- id: gfx_om-occ-mrt
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -m -q -r whitebox_128.png
- id: gfx_om-occ-nowrite
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -Q
- id: gfx_om-occ-cores
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE -DVX_CFG_NUM_OM_CORES=2 -DICACHE_DISABLE -DDCACHE_DISABLE -DLMEM_DISABLE
  shape:
    cores: 2
    warps: 1
    threads: 4
  args: -w 128 -h 128 -d -q -r whitebox_d_128.png
- id: gfx_raster-sw
  via: blackbox
  drivers: [simx]
  app: gfx_raster
  configs: -DVX_CFG_EXT_RASTER_ENABLE
  args: -w 128 -h 128 -t triangle.cgltrace -r triangle_ref_128.png -z
# gfx_tex4 had no CI case at all; it owns the only software-sampler entry point.
- id: gfx_tex4-ff
  via: blackbox
  drivers: [simx]
  app: gfx_tex4
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -r soccer_ref_g0.png -g 0
- id: gfx_tex4-sw
  via: blackbox
  drivers: [simx]
  app: gfx_tex4
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -r soccer_ref_g0.png -g 0 -S

# Perf-regression twin of the model_parity-tex benchmark (same run, cycles-vs-baseline).
- id: perf_gate-tex
  check: perf_gate
  via: blackbox
  app: gfx_tex
  args: -i toad.png -r toad_ref_f0.png -f 0 -g 0
  configs: -DVX_CFG_EXT_TEX_ENABLE

# Perf-regression twin of the model_parity-raster benchmark (same run, cycles-vs-baseline).
  shape:
    threads: [4, 16]
- id: perf_gate-raster
  check: perf_gate
  via: blackbox
  app: gfx_raster
  args: -w 128 -h 128 -t triangle.cgltrace -r triangle_ref_128.png
  configs: -DVX_CFG_EXT_RASTER_ENABLE

# Perf-regression twin of the model_parity-om benchmark (same run, cycles-vs-baseline).
  shape:
    threads: [4, 16]
- id: perf_gate-om
  check: perf_gate
  via: blackbox
  app: gfx_om
  args: -w 128 -h 128 -r whitebox_128.png
  configs: -DVX_CFG_EXT_OM_ENABLE

# Full-pipeline (TEX+RASTER+OM) parity + perf-gate on box.cgltrace — catches
# cross-FF-unit interactions the per-unit model_parity/perf_gate cases miss.
  shape:
    threads: [4, 16]
- id: model_parity-draw3d
  check: model_parity
  via: blackbox
  app: gfx_draw3d
  args: -w 128 -h 128 -t box.cgltrace -r box_ref_128.png
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
# Primitive-order merge: every fragment warp brackets its export with
# vx_frag_order_wait/release, so the ticket, wait, wake and release-drain paths
# are all in the timing being compared.
- id: model_parity-draw3d-ordered
  check: model_parity
  via: blackbox
  app: gfx_draw3d
  args: -w 128 -h 128 -t box.cgltrace -r box_ref_128.png -p
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
- id: perf_gate-draw3d
  check: perf_gate
  via: blackbox
  app: gfx_draw3d
  args: -w 128 -h 128 -t box.cgltrace -r box_ref_128.png
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
  shape:
    threads: [4, 16]

# Core scaling. The same NT=4 pipeline across 2 cores over a shared L2 (a
# multi-core config needs one). One TEX / RASTER / OM unit serves both cores, so
# this is the gate's only view of the fixed-function buses arbitrating between
# two senders: a change that serializes any of them is invisible at cores=1.
- id: perf_gate-draw3d-mc
  check: perf_gate
  via: blackbox
  app: gfx_draw3d
  args: -w 128 -h 128 -t box.cgltrace -r box_ref_128.png
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
  shape: {cores: 2, l2cache: true, threads: 4}
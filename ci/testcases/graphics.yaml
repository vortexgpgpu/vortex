# ── Early-Z (occlusion cull) — VX_CFG_RASTER_EARLYZ knob ON ───────────────────
# The raster unit reads committed depth (coherent ocache) and culls occluded
# fragments before shading; requires the OM + RASTER fixed-function units. The
# fixed-point depth-plane contract makes the cull bit-identical to the
# no-early-Z golden (the per-draw VX_DCR_OM_EARLYZ_SAFE runtime gate is set by
# the driver). Knob-off leaves the raster core byte-identical (covered above).
- id: gfx_earlyz-box-simx
  via: blackbox
  drivers: [simx]
  app: gfx_draw3d
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE -DVX_CFG_RASTER_EARLYZ
  args: -w 128 -h 128 -t box.cgltrace -r box_ref_128.png
  touches: [hw/rtl/raster/, sim/simx/raster/, sw/common/gfx_setup.h, sw/kernel/include/vx_graphics.h]
- id: gfx_earlyz-box-rtlsim
  via: blackbox
  drivers: [rtlsim]
  app: gfx_draw3d
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE -DVX_CFG_RASTER_EARLYZ
  args: -w 128 -h 128 -t box.cgltrace -r box_ref_128.png
  touches: [hw/rtl/raster/, sim/simx/raster/, sw/common/gfx_setup.h, sw/kernel/include/vx_graphics.h]
- id: gfx_earlyz-evilskull32-simx
  via: blackbox
  drivers: [simx]
  app: gfx_draw3d
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE -DVX_CFG_RASTER_EARLYZ -DICACHE_DISABLE -DDCACHE_DISABLE -DLMEM_DISABLE
  shape: {threads: 4}
  args: -w 32 -h 32 -t evilskull.cgltrace -r evilskull_ref_32.png
  touches: [hw/rtl/raster/, sim/simx/raster/, sw/common/gfx_setup.h, sw/kernel/include/vx_graphics.h]
- id: gfx_earlyz-evilskull32-rtlsim
  via: blackbox
  drivers: [rtlsim]
  app: gfx_draw3d
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE -DVX_CFG_RASTER_EARLYZ -DICACHE_DISABLE -DDCACHE_DISABLE -DLMEM_DISABLE
  shape: {threads: 4}
  args: -w 32 -h 32 -t evilskull.cgltrace -r evilskull_ref_32.png
  touches: [hw/rtl/raster/, sim/simx/raster/, sw/common/gfx_setup.h, sw/kernel/include/vx_graphics.h]
# evilskull@128 with early-Z on rtlsim: the early-Z cull uses the reflexive
# relaxation of the depth func (drop only strictly-behind fragments), so it is
# image-identical to the ROP-only path (the OM late-Z stays authoritative).
- id: gfx_earlyz-evilskull128-rtlsim
  via: blackbox
  drivers: [rtlsim]
  app: gfx_draw3d
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE -DVX_CFG_RASTER_EARLYZ
  args: -w 128 -h 128 -t evilskull.cgltrace -r evilskull_ref_128.png
  tier: full
  touches: [hw/rtl/raster/, sw/common/gfx_setup.h]

# SimX<->rtlsim cycle parity, one case per FF unit (TEX / RASTER / OM), each
# with only its own extension enabled so the gap is attributable: same config on
# both drivers, cycles must agree within tolerance (see core.yaml).
- id: model_parity-tex
  check: model_parity
  # Execution passes and retired instructions match exactly; only the cycle
  # counts diverge (~12%). The memory-backed gfx window reads TEX operands
  # synchronously (one-cycle RAM latency) where the SimX TEX model still assumes
  # a combinational read, so rtlsim runs fewer cycles than the model. Pending a
  # SimX TEX-latency update; parity divergence only, not a functional error.
  known_issue: "cycle-parity gap ~12%: synchronous window read not yet modeled in SimX TEX (instrs match, image correct)"
  via: blackbox
  app: gfx_tex
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i toad.png -r toad_ref_f0.png -f 0 -g 0
- id: model_parity-raster
  check: model_parity
  # Pre-existing: both drivers render the correct image, but the SimX raster
  # model retires a different instruction count than RTL (simx 12422 vs rtlsim
  # 11894 — rtlsim matches the recorded perf baseline). Predates the gfx-window
  # redesign; needs the SimX raster fragment model aligned to RTL.
  known_issue: "pre-existing SimX-vs-RTL raster instruction-count divergence (execution passes, images match)"
  via: blackbox
  app: gfx_raster
  configs: -DVX_CFG_EXT_RASTER_ENABLE
  args: -w 128 -h 128 -t triangle.cgltrace -r triangle_ref_128.png
- id: model_parity-om
  check: model_parity
  via: blackbox
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -r whitebox_128.png

# Tests that self-configure their required extensions and validate in their
# default run-{driver} target.
- {id: gfx_pipeline_tex,   via: make-run, drivers: [simx], dir: tests/graphics/gfx_pipeline_tex,   target: "run-{driver}"}
- {id: gfx_pipeline_om,    via: make-run, drivers: [simx], dir: tests/graphics/gfx_pipeline_om,    target: "run-{driver}"}
- {id: gfx_pipeline_raster,via: make-run, drivers: [simx], dir: tests/graphics/gfx_pipeline_raster,target: "run-{driver}"}

# ── FF/SW routing matrix ─────────────────────────────────────────────────────
# Each fixed-function unit dropped from the build (NO_TEX / NO_OM / NO_RASTER);
# the kernel then routes that stage through its gfx_sw software emitter. Every
# combination must render the SAME golden as the all-FF path, so these are the
# tests that keep the gfx_sw emitters (sw/common/gfx_sw.h, gfx_frag_rast.h,
# gfx_frag_tex.h) honest. Without them the SW back end is unprotected: it was
# carried through two ABI-changing phases (the OM aperture export, the per-lane
# vx_tex) with no test able to notice it break.
#
# box.cgltrace is deliberate: it has a texture AND depth, so SW-TEX and the SW
# depth test are genuinely exercised. A trace with no texture leaves the SW
# sampler dead even under NO_TEX.
- {id: gfx_draw3d-sw_tex,    via: make-run, drivers: [simx], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_TEX: 1, OPTS: "-w 128 -h 128 -t box.cgltrace -r box_ref_128.png"}}
- {id: gfx_draw3d-sw_om,     via: make-run, drivers: [simx], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_OM: 1, OPTS: "-w 128 -h 128 -t box.cgltrace -r box_ref_128.png"}}
- {id: gfx_draw3d-sw_raster, via: make-run, drivers: [simx], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_RASTER: 1, OPTS: "-w 128 -h 128 -t box.cgltrace -r box_ref_128.png"}}
# All fixed-function disabled — the whole 3D pipeline in SIMT software.
- {id: gfx_draw3d-sw_all,    via: make-run, drivers: [simx], dir: tests/graphics/gfx_draw3d, target: "run-{driver}",
   vars: {NO_TEX: 1, NO_OM: 1, NO_RASTER: 1, OPTS: "-w 128 -h 128 -t box.cgltrace -r box_ref_128.png"},
   tier: full}

# Two colour attachments from one draw. Attachment 0 still matches the
# single-attachment golden; attachment 1 is checked in-test against the colour
# the kernel computes, so a shared buffer or a shared writemask fails.
- id: gfx_om-mrt
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -m -r whitebox_128.png
- id: gfx_om-mrt-blend
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -m -b -r whitebox_b_128.png

# Per-unit software emitters, against the same goldens as their FF cases.
- id: gfx_om-sw
  via: blackbox
  drivers: [simx, rtlsim]
  app: gfx_om
  configs: -DVX_CFG_EXT_OM_ENABLE
  args: -w 128 -h 128 -r whitebox_128.png -S
- id: gfx_raster-sw
  via: blackbox
  drivers: [simx]
  app: gfx_raster
  configs: -DVX_CFG_EXT_RASTER_ENABLE
  args: -w 128 -h 128 -t triangle.cgltrace -r triangle_ref_128.png -z
# gfx_tex4 had no CI case at all; it owns the only software-sampler entry point.
- id: gfx_tex4-ff
  via: blackbox
  drivers: [simx]
  app: gfx_tex4
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -r soccer_ref_g0.png -g 0
- id: gfx_tex4-sw
  via: blackbox
  drivers: [simx]
  app: gfx_tex4
  configs: -DVX_CFG_EXT_TEX_ENABLE
  args: -i soccer.png -r soccer_ref_g0.png -g 0 -S

# Perf-regression twin of the model_parity-tex benchmark (same run, cycles-vs-baseline).
- id: perf_gate-tex
  check: perf_gate
  via: blackbox
  app: gfx_tex
  args: -i toad.png -r toad_ref_f0.png -f 0 -g 0
  configs: -DVX_CFG_EXT_TEX_ENABLE

# Perf-regression twin of the model_parity-raster benchmark (same run, cycles-vs-baseline).
  shape:
    threads: [4, 16]
- id: perf_gate-raster
  check: perf_gate
  via: blackbox
  app: gfx_raster
  args: -w 128 -h 128 -t triangle.cgltrace -r triangle_ref_128.png
  configs: -DVX_CFG_EXT_RASTER_ENABLE

# Perf-regression twin of the model_parity-om benchmark (same run, cycles-vs-baseline).
  shape:
    threads: [4, 16]
- id: perf_gate-om
  check: perf_gate
  via: blackbox
  app: gfx_om
  args: -w 128 -h 128 -r whitebox_128.png
  configs: -DVX_CFG_EXT_OM_ENABLE

# Full-pipeline (TEX+RASTER+OM) parity + perf-gate on box.cgltrace — catches
# cross-FF-unit interactions the per-unit model_parity/perf_gate cases miss.
  shape:
    threads: [4, 16]
- id: model_parity-draw3d
  check: model_parity
  # Pre-existing: both drivers render box.cgltrace correctly (rtlsim retires
  # 143143 instrs, matching the recorded perf baseline), but the SimX graphics
  # model retires far fewer (~71753) than RTL. The instruction-count divergence
  # predates the gfx-window redesign and is a SimX graphics-model fidelity gap,
  # not a functional error; needs the SimX raster/OM fragment model aligned.
  known_issue: "pre-existing SimX-vs-RTL graphics instruction-count divergence (execution passes, image matches baseline)"
  via: blackbox
  app: gfx_draw3d
  args: -w 128 -h 128 -t box.cgltrace -r box_ref_128.png
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
- id: perf_gate-draw3d
  check: perf_gate
  via: blackbox
  app: gfx_draw3d
  args: -w 128 -h 128 -t box.cgltrace -r box_ref_128.png
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
  shape:
    threads: [4, 16]

# Core scaling. The same NT=4 pipeline across 2 cores over a shared L2 (a
# multi-core config needs one). One TEX / RASTER / OM unit serves both cores, so
# this is the gate's only view of the fixed-function buses arbitrating between
# two senders: a change that serializes any of them is invisible at cores=1.
- id: perf_gate-draw3d-mc
  check: perf_gate
  via: blackbox
  app: gfx_draw3d
  args: -w 128 -h 128 -t box.cgltrace -r box_ref_128.png
  configs: -DVX_CFG_EXT_TEX_ENABLE -DVX_CFG_EXT_RASTER_ENABLE -DVX_CFG_EXT_OM_ENABLE
  shape: {cores: 2, l2cache: true, threads: 4}
# Test cases for `mpi`, drafted from regression.sh.in (review/collapse).
category: integration
defaults:
  xlen:
  - 32
  - 64
  tier: nightly
  needs: [mpi]
tests:
- id: mpi-1
  via: make-run
  drivers:
  - simx
  dir: tests/mpi/mpi_dotproduct
  target: run-{driver}
  vars:
    MPI: '1'
    NP: '4'

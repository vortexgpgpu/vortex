# Test cases for `debug`, drafted from regression.sh.in (review/collapse).
category: debug
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
tests:
- id: demo-1
  via: blackbox
  drivers:
  - opae
  app: demo
  configs: -O0
  args: -n1
- id: demo-2
  via: blackbox
  drivers:
  - xrt
  app: demo
  configs: -O0
  args: -n1
- id: demo-3
  via: blackbox
  drivers:
  - opae
  app: demo
  configs: -DVX_CFG_SOCKET_SIZE=1
  shape:
    cores: 2
    clusters: 2
    l2cache: true
    l3cache: true
  args: -n1
  flags: --debug=1 --perf=1
- id: demo-4
  via: blackbox
  drivers:
  - xrt
  app: demo
  configs: -DVX_CFG_SOCKET_SIZE=1
  shape:
    cores: 2
    clusters: 2
    l2cache: true
    l3cache: true
  args: -n1
  flags: --debug=1 --perf=1
- id: demo-5
  via: blackbox
  drivers:
  - simx
  app: demo
  configs: -DVX_CFG_SOCKET_SIZE=1
  shape:
    cores: 2
    clusters: 2
    l2cache: true
    l3cache: true
  args: -n1
  flags: --debug=1 --perf=1
- id: sgemm_tcu-1
  via: blackbox
  drivers:
  - simx
  app: sgemm_tcu
  configs: -DVX_CFG_EXT_TCU_ENABLE
  flags: --debug=3 --log=run_simx.log
# The debug build (44-bit UUID, assertions, traces) must not move RTL timing:
# the runner reruns this case built release and requires identical cycles. The
# shape keeps the data cache under pressure, with two channels whose same-word
# reads merge, so a debug-only tag width reaching the merge shows in cycles.
- id: sgemm_tcu-2
  via: blackbox
  drivers:
  - rtlsim
  app: sgemm_tcu
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_DCACHE_SIZE=4096 -DVX_CFG_EXT_TCU_ENABLE
  shape:
    l2cache: true
  flags: --debug=3 --log=run_rtlsim.log
  release_parity: true
- id: simx_mt-1
  via: blackbox
  drivers:
  - simx
  app: sgemm
  configs: -DSIMX_MT=4
  shape:
    cores: 4
    l2cache: true
  args: -n128
- id: simx_functional-1
  via: blackbox
  drivers:
  - simx
  app: sgemm
  configs: -DSIMX_FUNCTIONAL
  args: -n128
- id: simx_functional-2
  via: blackbox
  drivers:
  - simx
  app: sgemm
  configs: -DSIMX_FUNCTIONAL -DSIMX_MT=4
  shape:
    cores: 4
    l2cache: true
  args: -n128

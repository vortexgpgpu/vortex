# Test cases for `opencl`, drafted from regression.sh.in (review/collapse).
category: opencl
defaults:
  xlen:
  - 32
  - 64
  tier: fast
tests:
- id: isa-1
  via: make-run
  drivers:
  - simx
  dir: tests/opencl
  target: run-{driver}
- id: isa-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/opencl
  target: run-{driver}
# hybridsort uses atomic_add (RVA amo*.w), so it needs the A extension and is
# excluded from the default run-{driver} sweep above. Runs on both simx and
# rtlsim (its bucket counters share one cache line, exercising the same-line
# scatter-atomic commit path).
- id: hybridsort
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: hybridsort
  xlen:
  - 32
  configs: "-DVX_CFG_EXT_A_ENABLE"
- id: lbm-1
  via: blackbox
  drivers:
  - simx
  app: lbm
  shape:
    warps: 8
- id: lbm-2
  via: blackbox
  drivers:
  - rtlsim
  app: lbm
  shape:
    warps: 8

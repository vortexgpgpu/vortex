# Test cases for `rvc` (RISC-V compressed extension). EXT_C builds the sim
# with the C decoder and compiles the kernels with `c` (compressed) -march.
# The compiler-generated regression kernels below exercise word-straddling
# 32-bit instructions and pass on both simx and rtlsim.
category: rvc
defaults:
  configs: "-DVX_CFG_EXT_C_ENABLE"
  xlen:
  - 32
  - 64
  tier: fast
tests:
# --- compressed-ISA conformance (hand-written rv*uc-p-*): pass on both ---
- id: isa-32c-1
  via: make-run
  drivers:
  - simx
  dir: tests/riscv/isa
  target: run-{driver}-32c
- id: isa-32c-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-32c
# 64c conformance only makes sense on a 64-bit build (legacy rvc() guarded
# these with `if XLEN == 64`).
- id: isa-64c-1
  via: make-run
  drivers:
  - simx
  dir: tests/riscv/isa
  target: run-{driver}-64c
  xlen: [64]
- id: isa-64c-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-64c
  xlen: [64]
# --- real compiler-generated programs, compressed (exercise word-straddling
#     32-bit instrs). Pass on both simx and rtlsim. ---
- id: isa-1
  via: make-run
  drivers:
  - simx
  dir: tests/regression/sgemm
  target: run-{driver}
- id: isa-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/regression/sgemm
  target: run-{driver}
- id: isa-3
  via: make-run
  drivers:
  - simx
  dir: tests/regression/diverge
  target: run-{driver}
- id: isa-4
  via: make-run
  drivers:
  - rtlsim
  dir: tests/regression/diverge
  target: run-{driver}
- id: isa-5
  via: make-run
  drivers:
  - simx
  dir: tests/regression/dogfood
  target: run-{driver}
- id: isa-6
  via: make-run
  drivers:
  - rtlsim
  dir: tests/regression/dogfood
  target: run-{driver}
- id: isa-7
  via: make-run
  drivers:
  - simx
  dir: tests/regression/raycast
  target: run-{driver}
- id: isa-8
  via: make-run
  drivers:
  - rtlsim
  dir: tests/regression/raycast
  target: run-{driver}

# Unit tests (host). Native catalog entries — replaces the legacy
# regression.sh --unittest delegation (sw + hw unit tests).
category: unittest
defaults:
  xlen: [32, 64]
  tier: smoke
tests:
  - id: sw
    via: script
    run: "make -C tests/unittest run"
  - id: hw
    via: script
    run: "make -C hw/unittest"
  # Every identifier in hw/rtl declared before its first use (IEEE 1800 6.10).
  # Vivado makes an undeclared assignment or connection target a new implicit
  # net in the using scope and leaves the real one undriven, while Verilator,
  # Yosys, sv2v and slang bind the later declaration, so no simulation or lint
  # sees it: foldsim_mem's rr_peek_valid, assigned in generate blocks before
  # its wire (d6fbbfd55), froze the V80. ci/decl_before_use.py scans every
  # .sv syntactically (all generate branches) under three define sets, in a
  # few seconds; it fails on d6fbbfd55's parent.
  - id: rtl-decl-before-use
    via: script
    run: "python3 ci/decl_before_use.py --selftest"
    xlen: [32]
    needs: [pyslang]
    touches: [hw/rtl, ci/decl_before_use.py, VX_config.toml]
  # FPU arithmetic units (VX_fma/fdiv/fsqrt/fcvt/fdivsqrt): the `hw` lane above only
  # builds the unit tests; this lane executes them so a softfloat-divergent
  # regression actually fails CI (each driver checks bit-exact result+fflags over
  # millions of vectors across all RISC-V rounding modes, default + lean configs).
  - id: hw-fpu
    via: script
    run: "make -C hw/unittest run-fpu"
  # TCU FEDP datapath: the `hw` lane only builds it; this lane executes tcu_fedp
  # per format (native TFR + DPI). touches gates it on tcu changes.
  - id: hw-tcu
    via: script
    run: "make -C hw/unittest run-tcu"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp]
  # Same native-TFR formats with the multipliers mapped onto DSP48 (USE_DSP=1) —
  # the FPGA-synthesis path, off by default in sim. Bit-identical to LUT by
  # contract, so a mismatch is a DSP-packing bug.
  - id: hw-tcu-dsp
    via: script
    run: "make -C hw/unittest run-tcu-dsp"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp]
  # VX_alu_muldiv as synthesized (no DPI models): every M opcode against the
  # RISC-V definitions under random input bubbles and output stalls, and the
  # multiplier's passes and latency (multi-pass 64-bit multiply at XLEN 64).
  - id: hw-alu-muldiv
    via: script
    run: "make -C hw/unittest/alu_muldiv run"
    touches: [hw/rtl/core/VX_alu_muldiv.sv, hw/rtl/libs/VX_mul_multipass.sv, hw/rtl/libs/VX_multiplier.sv, hw/rtl/libs/VX_serial_div.sv, hw/unittest/alu_muldiv]
  # TLB miss stations under a saturated walker: the L2 TLB's (and the dMMU's)
  # VX_tlb_mshr must issue every pending miss within a bounded number of walks.
  # A lowest-entry-first issue let the low entries recycle ahead of a waiting
  # high entry forever (4-SM A100-class demo hang); --fair fails on that.
  - id: hw-tlb-l2-fair
    via: script
    run: "make -C hw/unittest/tlb_l2 run OPTS=--fair"
    touches: [hw/rtl/vm, hw/unittest/tlb_l2]
  # The command processor's DMA port into the last-level cache: a launch behind
  # DMA writes must wait for them to reach the cache. No runtime path launches
  # right behind a DMA write, so no system test observes this ordering.
  - id: hw-cp-llc-port
    via: script
    run: "make -C hw/unittest/cp_llc_port run"
    touches: [hw/rtl/mem/VX_cp_llc_port.sv, hw/unittest/cp_llc_port]
  # The command processor's DCR reads through its GPU register slice with the
  # device MMU's responder on the bus: after the post-launch MMU fault read,
  # every perf-counter read and every core's flush answer must be its own. A
  # response outliving its one-cycle pulse answers the next read; whether a
  # system run sees it depends on host timing.
  - id: hw-cp-dcr-mmu
    via: script
    run: "make -C hw/unittest/cp_dcr_mmu run"
    touches: [hw/rtl/vm/VX_mmu_dcr.sv, hw/rtl/cp/VX_cp_dcr_proxy.sv, hw/rtl/cp/VX_cp_gpu_slice.sv, hw/rtl/core/VX_dcr_data.sv, hw/unittest/cp_dcr_mmu]
  # Stream arbiters over more than 1.5x MAX_FANOUT requests become trees of
  # slices; a last slice narrower than the arbiter's other side must keep every
  # request on its own output and select. The system shapes reach only a few of
  # these slice shapes.
  - id: hw-stream-arb
    via: script
    run: "make -C hw/unittest/stream_arb run"
    touches: [hw/rtl/libs/VX_stream_arb.sv, hw/unittest/stream_arb]
  # Sticky (greedy) arbitration of every VX_generic_arbiter policy: the hold
  # ends when the grantee's request drops, and requests that appear together
  # only in short windows (the scoreboard's LSU-credit pattern) are all served
  # within NUM_REQS windows.
  - id: hw-sticky-arb
    via: script
    run: "make -C hw/unittest/sticky_arb run"
    touches: [hw/rtl/libs/VX_generic_arbiter.sv, hw/rtl/libs/VX_priority_arbiter.sv, hw/rtl/libs/VX_rr_arbiter.sv, hw/rtl/libs/VX_matrix_arbiter.sv, hw/rtl/libs/VX_cyclic_arbiter.sv, hw/rtl/libs/VX_gto_arbiter.sv, hw/unittest/sticky_arb]
  # Texel blend (VX_tex_lerp, both forms the sampler uses) against the C model
  # the SW sampler and SimX share, and the exact Vulkan f/256 blend, over every
  # input.
  - id: hw-tex-lerp
    via: script
    run: "make -C hw/unittest/tex_lerp run"
    touches: [hw/rtl/tex, hw/unittest/tex_lerp, sw/common/vx_gfx_abi.h, sw/common/gfx_frag_tex.h]
  # MUFU datapath (VX_mufu_pe) against the golden model SimX and the tests share
  # (sw/common/mufu.cpp): specials, a strided sweep of all FP32 inputs, random.
  - id: hw-mufu
    via: script
    run: "make -C hw/unittest/mufu_unit run"
    touches: [hw/rtl/mufu, hw/unittest/mufu_unit, sw/common/mufu.cpp, sw/common/mufu_tables.h]

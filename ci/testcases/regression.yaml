# Test cases for `regression`, drafted from regression.sh.in (review/collapse).
category: regression
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
tests:
- id: isa-1
  via: make-run
  drivers:
  - simx
  dir: tests/regression
  target: run-{driver}
- id: isa-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/regression
  target: run-{driver}
- id: occupancy-1
  via: blackbox
  drivers:
  - simx
  app: occupancy
  shape:
    threads: 32
- id: occupancy-2
  via: blackbox
  drivers:
  - rtlsim
  app: occupancy
  shape:
    threads: 32
- id: occupancy-3
  via: blackbox
  drivers:
  - simx
  app: occupancy
  shape:
    threads: 32
    cores: 4
- id: occupancy-4
  via: blackbox
  drivers:
  - rtlsim
  app: occupancy
  shape:
    threads: 32
    cores: 4
- id: dogfood-1
  via: blackbox
  drivers:
  - simx
  app: dogfood
  shape:
    cores: 2
  args: -n1 -tgbar
- id: dogfood-2
  via: blackbox
  drivers:
  - opae
  app: dogfood
  shape:
    cores: 2
  args: -n1 -tgbar
- id: dogfood-3
  via: blackbox
  drivers:
  - simx
  app: dogfood
  args: -n1 -tbar
- id: dogfood-4
  via: blackbox
  drivers:
  - xrt
  app: dogfood
  args: -n1 -tbar
- id: vecadd-1
  via: blackbox
  drivers:
  - simx
  app: vecadd
  flags: --nohup
- id: reopen-1
  via: blackbox
  drivers:
  - xrt
  app: reopen
- id: reopen-2
  via: script
  run: "XRTSIM_WARM_OPEN=1 ./ci/blackbox.sh --driver=xrt --app=reopen"
- id: reopen-3
  via: script
  run: "OPAESIM_WARM_OPEN=1 ./ci/blackbox.sh --driver=opae --app=reopen"
# Degenerate dispatch: one CTA of one thread. The launch/completion path at
# minimum slack (no following CTA across the handoff); also checks the launch
# shape (gridDim/blockDim) read back as data and per-CTA store coverage.
- id: single_cta-1
  via: blackbox
  drivers:
  - simx
  app: single_cta
- id: single_cta-2
  via: blackbox
  drivers:
  - rtlsim
  app: single_cta
- id: module_reload-1
  via: blackbox
  drivers:
  - simx
  app: module_reload

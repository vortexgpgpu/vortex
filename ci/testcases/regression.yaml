# Test cases for `regression`, drafted from regression.sh.in (review/collapse).
category: regression
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
tests:
- id: isa-1
  via: make-run
  drivers:
  - simx
  dir: tests/regression
  target: run-{driver}
- id: isa-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/regression
  target: run-{driver}
- id: occupancy-1
  via: blackbox
  drivers:
  - simx
  app: occupancy
  shape:
    threads: 32
- id: occupancy-2
  via: blackbox
  drivers:
  - rtlsim
  app: occupancy
  shape:
    threads: 32
- id: occupancy-3
  via: blackbox
  drivers:
  - simx
  app: occupancy
  shape:
    threads: 32
    cores: 4
- id: occupancy-4
  via: blackbox
  drivers:
  - rtlsim
  app: occupancy
  shape:
    threads: 32
    cores: 4
- id: dogfood-1
  via: blackbox
  drivers:
  - simx
  app: dogfood
  shape:
    cores: 2
  args: -n1 -tgbar
- id: dogfood-2
  via: blackbox
  drivers:
  - xrt
  app: dogfood
  shape:
    cores: 2
  args: -n1 -tgbar
- id: dogfood-3
  via: blackbox
  drivers:
  - simx
  app: dogfood
  args: -n1 -tbar
- id: dogfood-4
  via: blackbox
  drivers:
  - xrt
  app: dogfood
  args: -n1 -tbar
- id: gbar-phase-1
  via: blackbox
  drivers:
  - simx
  app: gbar_phase
  shape:
    cores: 2
- id: gbar-phase-2
  via: blackbox
  drivers:
  - xrt
  app: gbar_phase
  shape:
    cores: 2
# SimX<->rtlsim cycle parity on the multi-core global barrier. Until this case
# existed the gate could not observe the gbar path at all: every other parity
# case is single-core, so USE_GBAR is 0 and the request queue is not built.
#
# async_gbarrier, not gbar_phase: the parity vehicle has to be long enough that
# a fixed modelling offset does not dominate it. gbar_phase is a 248-instruction
# functional probe and a ~55-cycle offset is 7.9% of its 695-cycle run;
# async_gbarrier exercises the same path over a 1024-iteration overlap window
# and sits at 1.9%. Default tolerance, deliberately not widened.
- id: model_parity-async-gbarrier
  check: model_parity
  via: blackbox
  app: async_gbarrier
  shape:
    cores: 2

- id: bar-slot-phase-1
  via: blackbox
  drivers:
  - simx
  app: bar_slot_phase
  shape:
    warps: 2
- id: bar-slot-phase-2
  via: blackbox
  drivers:
  - xrt
  app: bar_slot_phase
  shape:
    warps: 2
- id: vecadd-1
  via: blackbox
  drivers:
  - simx
  app: vecadd
  flags: --nohup
- id: reopen-1
  via: blackbox
  drivers:
  - xrt
  app: reopen
- id: reopen-2
  via: script
  run: "XRTSIM_WARM_OPEN=1 ./ci/blackbox.sh --driver=xrt --app=reopen"
- id: reopen-3
  via: script
  run: "OPAESIM_WARM_OPEN=1 ./ci/blackbox.sh --driver=opae --app=reopen"
# Degenerate dispatch: one CTA of one thread. The launch/completion path at
# minimum slack (no following CTA across the handoff); also checks the launch
# shape (gridDim/blockDim) read back as data and per-CTA store coverage.
- id: single_cta-1
  via: blackbox
  drivers:
  - simx
  app: single_cta
- id: single_cta-2
  via: blackbox
  drivers:
  - rtlsim
  app: single_cta
- id: module_reload-1
  via: blackbox
  drivers:
  - simx
  app: module_reload
# Kernel-boundary flush coherence: back-to-back launches with host rewrites,
# rotating line ownership across cores and cross-launch read-modify-writes.
# The shapes cover a write-back L1, a write-back L2 shared by 4 cores, and a
# write-back L3 shared by two clusters, where every core flushes at once.
- id: flush_coherence-1
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: flush_coherence
# The xrt leg runs the RTL command processor's flush (broadcast write, then
# per-core reads).
- id: flush_coherence-2
  via: blackbox
  drivers:
  - simx
  - xrt
  app: flush_coherence
  shape:
    cores: 4
    l2cache: true
- id: flush_coherence-3
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: flush_coherence
  shape:
    clusters: 2
    cores: 2
    l2cache: true
    l3cache: true
# Flush ordering under random input backpressure (DBG_FLUSH_STALL): each round
# ends on a store burst, so a core's last writes are often still queued on one
# memory port or dcache lane while its token on another reaches the next level.
# Without a token per path these shapes lose those writes.
- id: flush_coherence-stress-1
  via: blackbox
  drivers:
  - rtlsim
  app: flush_coherence
  args: -n2048 -r8 -b16
  configs: -DDBG_FLUSH_STALL
  shape:
    cores: 4
    l2cache: true
- id: flush_coherence-stress-2
  via: blackbox
  drivers:
  - rtlsim
  app: flush_coherence
  args: -n2048 -r8 -b16
  configs: -DDBG_FLUSH_STALL
  shape:
    clusters: 2
    cores: 2
    l2cache: true
    l3cache: true
  tier: full
# Cores sharing a dcache: a lost lane store is only visible when it belongs to
# the core answered last, so this shape needs more rounds to expose it.
- id: flush_coherence-stress-3
  via: blackbox
  drivers:
  - rtlsim
  app: flush_coherence
  args: -n2048 -r24 -b16
  configs: -DDBG_FLUSH_STALL -DVX_CFG_SOCKET_SIZE=2
  shape:
    cores: 4
    l2cache: true
  tier: full

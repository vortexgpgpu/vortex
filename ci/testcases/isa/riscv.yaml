# Test cases for `riscv`, drafted from regression.sh.in (review/collapse).
category: isa
defaults:
  # The ISA suite covers atomics (rv32ua/rv64ua) and compressed (rv32uc/rv64uc),
  # so the sim must be built with those extensions — matching legacy regression
  # which built simx/rtlsim with EXT_A_ENABLE + EXT_C_ENABLE before the run.
  # Without them the sim correctly aborts on the first AMO op.
  configs: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_C_ENABLE"
  xlen:
  - 32
  - 64
  tier: smoke
tests:
- id: riscv-1
  via: make-run
  drivers:
  - simx
  dir: tests/riscv
  target: run-{driver}
- id: riscv-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv
  target: run-{driver}
- id: isa-32f-1
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-32f
- id: isa-32f-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-32f
- id: isa-32f-3
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-32f
- id: isa-32f-4
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-32f
# RTL FPU coverage: rebuild rtlsim with the pure-RTL FPU (VX_fpu_dsp -> VX_fma/
# fdiv/fsqrt/fcvt with USE_DSP=1) instead of the default DPI/softfloat model, and
# run the F32 ISA suite (rv32uf) against it. This is the only ISA lane that
# exercises the actual FPU hardware end-to-end — every other lane bypasses it via
# the DPI model. Scoped to xlen=32 (F32 datapath; the FLEN=64 RTL path is separate).
- id: isa-32f-dsp
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-32f
  configs+: "-DVX_CFG_FPU_TYPE_DSP"
  xlen:
  - 32
# The F64 ISA suite on the pure-RTL FPU with a separate F64 FMA core: F64 FMAs
# on their own pool of fma64-only PEs, two lanes each.
- id: isa-64d-dsp-fma64
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-64d
  configs+: "-DVX_CFG_FPU_TYPE_DSP -DVX_CFG_FMA64_PE_RATIO=2"
  xlen:
  - 64
# The F32 and F64 ISA suites on VX_fpu_std, the FPU the ASIC flow builds: its
# merged VX_fdivsqrt_unit and VX_fma_unit_rtl are not reached by the DSP lanes.
- id: isa-32f-std
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-32f
  configs+: "-DVX_CFG_FPU_TYPE_STD"
  xlen:
  - 32
- id: isa-64f-std
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-64f
  configs+: "-DVX_CFG_FPU_TYPE_STD"
  xlen:
  - 64
- id: isa-64d-std
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-64d
  configs+: "-DVX_CFG_FPU_TYPE_STD"
  xlen:
  - 64
- id: isa-64d-1
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-64d
- id: isa-64d-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-64d
- id: isa-64f-1
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-64f
- id: isa-64f-2
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-64f
- id: isa-64f-3
  via: make-run
  drivers:
  - rtlsim
  dir: tests/riscv/isa
  target: run-{driver}-64f

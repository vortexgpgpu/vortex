# TFU special-function unit (custom-2: rcp/rsqrt/ex2/lg2/sinpi/cospi/tanh).
# The `tfu` app self-enables VX_CFG_EXT_TFU_ENABLE and checks every result
# bit-exactly against the shared golden model (sw/common/tfu.cpp) plus libm
# accuracy bounds; the datapath itself is covered by unittest:hw-tfu.
category: isa
defaults:
  xlen:
  - 32
  - 64
  tier: smoke
  touches: [hw/rtl/tfu, hw/rtl/core/VX_sfu_unit.sv, hw/rtl/core/VX_sfu_block.sv, sim/simx/tfu_unit.cpp, sim/simx/sfu_unit.cpp, sw/common/tfu.cpp, sw/common/tfu_tables.h, sw/kernel/include/vx_tfu.h]
tests:
- id: tfu-1
  via: blackbox
  drivers:
  - simx
  app: tfu
# Wide warp: 16 threads serialized onto 1 TFU lane, 16 issue cycles per warp.
- id: tfu-nt16
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: tfu
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_NUM_WARPS=16
# One TFU lane per SFU lane (non-default): nothing is serialized.
- id: tfu-full-lanes
  via: blackbox
  drivers:
  - simx
  - rtlsim
  app: tfu
  configs: -DVX_CFG_NUM_TFU_LANES=4
- id: tfu-xrt
  via: blackbox
  drivers:
  - xrt
  app: tfu

# ---------------------------------------------------------------------------
# check: model_parity — SimX vs rtlsim (see core.yaml). Each run is sized to
# >=~300k cycles so steady-state TFU throughput dominates.
# ---------------------------------------------------------------------------

# Default shape: 4 threads over the 1 lane, repeated ex2 (~620k cycles).
- id: parity-tfu
  check: model_parity
  via: blackbox
  app: tfu
  args: -n1024 -r256 -tex2
# 8 threads serialized onto the 1 lane, repeated sinpi (~547k cycles).
- id: parity-tfu-nt8
  check: model_parity
  via: blackbox
  app: tfu
  args: -n2048 -r256 -tsinpi
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8
# 16 threads serialized onto the 1 lane, the fpga_gate shape (~532k cycles).
- id: parity-tfu-nt16
  check: model_parity
  via: blackbox
  app: tfu
  args: -n2048 -r256 -tsinpi
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_NUM_WARPS=16

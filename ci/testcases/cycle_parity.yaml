# SimX<->rtlsim cycle parity for the general GPU pipeline (no extensions).
#
# SimX is the timing model of the RTL, not just a functional oracle: every case
# here runs the SAME app/args/configs on both drivers and asserts (a) retired
# instructions match exactly (a mismatch is functional divergence) and (b) the
# reported cycle counts agree within `tolerance` (default 5%).
#
# Workloads are sized so steady state dominates (>=~300k cycles): a tiny kernel
# is all boot/dispatch skew and makes the gap ratio noisy. Extension parity
# cases (tensor*, rtu, raster/om/tex, dxa) live in their own category files.
category: cycle_parity
defaults:
  xlen:
  - 32
  - 64
  tier: fast
  # Any core-model or RTL change can move cycles; run on the full sweep.
  touches:
  - sim/simx/
  - hw/rtl/
tests:
# ALU/LSU/branch streaming pipeline (~314k cycles on the default 1-core shape).
- id: vecadd
  check: cycle_parity
  via: blackbox
  app: vecadd
  args: -n16384
# FPU + LSU locality, multi-warp reuse (~1.29M cycles on the default shape).
- id: sgemm
  check: cycle_parity
  via: blackbox
  app: sgemm
  args: -n64
